/* Selected action is a button; status labels are plain typography */

.state-text.done{color:var(--muted)!important}.state-text.available{color:var(--text)!important}.state-text.muted{color:var(--muted)!important}
/* Interactive detail panel flow. No blocking floating windows. */
.flow-head{display:flex;align-items:flex-start;gap:9px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px;color:var(--text)}
.flow-head .details-title{border:0;margin:0;padding:0;line-height:1.25}.flow-head .ic{color:var(--icon)}

.flow-item-title{font-size:calc(16px * var(--fontScale));font-weight:750;line-height:1.35;overflow-wrap:anywhere}
.flow-item-desc{color:var(--muted);font-size:calc(12px * var(--fontScale));line-height:1.6;margin-top:9px;white-space:pre-line}
.flow-notice{font-size:calc(12px * var(--fontScale));line-height:1.6;margin:16px 0;padding:11px;background:var(--infobg);border-radius:7px;border-left:2px solid var(--accent);color:var(--text)}
.flow-buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.flow-label{display:flex;gap:9px;justify-content:space-between;font-size:calc(12px * var(--fontScale));color:var(--muted);margin-top:20px}
.flow-meter{height:12px;border-radius:12px;overflow:hidden;background:var(--meterbg);border:1px solid var(--line);margin:9px 0 13px}
.flow-meter i{display:block;height:100%;background:linear-gradient(90deg,#2b80ba,#55b7db);border-radius:12px;transition:width .25s ease}
.flow-result{color:var(--text);border-left:3px solid var(--green);padding:12px 7px;display:flex;align-items:center;gap:8px;line-height:1.4;margin-top:22px}
.inline-notice{flex-shrink:0;background:var(--infobg);border:1px solid var(--line);border-left:3px solid var(--accent);padding:12px 15px;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--text)}
.inline-notice p{white-space:pre-line;margin:6px 0 0;color:var(--muted);line-height:1.45;font-size:calc(12px * var(--fontScale))}.inline-notice .flow-buttons{margin-top:0;flex-shrink:0}

.detail-app-image{width:46px;height:46px;object-fit:contain;border-radius:9px}

function renderPanelFlow(f=activeFlow()){

}
function beginPanelAction(title,description,callback,confirm=true,result='Operação fictícia concluída.'){
 const page=state.page,old=state.panelFlows[page];
 if(old&&['confirm','progress'].includes(old.phase)){state.mobileDetails=true;setNextFocus('[data-action="flow-cancel"]');render();return}
 if(old)rememberResult(old);
 delete state.panelNotes[page];
 const f={page,title,description,callback,phase:confirm?'confirm':'progress',percent:0,step:'Preparando simulação...',result,returnFocus:captureFocus()};

}
function runPanelFlow(){const f=activeFlow();if(!f)return;const serial=++flowSerial;f.phase='progress';f.percent=8;f.step='Preparando simulação...';setNextFocus('[data-action="flow-cancel"]');render();
 [[300,28,'Verificando condições fictícias...'],[800,59,'Executando operação ilustrativa...'],[1450,84,'Finalizando demonstração...']].forEach(([delay,percent,step])=>setTimeout(()=>{
 if(state.panelFlows[f.page]!==f||serial!==f.serial)return;f.percent=percent;f.step=step;if(state.page===f.page)render()
 },delay));
 f.serial=serial;
 setTimeout(()=>{
 if(state.panelFlows[f.page]!==f||serial!==f.serial)return;
 try{f.callback?.();f.phase='done'}catch(err){f.phase='failed';f.result='Falha de simulação: '+(err?.message||'erro desconhecido')}

 },1950)
}

function saveScroll(){const o={};document.querySelectorAll('.remember-scroll').forEach(e=>o[e.dataset.scrollId]={x:e.scrollLeft,y:e.scrollTop});return o}
function applySizeSlider(el){
  const ui=el.id==='uiScaleRange';
  if(!ui && el.id!=='fontScaleRange')return;
  const min=Number(el.min),max=Number(el.max);
  const percent=Math.min(max,Math.max(min,Math.round(Number(el.value))));
  el.value=String(percent);
  state.prefs[ui?'uiSize':'fontSize']=String(percent);
  el.setAttribute('aria-valuetext',percent+'%');
  el.style.setProperty('--range-progress',((percent-min)/(max-min)*100)+'%');
  const out=$(ui?'uiScaleValue':'fontScaleValue');
  if(out)out.textContent=percent+'%';
  applyPrefs();
}

 if(action==='install-update'){const item=state.updateItems[+id];if(item&&!item.installed){state.selection.sistema='wua';beginPanelAction('Instalar '+item.name,'A instalação é inteiramente fictícia.',()=>{item.installed=true},true,'Instalação registrada apenas neste protótipo.')}return}
 if(action==='wua-history'){state.selection.sistema='wua';inlineMessage('Histórico ilustrativo','KB-DEMO-001 · exemplo fictício.\nKB-DEMO-002 · exemplo fictício.\nNenhuma consulta ao histórico real do Windows.');return}
 if(action==='set-plan'){const name=['Padrão','Economia','Desempenho máximo'][+id];if(name&&name!==state.energy){state.selection.sistema='plan';beginPanelAction('Ativar '+name,'A escolha do plano de energia será simulada.',()=>{state.previousEnergy=state.energy;state.energy=name},true,'Perfil de energia alterado somente no protótipo.')}return}
 if(action==='restore-plan'){if(state.previousEnergy){state.selection.sistema='plan';beginPanelAction('Restaurar plano anterior','O plano anterior será restaurado apenas nos dados fictícios.',()=>{[state.previousEnergy,state.energy]=[state.energy,state.previousEnergy]},true,'Plano anterior restaurado na demonstração.')}return}
 if(action==='relieve-ram'){state.selection.sistema='ram';beginPanelAction('Aliviar RAM','Demonstração de gerenciamento de memória, sem terminar processos.',()=>{state.ramUsed=Math.max(8.2,+(state.ramUsed-.6).toFixed(1))},true,'Indicador fictício de RAM atualizado.');return}
 if(action==='toggle-start'){const s=state.startups.find(x=>x.id===id);if(s?.editable){state.selection.inicializacao=id;beginPanelAction((s.enabled?'Desativar':'Ativar')+' '+s.name,'A inicialização será alterada somente nos dados fictícios.',()=>{s.enabled=!s.enabled},true,'Entrada de inicialização alterada apenas na simulação.')}return}
 if(action==='privacy-info'){inlineMessage('Privacidade no protótipo','Nenhum dado é coletado ou transmitido. O GF real deve solicitar consentimento explícito.');return}
 if(action==='diagnostic'){inlineMessage('Diagnóstico demonstrativo','Windows: demonstração · RAM: valores ilustrativos · Dispositivos: exemplos.\nNenhum diagnóstico real foi executado.');return}
 if(action==='history'){inlineMessage('Histórico de registro demonstrativo','[DEMO] Protótipo aberto.\n[DEMO] Navegação e operações fictícias disponíveis.\n[DEMO] Nenhuma manutenção real.');return}
 if(action==='open-details'){state.mobileDetails=!state.mobileDetails;render();return}
}

function toggle(id){if(!(id in state.prefs))return;let val=!state.prefs[id];if(id==='admin'&&val){inlineMessage('Modo Administrador — simulação','Este seletor NÃO concede privilégios. Uma versão real precisaria solicitar UAC; as ações sensíveis ainda exigiriam confirmação.',()=>{state.prefs.admin=true},'Simular ativação');return}if(id==='collect'&&val){inlineMessage('Coleta de dados — consentimento ilustrativo','Não existe envio de dados nesta versão. O consentimento é representado apenas na interface.',()=>{state.prefs.collect=true},'Simular consentimento');return}state.prefs[id]=val;if(id==='automaticRam')state.selection.sistema='ram';render();toast('Preferência alterada somente nesta demonstração.')}

function selectItem(id){if(state.page==='aplicativos'||state.page==='drivers'||state.page==='limpeza'||state.page==='reparo'||state.page==='inicializacao'){state.selection[state.page]=id;render()}else if(state.page==='sistema'){if(id.startsWith('plan-'))state.selection.sistema='plan';render()}}
function applyViewport(v){const win=$('appWindow');if(v==='free'){win.style.width='min(1536px, calc(100vw - 34px))';win.style.height='calc(100vh - 76px)'}else{const [w,h]=v.split('x').map(Number);win.style.width=w+'px';win.style.height=h+'px'}$('stage').scrollTop=0;$('stage').scrollLeft=0;toast(v==='free'?'Tamanho livre: arraste o canto inferior direito da janela.':`Área de teste ajustada para ${v.replace('x',' × ')}.`)}
let dragInfo=null;
document.addEventListener('click',ev=>{const navEl=ev.target.closest('[data-nav]');if(navEl){state.page=navEl.dataset.nav;state.mobileDetails=false;setNextFocus(`[data-nav="${state.page}"]`);render();return}const chrome=ev.target.closest('[data-chrome]');if(chrome){let type=chrome.dataset.chrome;if(type==='max'){applyViewport($('previewSize').value==='free'?'1440x900':'free');$('previewSize').value=$('previewSize').value==='free'?'1440x900':'free'}else if(type==='min'){toast('Minimização simulada — o navegador permanece aberto.')}else toast('Para sair, feche a aba do navegador.');return}const toggleEl=ev.target.closest('[data-toggle]');if(toggleEl){toggle(toggleEl.dataset.toggle);return}const actionEl=ev.target.closest('[data-action]');if(actionEl){if(!actionEl.disabled)act(actionEl.dataset.action,actionEl.dataset.item);return}const row=ev.target.closest('[data-select]');if(row){selectItem(row.dataset.select)}});
document.addEventListener('input',ev=>{if(ev.target.classList?.contains('gf-size-slider')){applySizeSlider(ev.target);return;}if(ev.target.id==='searchInput'){const input=ev.target;const cursor=input.selectionStart??input.value.length;state.query[state.page]=input.value;render();const next=$('searchInput');next?.focus();next?.setSelectionRange(cursor,cursor)}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='sortSelect'){state.sort[state.page]=el.value;render()}else if(el.id==='themeSelect'||el.id==='quickTheme'){state.prefs.theme=el.value;render();toast('Tema visual aplicado somente ao protótipo.')}});
document.addEventListener('dragstart',ev=>{const row=ev.target.closest('[data-drag-row]');if(!row)return;dragInfo={id:row.dataset.dragRow,page:state.page};ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',dragInfo.id)});
document.addEventListener('dragover',ev=>{const row=ev.target.closest('[data-drag-row]');if(!row||!dragInfo||dragInfo.page!==state.page)return;ev.preventDefault();ev.dataTransfer.dropEffect='move';document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));row.classList.add('drop-target')});
document.addEventListener('drop',ev=>{const row=ev.target.closest('[data-drag-row]');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));if(!row||!dragInfo||dragInfo.page!==state.page)return;ev.preventDefault();const p=dragInfo.page,to=row.dataset.dragRow,from=dragInfo.id;const data=p==='aplicativos'?state.apps:state.drivers;const current=sortedItems(p,data).map(x=>x.id);const old=current.indexOf(from),dest=current.indexOf(to);if(old!==-1&&dest!==-1&&old!==dest){current.splice(old,1);current.splice(dest,0,from);state.customOrder[p]=current;state.sort[p]='manual';render();toast('Linha movida na ordem manual (somente no protótipo).')}dragInfo=null});
document.addEventListener('dragend',()=>{dragInfo=null;document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))});
let splitDrag=null;document.addEventListener('pointerdown',ev=>{const splitter=ev.target.closest('#detailsSplitter');if(splitter){let panel=$('detailsPanel');if(!panel)return;splitDrag={x:ev.clientX,w:panel.getBoundingClientRect().width};splitter.classList.add('dragging');splitter.setPointerCapture(ev.pointerId);ev.preventDefault()}});
document.addEventListener('pointermove',ev=>{if(!splitDrag)return;let n=Math.max(240,Math.min(460,splitDrag.w+(splitDrag.x-ev.clientX)));$('appWindow').style.setProperty('--details-width',n+'px')});
document.addEventListener('pointerup',()=>{splitDrag=null;document.querySelectorAll('.splitter.dragging').forEach(x=>x.classList.remove('dragging'))});
document.addEventListener('keydown',ev=>{
 const tag=ev.target?.tagName?.toLowerCase();const editable=tag==='input'||tag==='select'||tag==='textarea'||ev.target?.isContentEditable;
 if(ev.key==='Escape'){
   if(editable)return; // Escape belongs to the active input/select, not to another operation.
   const note=activeNote(),f=activeFlow();if(note){delete state.panelNotes[state.page];render();ev.preventDefault();return}
   if(f?.phase==='confirm'||f?.phase==='progress'){cancelPanelFlow();ev.preventDefault();return}
   return
 }
 if(ev.target.id==='detailsSplitter'&&['ArrowLeft','ArrowRight'].includes(ev.key)){
   let win=$('appWindow'),x=parseInt(win.style.getPropertyValue('--details-width'))||305;
   win.style.setProperty('--details-width',Math.max(240,Math.min(460,x+(ev.key==='ArrowLeft'?15:-15)))+'px');ev.preventDefault();return
 }
 if(!editable&&ev.target.matches('.nav-item')&&['ArrowUp','ArrowDown','Home','End'].includes(ev.key)){
   const items=[...document.querySelectorAll('.nav-item')];const i=items.indexOf(ev.target);
   if(i>=0){const next=ev.key==='Home'?0:ev.key==='End'?items.length-1:Math.max(0,Math.min(items.length-1,i+(ev.key==='ArrowDown'?1:-1)));ev.preventDefault();items[next].focus({preventScroll:true})}
   return
 }
 if(editable||ev.target.closest('button'))return;
 const row=ev.target.closest('[data-select]');if(!row)return;
 // Acesso por teclado à ordem manual, equivalente ao arrastar com o mouse.
 if(ev.altKey&&!ev.ctrlKey&&!ev.metaKey&&!ev.shiftKey&&['ArrowUp','ArrowDown'].includes(ev.key)&&['aplicativos','drivers'].includes(state.page)&&row.hasAttribute('data-drag-row')){
   ev.preventDefault();
   const p=state.page,all=p==='aplicativos'?state.apps:state.drivers;
   const order=sortedItems(p,all).map(x=>x.id);
   const from=order.indexOf(row.dataset.select),to=from+(ev.key==='ArrowUp'?-1:1);
   if(from>=0&&to>=0&&to<order.length){
     [order[from],order[to]]=[order[to],order[from]];
     state.customOrder[p]=[...order,...all.map(x=>x.id).filter(id=>!order.includes(id))];
     state.sort[p]='manual';state.selection[p]=row.dataset.select;
     setNextFocus(`[data-select="${row.dataset.select}"]`);render();
     document.querySelector(`[data-select="${row.dataset.select}"]`)?.scrollIntoView({block:'nearest'});
   }
   return
 }
 if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();selectItem(row.dataset.select);setNextFocus(`[data-select="${row.dataset.select}"]`);render();return}
 if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(ev.key))return;
 let siblings=[...row.parentElement.children].filter(x=>x.hasAttribute('data-select'));
 if(siblings.length<2)return;
 const i=siblings.indexOf(row);if(i<0)return;
 const delta=(ev.key==='ArrowDown'||ev.key==='ArrowRight')?1:-1;
 const j=ev.key==='Home'?0:ev.key==='End'?siblings.length-1:Math.max(0,Math.min(siblings.length-1,i+delta));
 const next=siblings[j];if(!next)return;ev.preventDefault();state.selection[state.page]=next.dataset.select;
 if(state.page==='sistema'&&next.dataset.select.startsWith('plan-'))state.selection.sistema='plan';
 setNextFocus(`[data-select="${next.dataset.select}"]`);render();document.querySelector(`[data-select="${next.dataset.select}"]`)?.scrollIntoView({block:'nearest'})
});
$('previewSize').addEventListener('change',ev=>applyViewport(ev.target.value));
$('resetDemo').addEventListener('click',()=>inlineMessage('Reiniciar simulação','Restaurar todas as seleções, listas, temas e dados fictícios?',()=>{flowSerial++;state=initialState();$('previewSize').value='free';applyViewport('free');render();toast('Simulação reiniciada.')},'Reiniciar agora'));
$('helpDemo').addEventListener('click',()=>inlineMessage('Como testar a interface','Abra as oito abas, pesquise/role/arraste as listas, altere o tema, experimente tamanhos e ajuste a divisória lateral. Ao clicar numa operação, use o painel direito para confirmar e acompanhar progresso fictício. Nenhuma função real do GF é executada.'));
render();
</script>
