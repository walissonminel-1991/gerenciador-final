name: GF - OLD detecta e baixa Draft real, depois L18 OLD-NEW
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - '.github/workflows/gf-github-draft-e2e.yml'
      - 'prototipos/autoatualizador-seguro/phase1-composed/GfOldDraftAcquire.cs.txt'
      - 'prototipos/autoatualizador-seguro/phase1-composed/github_draft_package.py'
      - 'prototipos/autoatualizador-seguro/phase1-composed/http_cut_server.py'
      - 'prototipos/autoatualizador-seguro/phase1-composed/http_cut_negative.ps1'
      - 'prototipos/autoatualizador-seguro/phase1-composed/http_cut_gui_observer.py'
      - 'prototipos/autoatualizador-seguro/phase1-composed/http_cut_gui_negative.ps1'
      - 'prototipos/autoatualizador-seguro/phase1-composed/http_cut_normal_negative.ps1'
      - 'prototipos/autoatualizador-seguro/phase1-composed/github_normal_gui_success.ps1'
      - 'prototipos/autoatualizador-seguro/phase1-composed/github_normal_gui_success_observer.py'
      - 'Program.cs'
      - 'prototipos/autoatualizador-seguro/phase1-composed/Phase1RecoveryTests.cs.txt'
      - 'prototipos/autoatualizador-seguro/phase1-composed/Phase1Recovery.cs.txt'
      - 'prototipos/autoatualizador-seguro/phase1-composed/phase1_lab.py'
      - 'prototipos/autoatualizador-seguro/m3-l16-signed-stage/L16Tests.cs.txt'
permissions:
  contents: write # Access to existing Draft requires a write-capable ephemeral GitHub token.
concurrency:
  group: gf-e2e-existing-draft-old-initiated
  cancel-in-progress: false
jobs:
  gf-old-initiated-draft-real:
    if: github.repository == 'walissonminel-1991/gerenciador-final' && github.ref == 'refs/heads/experimento-g5-ipc-chat-alto-20261029'
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout isolado sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET 10 fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Python 3.13 fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: TUF Python versoes de laboratorio existentes
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_TUF_DEPENDENCIES' }
      - name: Comprovar exclusao do protocolo de producao antes da compilacao
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $labFile='prototipos/autoatualizador-seguro/phase1-composed/GfOldDraftAcquire.cs.txt'
          $normal=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($normal.Items.Compile | Where-Object {$_.Identity -match 'GfOldDraftAcquire|prototipos[/\\]autoatualizador-seguro'}).Count -ne 0) { throw 'GF_E2E_SOURCE_LEAK_IN_PRODUCT' }
          $lab=dotnet msbuild GerenciadorAplicativos.csproj -p:GfE2eLab=true -getItem:Compile | ConvertFrom-Json
          if (@($lab.Items.Compile | Where-Object {$_.Identity -eq $labFile}).Count -ne 1) { throw 'GF_E2E_OLD_LAB_SOURCE_NOT_EXPLICIT' }
          Write-Host 'GF_E2E_COMPILE_ISOLATION regular_product_includes_lab=false test_mode_includes_one_source=true'
      - name: Compilar apenas GF OLD real com entrada opcional de homologacao
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $old=Join-Path $env:RUNNER_TEMP 'gf-e2e-old'
          if (Test-Path $old) { throw 'GF_E2E_OLD_NOT_FRESH' }
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:GfBetaProfile=local -p:GfE2eLab=true -p:Version=5.13.11.65 -o $old --nologo
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_OLD_BUILD_FAILED' }
          $oldVersion=[System.Reflection.AssemblyName]::GetAssemblyName((Join-Path $old 'GerenciadorFinal.dll')).Version.ToString()
          if ($oldVersion -ne '5.13.11.65') { throw 'GF_E2E_OLD_VERSION_MISMATCH' }
          Write-Host "GF_E2E_OLD_EXE_BUILD version=$oldVersion ephemeral_lab_mode=true"
      - name: Renovar metadados TUF de TESTE da Draft existente, sem trocar ZIP ou manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tag='gf-e2e-c5057bbbaf1d'
          $expectedArchiveId=694233137
          $expectedManifestId=694233139
          $release=(& gh api "repos/$env:GITHUB_REPOSITORY/releases/429695537" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or !$release.draft -or $release.tag_name -ne $tag -or @($release.assets).Count -ne 5) {
            throw 'GF_E2E_EXISTING_DRAFT_NOT_AUTHORIZED'
          }
          $zip=@($release.assets | Where-Object { $_.name -eq 'gf-e2e-new-win-x64.zip' })
          $manifest=@($release.assets | Where-Object { $_.name -eq 'GF-LAB-REAL-PACKAGE-MANIFEST.json' })
          if ($zip.Count -ne 1 -or $zip[0].id -ne $expectedArchiveId -or
              $zip[0].size -ne 57695630 -or $manifest.Count -ne 1 -or
              $manifest[0].id -ne $expectedManifestId -or $manifest[0].size -ne 72618) {
            throw 'GF_E2E_PINNED_ARCHIVE_OR_MANIFEST_ASSET_MISSING'
          }
          $inputFolder=Join-Path $env:RUNNER_TEMP 'gf-e2e-draft-manifest-input'
          $rolesFolder=Join-Path $env:RUNNER_TEMP 'gf-e2e-refresh-roles'
          if ((Test-Path $inputFolder) -or (Test-Path $rolesFolder)) { throw 'GF_E2E_REFRESH_NOT_FRESH' }
          New-Item -ItemType Directory -Path $inputFolder | Out-Null
          & gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $inputFolder --pattern 'GF-LAB-REAL-PACKAGE-MANIFEST.json'
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_MANIFEST_DOWNLOAD_FAILED' }
          $manifestPath=Join-Path $inputFolder 'GF-LAB-REAL-PACKAGE-MANIFEST.json'
          $sha=(Get-FileHash $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'a00de694e4418582e4e91231dc9f9bdd10ef541425479e1ce7e54477709f6e4d') { throw 'GF_E2E_MANIFEST_HASH_NOT_PINNED' }
          python prototipos/autoatualizador-seguro/phase1-composed/github_draft_package.py refresh --repo . --old (Join-Path $env:RUNNER_TEMP 'gf-e2e-old') --manifest-file $manifestPath --target $rolesFolder
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_TEST_TUF_REFRESH_FAILED' }
          $roles=@('targets.json','snapshot.json','timestamp.json') | ForEach-Object { Join-Path $rolesFolder $_ }
          & gh release upload $tag @roles --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_TUF_DRAFT_METADATA_UPLOAD_FAILED' }
          $after=(& gh api "repos/$env:GITHUB_REPOSITORY/releases/429695537" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or !$after.draft -or $after.tag_name -ne $tag -or
              @($after.assets).Count -ne 5 -or
              @($after.assets | Where-Object {$_.name -eq 'gf-e2e-new-win-x64.zip' -and $_.id -eq $expectedArchiveId}).Count -ne 1 -or
              @($after.assets | Where-Object {$_.name -eq 'GF-LAB-REAL-PACKAGE-MANIFEST.json' -and $_.id -eq $expectedManifestId}).Count -ne 1) {
            throw 'GF_E2E_DRAFT_METADATA_REFRESH_CHANGED_PACKAGE'
          }
          Write-Host 'GF_E2E_EXISTING_DRAFT_TUF_ROLES_FRESH release_id=429695537 test_only=true zip_and_target_unchanged=true'
      - name: Preparar ponte L18 existente e fixtures assinadas antes de abrir o GF OLD
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sourceWork=Join-Path $env:RUNNER_TEMP 'gf-e2e-pinned-source'
          $fixtures=Join-Path $env:RUNNER_TEMP 'gf-e2e-signed-fixtures'
          $outputs=Join-Path $env:RUNNER_TEMP 'gf-e2e-csharp-artifacts'
          $project='prototipos/autoatualizador-seguro/phase1-composed/Phase1RealBridge.csproj'
          $stageSource=(python prototipos/autoatualizador-seguro/m3-composed/prepare_pinned_source.py $sourceWork | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $stageSource)) { throw 'GF_E2E_PINNED_SOURCE_REQUIRED' }
          python prototipos/autoatualizador-seguro/m3-composed-3/generate_signed_fixtures.py $fixtures
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_SIGNED_FIXTURES_REQUIRED' }
          dotnet restore $project "-p:ArtifactsPath=$outputs" "-p:Stage8Source=$stageSource" --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_COORDINATOR_RESTORE' }
          dotnet build $project "-p:ArtifactsPath=$outputs" "-p:Stage8Source=$stageSource" -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_COORDINATOR_BUILD' }
          $exes=@(Get-ChildItem $outputs -Filter 'GF.Updater.M3.L18Tests.exe' -File -Recurse)
          if ($exes.Count -ne 1) { throw 'GF_E2E_COORDINATOR_NOT_UNIQUE' }
          "GF_E2E_L18_EXE=$($exes[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'GF_E2E_L18_EXISTING_COORDINATOR_PREPARED before_gf_old_start=true'
      - name: Startup real MainForm.Shown do GF OLD inicia download autonomo de Draft
        env:
          GH_TOKEN: ${{ github.token }}
          GF_E2E_STARTUP_DRAFT_PROBE: '1'
          GF_E2E_HANDOFF_L18: '1'
          GF_E2E_SELF_GRACEFUL_CLOSE: '1'
          GF_E2E_SELECTED_NEW_CONTINUATION: '1'
          GF_E2E_LIVE_INSTALL_SWAP: '1'
          GF_E2E_POST_OWNER_PERSISTENCE: '1'
          GF_E2E_SWAP_CUT_AFTER_OLD_MOVE: '1'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-e2e-old\GerenciadorFinal.exe'
          $private=Join-Path $env:RUNNER_TEMP 'gf-e2e-install-data'
          $preserved=Join-Path $env:RUNNER_TEMP 'gf-e2e-old-preserved'
          if ((Test-Path $private) -or (Test-Path $preserved)) {
            throw 'GF_E2E_INSTALL_ROOTS_MUST_BE_FRESH'
          }
          [System.IO.Directory]::CreateDirectory($private) | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $private 'PERSONAL-KEEP-UNCHANGED.txt'),
            ("DO-NOT-TOUCH-MY-DATA" + [char]10), [System.Text.UTF8Encoding]::new($false))
          $shown=Join-Path $env:RUNNER_TEMP 'gf-e2e-startup-shown.json'
          $proof=Join-Path $env:RUNNER_TEMP 'gf-e2e-old-acquire-report.json'
          $failure=Join-Path $env:RUNNER_TEMP 'gf-e2e-old-acquire-failure.json'
          $handoff=Join-Path $env:RUNNER_TEMP 'gf-e2e-old-l18-handoff-report.json'
          $selected=Join-Path $env:RUNNER_TEMP 'gf-e2e-selected-new-ready.json'
          $uiClosed=Join-Path $env:RUNNER_TEMP 'gf-e2e-old-ui-closed.json'
          $loopExited=Join-Path $env:RUNNER_TEMP 'gf-e2e-old-message-loop-exited.json'
          $nativeVisible=Join-Path $env:RUNNER_TEMP 'gf-e2e-old-normal-preclose-win32.json'
          if ((Test-Path $nativeVisible)) { throw 'GF_E2E_NORMAL_PRE_CLOSE_NOT_FRESH' }
          if ((Test-Path $shown) -or (Test-Path $proof) -or (Test-Path $failure) -or
              (Test-Path $selected) -or (Test-Path $uiClosed) -or (Test-Path $loopExited) -or
              (Test-Path (Join-Path $env:RUNNER_TEMP 'gf-e2e-github-download'))) {
            throw 'GF_E2E_STARTUP_ALREADY_TRIED'
          }
          # The disposable GF OLD executable has lab-specific bytes,
          # deliberately different from the immutable Draft's OLD manifest.
          # Capture its ACTUAL complete pre-start file set for preservation
          # comparison. This local baseline is NOT update trust authority.
          $capture=@'
          import hashlib,json,os
          from pathlib import Path
          runner=Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          root=runner/"gf-e2e-old"
          assert root.is_dir() and root.resolve(strict=True)==root
          inventory={}
          for directory,subdirs,files in os.walk(root,followlinks=False):
              for name in subdirs+files:
                  path=Path(directory)/name
                  assert not path.is_symlink() and not path.stat().st_file_attributes&0x400
              for filename in files:
                  p=Path(directory)/filename
                  inventory[p.relative_to(root).as_posix()]={
                      "length":p.stat().st_size,
                      "sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
          assert len(inventory)>80 and "GerenciadorFinal.exe" in inventory
          target=runner/"gf-e2e-old-prestart-files.json"
          with target.open("x",encoding="utf8") as stream:
              json.dump(inventory,stream,sort_keys=True)
          print("GF_E2E_OLD_LAB_PRESTART_BASELINE files="+str(len(inventory)))
          '@
          $capture | python -
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_OLD_LAB_PRESTART_BASELINE_FAILED' }
          # One real GF OLD instance, normally opened (NO --tray), is reused
          # by the existing LIVE L18 selected NEW/2 and physical-cut scenario.
          # This removes the previously untested tray-only startup dependency.
          $proc=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            # Inspect the NATIVE visible MainForm before any authorized close.
            # Independent Win32 calls; no ShowWindow, no synthetic UI receipts,
            # no attempt to influence L18 selector/journal or process lifetime.
            $env:GF_E2E_NATIVE_OLD_PID="$($proc.Id)"
            $observe=@'
          import hashlib,json,os,sys,time
          from pathlib import Path
          work=Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          sys.path.insert(0,str(work/"prototipos"/"autoatualizador-seguro"/"phase1-composed"))
          from win32_process_observation import (
              own_main_windows,process_image_path,message_pump_ping,desktop_observation
          )
          from http_cut_gui_observer import consent_dialogs_for_pid
          runner=Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          exe=(runner/"gf-e2e-old"/"GerenciadorFinal.exe").resolve(strict=True)
          target=runner/"gf-e2e-old-normal-preclose-win32.json"
          assert not target.exists() and exe.parent==runner/"gf-e2e-old"
          pid=int(os.environ["GF_E2E_NATIVE_OLD_PID"])
          deadline=time.monotonic()+40
          window=None
          while time.monotonic()<deadline:
              windows=own_main_windows(pid)
              if len(windows)==1 and windows[0]["visible"]:
                  hwnd=windows[0]["hwnd"]
                  actual=process_image_path(pid)
                  if (actual is not None and os.path.samefile(actual,exe)
                          and message_pump_ping(hwnd)
                          and not consent_dialogs_for_pid(pid)):
                      window=hwnd
                      break
              time.sleep(0.12)
          assert window is not None,"GF_E2E_NORMAL_MAINFORM_NATIVE_VISIBLE_MISSING"
          assert desktop_observation()["interactive_user_desktop_verified"]
          with target.open("x",encoding="utf-8") as out:
              json.dump({"schema":"gf-e2e-old-normal-preclose-win32/1",
                  "old_process_id":pid,"native_mainform_visible":True,
                  "owned_process_image_verified":True,"message_pump_responded":True,
                  "no_tray_argument":True,"no_showwindow_called":True,
                  "no_privacy_modal_observed":True,"test_only":True,
                  "operational_ready":False},out,sort_keys=True)
              out.flush();os.fsync(out.fileno())
          print("GF_E2E_NORMAL_OLD_PRE_CLOSE_WIN32_PASS "
                "mainform=natively_visible+responsive original_old=true "
                "no_tray=true no_showwindow=true READY=false",flush=True)
          '@
            $observe | python -u -
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $nativeVisible)) {
              throw 'GF_E2E_NORMAL_MAINFORM_PRE_CLOSE_WIN32_FAILURE'
            }

            $deadline=[DateTime]::UtcNow.AddMinutes(9)
            while ([DateTime]::UtcNow -lt $deadline) {
              if ((Test-Path $failure) -or $proc.HasExited) { break }
              Start-Sleep -Milliseconds 250
            }
            if (Test-Path $failure) {
              Write-Host "GF_E2E_OLD_ACQUISITION_DIAGNOSTIC $(Get-Content $failure -Raw)"
              throw 'GF_E2E_STARTUP_DOWNLOAD_FAILED_CLOSED'
            }
            if (!(Test-Path $shown)) { throw 'GF_E2E_REAL_MAINFORM_STARTUP_NOT_PROVEN' }
            $w=Get-Content $shown -Raw | ConvertFrom-Json
            if ($w.schema -ne 'gf-e2e-startup-shown/1' -or
                $w.startup_event -ne 'MainForm.Shown' -or
                !$w.real_mainform_handle_created -or !$w.test_only -or
                $w.operational_ready) { throw 'GF_E2E_MAINFORM_MARKER_INVALID' }
            if (!(Test-Path $proof)) { throw 'GF_E2E_STARTUP_REMOTE_DOWNLOAD_NOT_COMPLETED' }
            if (!(Test-Path $selected)) { throw 'GF_E2E_L18_NEW_2_FENCE_BEFORE_OLD_EXIT_NOT_PROVEN' }
            $normalProof=Get-Content -LiteralPath $nativeVisible -Raw | ConvertFrom-Json
            if ($normalProof.schema -ne 'gf-e2e-old-normal-preclose-win32/1' -or
                $normalProof.old_process_id -ne $proc.Id -or
                !$normalProof.native_mainform_visible -or
                !$normalProof.owned_process_image_verified -or
                !$normalProof.message_pump_responded -or
                !$normalProof.no_tray_argument -or !$normalProof.no_showwindow_called -or
                !$normalProof.no_privacy_modal_observed -or
                !$normalProof.test_only -or $normalProof.operational_ready) {
              throw 'GF_E2E_NORMAL_MAINFORM_INDEPENDENT_PROOF_INVALID'
            }
            $selectedProof=Get-Content $selected -Raw | ConvertFrom-Json
            if ($selectedProof.schema -ne 'gf-e2e-selected-new-ready/1' -or
                $selectedProof.selector -ne 'new' -or $selectedProof.generation -ne 2 -or
                !$selectedProof.launch_fenced -or !$selectedProof.l18_live_owner -or
                !$selectedProof.test_only -or $selectedProof.operational_ready) {
              throw 'GF_E2E_L18_PRELAUNCH_BARRIER_INVALID'
            }
            if (!$proc.HasExited) { throw 'GF_E2E_ORIGINAL_OLD_DID_NOT_EXIT_NORMALLY' }
            if ($proc.ExitCode -ne 0) { throw "GF_E2E_ORIGINAL_OLD_EXIT_CODE_$($proc.ExitCode)" }
            if (!(Test-Path $uiClosed) -or !(Test-Path $loopExited)) { throw 'GF_E2E_ORIGINAL_OLD_GRACEFUL_MESSAGE_LOOP_NOT_PROVEN' }
            $uiProof=Get-Content $uiClosed -Raw | ConvertFrom-Json
            $loopProof=Get-Content $loopExited -Raw | ConvertFrom-Json
            if ($uiProof.schema -ne 'gf-e2e-old-form-closed/1' -or
                !$uiProof.form_closed_event -or
                $uiProof.close_reason -ne 'UserClosing' -or
                !$uiProof.test_only -or $uiProof.operational_ready -or
                $loopProof.schema -ne 'gf-e2e-old-message-loop-exited/1' -or
                !$loopProof.application_run_returned -or
                $loopProof.verified_handoff_preceded_close -or
                !$loopProof.selected_new_fenced_before_close -or
                !$loopProof.test_only -or $loopProof.operational_ready) {
              throw 'GF_E2E_ORIGINAL_OLD_CLOSE_EVIDENCE_INVALID'
            }
            Write-Host 'GF_E2E_ORIGINAL_OLD_GRACEFUL_EXIT proof=FormClosed+Application.Run+ExitCode0 forced_cleanup=false ready=false'
            # NEW is not launched until the SAME L18 live owner has held
            # the original OLD process handle through its observed exit.
            # The L18 completion report is checked later, not by the OLD.
            Write-Host 'GF_E2E_OLD_EXIT_BEFORE_SAME_L18_SELECTED_NEW selector=new/2 original_old_exit=0 READY=false'
            Write-Host 'GF_E2E_NORMAL_MAINFORM_SELECTED_CLOSE_PASS native_ui_before_close=true l18_selector=new/2 launch_fence=true FormClosed=true MessageLoopExited=true OLD_exit0=true READY=false'
          }
          finally {
            if (!$proc.HasExited) {
              $requested=$proc.CloseMainWindow()
              if (!$proc.WaitForExit(12000)) {
                # Failure-only cleanup of this exact owned process; never
                # interpret forced cleanup as passing the graceful-exit test.
                $proc.Kill()
                $proc.WaitForExit(12000) | Out-Null
                Write-Host 'GF_E2E_STARTUP_CHILD_TEST_CLEANUP_ONLY; graceful_exit_not_claimed=true'
              }
            }
            $proc.Dispose()
          }
          if (!(Test-Path $proof)) { throw 'GF_E2E_OLD_SELF_ACQUIRE_EVIDENCE_MISSING' }
          $r=Get-Content $proof -Raw | ConvertFrom-Json
          if ($r.schema -ne 'gf-e2e-old-github-draft/1' -or
              $r.observed_version -ne '5.13.11.65' -or
              $r.draft_release_id -ne 429695537 -or
              $r.draft_tag -ne 'gf-e2e-c5057bbbaf1d' -or
              $r.downloaded_file_count -ne 5 -or
              !$r.real_dotnet_httpclient -or !$r.initiated_by_gf_old_executable -or
              $r.downloaded_archive_sha256 -ne '3eadafed91c4090ea56c9e9be8175f8ece8acf05d9c7fda9f97db7644a33011e' -or
              !$r.test_only -or $r.operational_ready -or $r.automatic_recovery_authorized) {
            throw 'GF_E2E_OLD_ACQUISITION_PROOF_INVALID'
          }
          $folder=Join-Path $env:RUNNER_TEMP 'gf-e2e-github-download'
          if (@(Get-ChildItem -LiteralPath $folder -File).Count -ne 5) { throw 'GF_E2E_OLD_DOWNLOAD_FILE_SET' }
          Write-Host "GF_E2E_OLD_INITIATED_DOWNLOAD version=$($r.observed_version) draft=$($r.draft_tag) dotnet=true assets=5"
      - name: Revalidar TUF da Draft NEW baixada pelo GF e extrair em local isolado
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script='prototipos/autoatualizador-seguro/phase1-composed/github_draft_package.py'
          # The ORIGINAL L18 owner runs asynchronously after GF OLD exits.
          # Do not mistake a not-yet-created backup for failed TUF
          # authentication: observe the FIRST directory move before
          # reading OLD for verification. This is bounded READ-ONLY
          # synchronization, never retry/rollback of the update.
          $backupOld=Join-Path $env:RUNNER_TEMP 'gf-e2e-old-preserved'
