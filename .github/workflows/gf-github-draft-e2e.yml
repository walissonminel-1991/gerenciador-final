name: GF - OLD detecta e baixa Draft real, depois L18 OLD-NEW
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - '.github/workflows/gf-github-draft-e2e.yml'
      - 'prototipos/autoatualizador-seguro/phase1-composed/GfOldDraftAcquire.cs.txt'
permissions:
  contents: write # Access to existing Draft requires a write-capable ephemeral GitHub token.
concurrency:
  group: gf-e2e-existing-draft-old-initiated
  cancel-in-progress: false
jobs:
  gf-old-initiated-draft-real:
    if: github.repository == 'walissonminel-1991/gerenciador-final' && github.ref == 'refs/heads/experimento-g5-ipc-chat-alto-20261029'
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout isolado sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET 10 fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Python 3.13 fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: TUF Python versoes de laboratorio existentes
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_TUF_DEPENDENCIES' }
      - name: Comprovar exclusao do protocolo de producao antes da compilacao
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $labFile='prototipos/autoatualizador-seguro/phase1-composed/GfOldDraftAcquire.cs.txt'
          $normal=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($normal.Items.Compile | Where-Object {$_.Identity -match 'GfOldDraftAcquire|prototipos[/\\]autoatualizador-seguro'}).Count -ne 0) { throw 'GF_E2E_SOURCE_LEAK_IN_PRODUCT' }
          $lab=dotnet msbuild GerenciadorAplicativos.csproj -p:GfE2eLab=true -getItem:Compile | ConvertFrom-Json
          if (@($lab.Items.Compile | Where-Object {$_.Identity -eq $labFile}).Count -ne 1) { throw 'GF_E2E_OLD_LAB_SOURCE_NOT_EXPLICIT' }
          Write-Host 'GF_E2E_COMPILE_ISOLATION regular_product_includes_lab=false test_mode_includes_one_source=true'
      - name: Compilar apenas GF OLD real com entrada opcional de homologacao
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $old=Join-Path $env:RUNNER_TEMP 'gf-e2e-old'
          if (Test-Path $old) { throw 'GF_E2E_OLD_NOT_FRESH' }
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:GfBetaProfile=local -p:GfE2eLab=true -p:Version=5.13.11.65 -o $old --nologo
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_OLD_BUILD_FAILED' }
          $oldVersion=[System.Reflection.AssemblyName]::GetAssemblyName((Join-Path $old 'GerenciadorFinal.dll')).Version.ToString()
          if ($oldVersion -ne '5.13.11.65') { throw 'GF_E2E_OLD_VERSION_MISMATCH' }
          Write-Host "GF_E2E_OLD_EXE_BUILD version=$oldVersion ephemeral_lab_mode=true"
      - name: Renovar metadados TUF de TESTE da Draft existente, sem trocar ZIP ou manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tag='gf-e2e-c5057bbbaf1d'
          $expectedArchiveId=694233137
          $expectedManifestId=694233139
          $release=(& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or !$release.draft -or $release.tag_name -ne $tag -or @($release.assets).Count -ne 5) {
            throw 'GF_E2E_EXISTING_DRAFT_NOT_AUTHORIZED'
          }
          $zip=@($release.assets | Where-Object { $_.name -eq 'gf-e2e-new-win-x64.zip' })
          $manifest=@($release.assets | Where-Object { $_.name -eq 'GF-LAB-REAL-PACKAGE-MANIFEST.json' })
          if ($zip.Count -ne 1 -or $zip[0].id -ne $expectedArchiveId -or
              $zip[0].size -ne 57695630 -or $manifest.Count -ne 1 -or
              $manifest[0].id -ne $expectedManifestId -or $manifest[0].size -ne 72618) {
            throw 'GF_E2E_PINNED_ARCHIVE_OR_MANIFEST_ASSET_MISSING'
          }
          $inputFolder=Join-Path $env:RUNNER_TEMP 'gf-e2e-draft-manifest-input'
          $rolesFolder=Join-Path $env:RUNNER_TEMP 'gf-e2e-refresh-roles'
          if ((Test-Path $inputFolder) -or (Test-Path $rolesFolder)) { throw 'GF_E2E_REFRESH_NOT_FRESH' }
          New-Item -ItemType Directory -Path $inputFolder | Out-Null
          & gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $inputFolder --pattern 'GF-LAB-REAL-PACKAGE-MANIFEST.json'
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_MANIFEST_DOWNLOAD_FAILED' }
          $manifestPath=Join-Path $inputFolder 'GF-LAB-REAL-PACKAGE-MANIFEST.json'
          $sha=(Get-FileHash $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'a00de694e4418582e4e91231dc9f9bdd10ef541425479e1ce7e54477709f6e4d') { throw 'GF_E2E_MANIFEST_HASH_NOT_PINNED' }
          python prototipos/autoatualizador-seguro/phase1-composed/github_draft_package.py refresh --repo . --old (Join-Path $env:RUNNER_TEMP 'gf-e2e-old') --manifest-file $manifestPath --target $rolesFolder
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_TEST_TUF_REFRESH_FAILED' }
          $roles=@('targets.json','snapshot.json','timestamp.json') | ForEach-Object { Join-Path $rolesFolder $_ }
          & gh release upload $tag @roles --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_TUF_DRAFT_METADATA_UPLOAD_FAILED' }
          $after=(& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or !$after.draft -or $after.tag_name -ne $tag -or
              @($after.assets).Count -ne 5 -or
              @($after.assets | Where-Object {$_.name -eq 'gf-e2e-new-win-x64.zip' -and $_.id -eq $expectedArchiveId}).Count -ne 1 -or
              @($after.assets | Where-Object {$_.name -eq 'GF-LAB-REAL-PACKAGE-MANIFEST.json' -and $_.id -eq $expectedManifestId}).Count -ne 1) {
            throw 'GF_E2E_DRAFT_METADATA_REFRESH_CHANGED_PACKAGE'
          }
          Write-Host 'GF_E2E_EXISTING_DRAFT_TUF_ROLES_FRESH release_id=429695537 test_only=true zip_and_target_unchanged=true'
      - name: O proprio GF OLD consulta GitHub Draft e baixa os cinco assets via HttpClient
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-e2e-old\GerenciadorFinal.exe'
          $proc=Start-Process -FilePath $exe -ArgumentList '--gf-e2e-draft-acquire' -WorkingDirectory (Split-Path $exe) -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            $failure=Join-Path $env:RUNNER_TEMP 'gf-e2e-old-acquire-failure.json'
            if (Test-Path $failure) { Write-Host "GF_E2E_OLD_ACQUISITION_DIAGNOSTIC $(Get-Content $failure -Raw)" }
            throw "GF_E2E_OLD_SELF_ACQUIRE_FAILED exit=$($proc.ExitCode)"
          }
          $proof=Join-Path $env:RUNNER_TEMP 'gf-e2e-old-acquire-report.json'
          if (!(Test-Path $proof)) { throw 'GF_E2E_OLD_SELF_ACQUIRE_EVIDENCE_MISSING' }
          $r=Get-Content $proof -Raw | ConvertFrom-Json
          if ($r.schema -ne 'gf-e2e-old-github-draft/1' -or
              $r.observed_version -ne '5.13.11.65' -or
              $r.draft_release_id -ne 429695537 -or
              $r.draft_tag -ne 'gf-e2e-c5057bbbaf1d' -or
              $r.downloaded_file_count -ne 5 -or
              !$r.real_dotnet_httpclient -or !$r.initiated_by_gf_old_executable -or
              $r.downloaded_archive_sha256 -ne '3eadafed91c4090ea56c9e9be8175f8ece8acf05d9c7fda9f97db7644a33011e' -or
              !$r.test_only -or $r.operational_ready -or $r.automatic_recovery_authorized) {
            throw 'GF_E2E_OLD_ACQUISITION_PROOF_INVALID'
          }
          $folder=Join-Path $env:RUNNER_TEMP 'gf-e2e-github-download'
          if (@(Get-ChildItem -LiteralPath $folder -File).Count -ne 5) { throw 'GF_E2E_OLD_DOWNLOAD_FILE_SET' }
          Write-Host "GF_E2E_OLD_INITIATED_DOWNLOAD version=$($r.observed_version) draft=$($r.draft_tag) dotnet=true assets=5"
      - name: Revalidar TUF da Draft NEW baixada pelo GF e extrair em local isolado
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script='prototipos/autoatualizador-seguro/phase1-composed/github_draft_package.py'
          python $script verify --repo . --old (Join-Path $env:RUNNER_TEMP 'gf-e2e-old') --downloaded (Join-Path $env:RUNNER_TEMP 'gf-e2e-github-download') --extracted (Join-Path $env:RUNNER_TEMP 'gf-e2e-authenticated-new') --lab-old-variant
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_OLD_DOWNLOADED_NEW_NOT_AUTHENTIC' }
          $newVersion=[System.Reflection.AssemblyName]::GetAssemblyName((Join-Path $env:RUNNER_TEMP 'gf-e2e-authenticated-new\GerenciadorFinal.dll')).Version.ToString()
          if ($newVersion -ne '5.13.11.66') { throw 'GF_E2E_DOWNLOADED_VERSION_NOT_NEWER' }
          Write-Host "GF_E2E_REAL_REMOTE_VERSIONS old=5.13.11.65 new=$newVersion"
      - name: Mesmo coordenador C# L18 executa OLD e NEW vindos do GitHub
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sourceWork=Join-Path $env:RUNNER_TEMP 'gf-e2e-pinned-source'
          $fixtures=Join-Path $env:RUNNER_TEMP 'gf-e2e-signed-fixtures'
          $outputs=Join-Path $env:RUNNER_TEMP 'gf-e2e-csharp-artifacts'
          $project='prototipos/autoatualizador-seguro/phase1-composed/Phase1RealBridge.csproj'
          $stageSource=(python prototipos/autoatualizador-seguro/m3-composed/prepare_pinned_source.py $sourceWork | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $stageSource)) { throw 'GF_E2E_PINNED_SOURCE_REQUIRED' }
          python prototipos/autoatualizador-seguro/m3-composed-3/generate_signed_fixtures.py $fixtures
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_SIGNED_FIXTURES_REQUIRED' }
          dotnet restore $project "-p:ArtifactsPath=$outputs" "-p:Stage8Source=$stageSource" --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_COORDINATOR_RESTORE' }
          dotnet build $project "-p:ArtifactsPath=$outputs" "-p:Stage8Source=$stageSource" -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_COORDINATOR_BUILD' }
          $exes=@(Get-ChildItem $outputs -Filter 'GF.Updater.M3.L18Tests.exe' -File -Recurse)
          if ($exes.Count -ne 1) { throw 'GF_E2E_COORDINATOR_NOT_UNIQUE' }
          $root=(Resolve-Path '.').Path
          $anchor=Join-Path $root 'prototipos/autoatualizador-seguro/fixtures/bootstrap.test-only.json'
          $script=Join-Path $root 'prototipos/autoatualizador-seguro/phase1-composed/phase1_lab.py'
          $old=Join-Path $env:RUNNER_TEMP 'gf-e2e-old'
          $new=Join-Path $env:RUNNER_TEMP 'gf-e2e-authenticated-new'
          $report=Join-Path $env:RUNNER_TEMP 'gf-e2e-real-flow-report.json'
          $pythonExe=(Get-Command python).Source
          & $exes[0].FullName --real-suite $report $fixtures $anchor $root $pythonExe $script $old $new
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_REAL_L18_SUITE_FAILED' }
          $r=Get-Content $report -Raw | ConvertFrom-Json
          $normal=@($r.tests | Where-Object {$_.test -eq 'normal'})
          if ($r.failed -ne 0 -or $r.expected_cases -ne 29 -or @($r.tests).Count -ne 29 -or
              $normal.Count -ne 1 -or $normal[0].status -ne 'passed' -or
              !$normal[0].normal_owner_completed_without_crash -or
              !$normal[0].manifest_and_object_identities_rechecked -or
              !$normal[0].old_and_canary_preserved -or
              $normal[0].outcome -ne 'UnknownBlocked' -or
              @($r.tests | Where-Object {$_.classification -ne 'PASS_CONTAINMENT'}).Count -ne 0 -or
              $r.operational_ready -or $r.phase1_complete -or $r.production_tuf_authority) {
            throw 'GF_E2E_REAL_HOLD_OR_FUNCTIONAL_PROOF_FAILED'
          }
          Write-Host 'GF_E2E_GF_OLD_STARTS_DOWNLOAD_DOTNET_AND_L18_RUNS_NEW old=5.13.11.65 new=5.13.11.66 all_29=PASS_CONTAINMENT ready=false'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @(
            '## GF OLD iniciou consulta e download do GitHub Draft via .NET'
            '- OLD real test-only 5.13.11.65 iniciou o cliente e baixou os cinco assets com o proprio executavel.'
            '- Python-TUF laboratorio autenticou o NEW e verificou o ZIP e arquivos antes de encaminhar ao L18.'
            '- L18 unico executou OLD/NEW reais na matriz de 29 casos; HOLD/UnknownBlocked preservado.'
            '- Este e um subcomando de LAB do OLD e NAO atualizacao automatica na interface normal.'
            '- READY operacional e recuperacao automatica permanecem proibidos.'
          )
      - name: Negativos de pacote real adulterado e transferencia incompleta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script='prototipos/autoatualizador-seguro/phase1-composed/github_draft_package.py'
          python $script negative --repo . --old (Join-Path $env:RUNNER_TEMP 'gf-e2e-old') --downloaded (Join-Path $env:RUNNER_TEMP 'gf-e2e-github-download') --target (Join-Path $env:RUNNER_TEMP 'gf-e2e-negatives') --lab-old-variant
          if ($LASTEXITCODE -ne 0) { throw 'GF_E2E_PACKAGE_NEGATIVES_FAILED' }
# Only three TEST TUF metadata role assets are refreshed in the existing Draft. Never publish it or change executable ZIP/manifest.
