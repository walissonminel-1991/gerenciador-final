name: GF D2.4 - cadeia D0 TUF para HttpClient inerte
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/github-d24-integrated/**'
      - '.github/workflows/gf-d24-inert-integrated-lab.yml'
      - 'prototipos/autoatualizador-seguro/github-d23-dotnet-loopback/HttpClientLoopback.cs.txt'
      - 'prototipos/autoatualizador-seguro/github-d2-inert/d2_inert_lab.py'
permissions:
  contents: read
concurrency:
  group: gf-d24-inert-chain
  cancel-in-progress: false
jobs:
  d24-windows-chain:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET 10 fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python 3.13 fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Bibliotecas TUF do laboratorio fixadas
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'D24_DEPENDENCIES_FAILED' }
      - name: Verificar isolamento do executavel principal
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($p.Items.Compile | Where-Object {$_.Identity -match 'prototipos[/\\]autoatualizador-seguro'}).Count -ne 0) {
            throw 'D24_EXPERIMENTAL_CODE_IN_PRODUCT'
          }
      - name: Compilar a fonte original D0 e a fonte compartilhada D2.3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $d0=Join-Path $env:RUNNER_TEMP 'gf-d24-d0'
          $d24=Join-Path $env:RUNNER_TEMP 'gf-d24-bridge'
          dotnet build prototipos/autoatualizador-seguro/github-trust-lab/GF.D11.D0Probe.csproj -c Release -r win-x64 --self-contained false -o $d0 --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $d0 'GF.D11.D0Probe.exe'))) {
            throw 'D24_D0_BUILD'
          }
          dotnet build prototipos/autoatualizador-seguro/github-d24-integrated/GF.D24.InertChainLab.csproj -c Release -r win-x64 --self-contained false -o $d24 --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $d24 'GF.D24.InertChainLab.exe'))) {
            throw 'D24_SHARED_D23_BUILD'
          }
      - name: D0 TUF e HttpClient integrados sem autoridade de producao
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $d0=Join-Path $env:RUNNER_TEMP 'gf-d24-d0\GF.D11.D0Probe.exe'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-d24-bridge\GF.D24.InertChainLab.exe'
          $script='prototipos/autoatualizador-seguro/github-d24-integrated/d24_chain_lab.py'
          $line=(python $script $d0 $exe | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$line -or !$line.StartsWith('GF_D24_RESULT ')) {
            throw 'D24_TEST_INCOMPLETE'
          }
          $r=$line.Substring('GF_D24_RESULT '.Length) | ConvertFrom-Json
          Write-Host $line
          if ($r.schema -ne 'gf-d242-csharp-owned-tuf-session/1' -or
              $r.status -ne 'passed' -or
              $r.positive_inert_sessions -ne 1 -or
              $r.negative_sessions_rejected -ne 15 -or
              $r.synthetic_receipts_rejected -ne 7 -or
              !$r.embedded_tuf_validator_source -or
              !$r.csharp_owns_child_and_stage -or
              !$r.old_direct_manifest_sha_handoff_rejected -or
              !$r.bootstrap_single_pinned_snapshot_used -or
              !$r.shared_dotnet_d23_transport -or
              !$r.session_replay_rejected -or
              $r.secure_against_same_user_process_replacement -or
              $r.persistent_tuf_history_rollback_proven -or
              $r.same_user_ntfs_toctou_proven -or
              !$r.test_signer_public_only -or
              $r.external_requests -ne 0 -or
              $r.downloaded_executables -ne 0 -or
              $r.installations -ne 0 -or
              $r.product_modified -or
              $r.operational_ready -or
              $r.automatic_recovery_authorized) {
            throw 'D242_UNSUPPORTED_SECURITY_CONCLUSION'
          }
          Write-Host $line
# No product change, GitHub release, downloader, installer, recovery, merge or deploy.
