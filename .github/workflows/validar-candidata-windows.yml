name: Validar candidata Windows

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: regressao-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  telemetria-beta:
    name: Consentimento BETA antecipado (sem rede)
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET fixo
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Gate de compilacao conectada deve recusar aprovacoes pendentes
        shell: pwsh
        run: |
          $checkout = (& git rev-parse HEAD).Trim()
          try {
            ./scripts/Compilar-Beta-Conectada.ps1 -ExpectedSourceCommit $checkout -Endpoint https://receiver.invalid/ingest
            throw 'GF_TEST_APPROVAL_GATE_OPEN'
          } catch {
            if ($_.Exception.Message -notmatch 'GF_BETA_APPROVAL_PENDING') { throw }
            Write-Host 'Compilacao conectada recusou aviso/endpoint sem aprovacao; nenhuma publicacao iniciada.'
          }
      - name: Privacidade e transporte com handlers ficticios
        run: dotnet run --project TestesTelemetria/TestesTelemetria.csproj -c Release
  validar:
    name: Regressões Windows
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402 # mesmo SDK exato de global.json; sem canal flutuante
      - name: Compilar aplicacao
        shell: pwsh
        run: dotnet build GerenciadorAplicativos.csproj -c Release -p:RunAnalyzers=true
      - name: Conferir leitura e rolagem do diálogo de drivers em viewport pequeno
        shell: pwsh
        run: |
          dotnet run --project TestesLayout/TestesLayout.csproj -c Release -- --drivers-readonly | Tee-Object -Variable output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($output -match '^OK Drivers: diálogo real de investigação')) { throw 'Modo de teste do diálogo de drivers não foi executado' }
      - name: Lote 4 relatório local compacto e íntegro
        shell: pwsh
        run: |
          dotnet run --project TestesLayout/TestesLayout.csproj -c Release -- --lote4 | Tee-Object -Variable output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($output -match '^PASS L4 relatório real:')) { throw 'Modo de consolidação do relatório não foi executado' }
      - name: Lote 4 controle negativo em checkout descartável
        shell: pwsh
        run: ./scripts/Testar-Regressao-Relatorio.ps1
      - name: Lote 3 atualizações, concorrência e memória de download
        run: dotnet run --project TestesAtualizador/TestesAtualizador.csproj -c Release -- --lote3
      - name: Lote 3 desinstalações e posse de proteção
        run: dotnet run --project TestesResiduos/TestesResiduos.csproj -c Release -- --lote3
      - name: Lote 3 prévia do registro com volume elevado
        shell: pwsh
        run: |
          dotnet run --project TestesLayout/TestesLayout.csproj -c Release -- --lote3 | Tee-Object -Variable output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($output -match '^PASS L3 prévia em memória limitada')) { throw 'Modo de teste do registro do Lote 3 não foi executado' }
      - name: Ecossistemas e identidades multidimensionais (sem executar scripts)
        run: dotnet run --project TestesEcossistema/TestesEcossistema.csproj -c Release
      - name: Leitor COM real sem reparo ou elevacao automatica
        shell: pwsh
        run: ./TestesEcossistema/Testar-LeitorWinGet.ps1 -Executable ./bin/Release/net10.0-windows10.0.26100.0/GerenciadorFinal.exe
      - name: Conferir versao dos scripts de distribuicao sem publicar
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'GerenciadorAplicativos.csproj' -Raw
          $expected = [string]$project.Project.PropertyGroup.Version
          foreach ($script in @('Publicar-Portatil-Windows-x64.bat', 'Criar-Instalador-Windows-x64.bat', 'Verificar-Assinaturas-GF.cmd')) {
            $actual = & ".\$script" --print-version
            if ($LASTEXITCODE -ne 0 -or "$actual".Trim() -ne $expected) { throw "Versao incorreta: $script" }
          }
      - name: Reproduzir falhas reais WORK12 em alvos sinteticos
        run: dotnet run --project TestesResiduos/TestesResiduos.csproj -c Release -- --work12
      - name: Descoberta automatica e adversarios sem instalar programas
        run: dotnet run --project TestesAtualizador/TestesAtualizador.csproj -c Release -- --automatic
      - name: Isolar falhas e validar identidade MSI WORK17
        run: dotnet run --project TestesAtualizador/TestesAtualizador.csproj -c Release -- --work17
      - name: WORK18 contratos MSI e acompanhamento sem enfraquecer autorizacoes
        run: dotnet run --project TestesAtualizador/TestesAtualizador.csproj -c Release -- --work18
      - name: WORK18 botoes motivos e DPI em 1440x900 e 2560x1440
        run: dotnet run --project TestesLayout/TestesLayout.csproj -c Release -- --work18
      - name: Reproduzir casos WORK13 de atualizacao em isolamento
        run: dotnet run --project TestesAtualizador/TestesAtualizador.csproj -c Release -- --work13
      - name: Testes WSC somente leitura
        run: dotnet run --project TestesSeguranca/TestesSeguranca.csproj -c Release
      - name: Testes motor de comparacao
        run: dotnet run --project TestesMotor/TestesMotor.csproj -c Release
      - name: Testes RuckZuck simulados
        run: dotnet run --project TestesCatalogo/TestesCatalogo.csproj -c Release
      - name: Testes fontes oficiais e antifalsos positivos
        run: dotnet run --project TestesMultifontes/TestesMultifontes.csproj -c Release
      - name: Testes instaladores verificados
        run: dotnet run --project TestesAtualizador/TestesAtualizador.csproj -c Release
      - name: Comparar cobertura funcional WORK14 com a base imutavel
        run: python scripts/measure_work14.py
      - name: Comparar contratos WORK16 com a PR51 imutavel
        run: python scripts/measure_work16.py
      - name: Comparar cobertura MSI WORK17 com WORK16 imutavel
        run: python scripts/measure_work17.py
      - name: Comparar cobertura WORK18 com a integracao .64 imutavel
        run: python scripts/measure_work18.py
      - name: Conservar matriz WORK18 antes e depois
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WORK18-cobertura-${{ github.sha }}
          path: Work18Coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Conservar matriz MSI WORK17
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WORK17-cobertura-${{ github.sha }}
          path: Work17Coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Conservar matriz de ecossistemas WORK16
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WORK16-cobertura-${{ github.sha }}
          path: Work16Coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Conservar matriz funcional antes e depois
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WORK14-cobertura-${{ github.sha }}
          path: Work14Coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Controles negativos por mutacao em copias isoladas
        run: python scripts/test_work6_mutations.py
      - name: Testes drivers e historico
        run: dotnet run --project TestesDrivers/TestesDrivers.csproj -c Release
      - name: Testes residuos e desinstalacao com alvos sinteticos descartaveis
        run: dotnet run --project TestesResiduos/TestesResiduos.csproj -c Release
      - name: Benchmark sintetico de classificacao e navegacao (sem arquivos reais)
        run: dotnet run --project TestesResiduos/TestesResiduos.csproj -c Release --no-build --no-restore -- --benchmark
      - name: Testes layout e RAM
        run: dotnet run --project TestesLayout/TestesLayout.csproj -c Release
      - name: Testes inventario MSIX
        run: dotnet run --project TestesMsix/TestesMsix.csproj -c Release
      - name: Preparar Node para SQLite local dos testes BETA
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Endpoint BETA nao aprovado deve falhar no build sem habilitar envio
        shell: pwsh
        run: |
          $output = & dotnet msbuild GerenciadorAplicativos.csproj -t:ValidateGfBetaEndpoint -p:GfBetaEndpoint=https://receiver.invalid/ingest 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $output -notmatch 'GF_BETA_ENDPOINT_NOT_APPROVED') { throw 'Gate do endpoint falhou' }
          Write-Host 'Endpoint nao aprovado bloqueado; nenhuma chamada de rede realizada.'
          # A falha acima e esperada e ja foi validada pelo codigo e mensagem.
          exit 0
      - name: BETA receptor, retencao GitHub e recuperacao (SQLite local, sem rede)
        run: node --test prototipos/beta-telemetria/test.mjs prototipos/beta-telemetria/ingest.test.mjs prototipos/beta-telemetria/retention.test.mjs prototipos/beta-telemetria/round2.test.mjs prototipos/beta-telemetria/finalization.test.mjs
      - name: BETA fechamento, bandeja e Shutdown simulados na janela real
        run: dotnet run --project TestesLayout/TestesLayout.csproj -c Release -- --beta-close
      - name: Testes privacidade e diagnostico local
        run: dotnet run --project TestesTelemetria/TestesTelemetria.csproj -c Release
      - name: Testes bloqueio de instaladores e encerramento seguro
        run: dotnet run --project TestesFechamento/TestesFechamento.csproj -c Release
      - name: Capturas sinteticas da investigacao de residuos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Residuos-layout-${{ github.sha }}
          path: LayoutCaptures/*.png
          if-no-files-found: ignore
          retention-days: 7

  drivers-leitura:
    name: Drivers somente leitura (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    timeout-minutes: 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402 # mesmo SDK exato de global.json; sem canal flutuante
      - name: Fixtures, SetupAPI, catálogo INF e WUA sem download ou instalação
        shell: pwsh
        run: |
          dotnet run --project TestesDrivers/TestesDrivers.csproj -c Release -- --official-live 2>&1 | Tee-Object -FilePath drivers-evidencias.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Evidências somente dos runners descartáveis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Drivers-leitura-${{ matrix.os }}-${{ github.sha }}
          path: drivers-evidencias.txt
          if-no-files-found: error
          retention-days: 7
