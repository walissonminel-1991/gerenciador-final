name: G6 M2 — barreira de saída em Windows descartável
on:
  push:
    branches:
      - experimento-g5-ipc-chat-alto-20261029
    paths:
      - 'prototipos/autoatualizador-seguro/m2/**'
      - '.github/workflows/autoatualizador-m2-ciclo-isolado.yml'
permissions:
  contents: read
concurrency:
  group: gf-g6-m2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exit-barrier:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Fonte isolada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK exato
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Compilar e exercitar apenas o teste inerte de saída
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'prototipos/autoatualizador-seguro/m2/M2.csproj'
          $out = Join-Path $env:RUNNER_TEMP 'gf-g6-m2-build'
          $report = Join-Path $env:RUNNER_TEMP 'gf-g6-m2-report.json'
          if ((dotnet --version).Trim() -ne '10.0.402') { throw 'SDK_NOT_PINNED' }
          dotnet restore $project "-p:ArtifactsPath=$out" --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project "-p:ArtifactsPath=$out" -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runners = @(Get-ChildItem $out -Filter 'GF.Updater.M2.Tests.exe' -Recurse -File)
          if ($runners.Count -ne 1) { throw 'M2_RUNNER_NOT_UNIQUE' }
          & $runners[0].FullName --report $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.failed -ne 0 -or $result.operational_gates_closed -ne 0) { throw 'M2_FAILURE' }
          $compile = dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          $leaks = @($compile.Items.Compile | Where-Object { $_.Identity -match 'prototipos[/\\]autoatualizador-seguro[/\\]m2' })
          if ($leaks.Count -ne 0) { throw 'M2_PRODUCT_COMPILE_LEAK' }
          "M2 inert barrier: $($result.passed) passed, $($result.failed) failed. G6 not approved; no GF execution." >> $env:GITHUB_STEP_SUMMARY
