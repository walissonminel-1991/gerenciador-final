name: GF D2.4.4 - evidencias tipadas e regressao adversarial inerte
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/**'
      - '.github/workflows/gf-github-d2-inert-lab.yml'
      - '.github/workflows/gf-d23-dotnet-httpclient-lab.yml'
      - '.github/workflows/gf-d24-inert-integrated-lab.yml'
      - '.github/workflows/gf-d243-persistent-ntfs-lab.yml'
      - '.github/workflows/gf-d244-consolidated-lab.yml'
permissions:
  contents: read
concurrency:
  group: gf-d244-consolidated
  cancel-in-progress: false
jobs:
  d244-adversarial:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET 10 fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python 3.13 fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependencias TUF de teste fixadas
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'D244_TUF_TEST_DEPENDENCIES_FAILED' }
      - name: Provar isolamento do GF distribuido
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($p.Items.Compile | Where-Object {$_.Identity -match 'prototipos[/\\]autoatualizador-seguro'}).Count -ne 0) {
            throw 'D244_EXPERIMENTAL_SOURCE_LEAK'
          }
      - name: Compilar os tres laboratorios CSharp sem publicar artefatos
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tasks=@(
            @('prototipos/autoatualizador-seguro/github-trust-lab/GF.D11.D0Probe.csproj','gf-d24-d0','GF.D11.D0Probe.exe'),
            @('prototipos/autoatualizador-seguro/github-d23-dotnet-loopback/GF.D23.HttpClientLab.csproj','gf-d23-dotnet','GF.D23.HttpClientLab.exe'),
            @('prototipos/autoatualizador-seguro/github-d24-integrated/GF.D24.InertChainLab.csproj','gf-d24-bridge','GF.D24.InertChainLab.exe')
          )
          foreach ($t in $tasks) {
            $dir=Join-Path $env:RUNNER_TEMP $t[1]
            dotnet build $t[0] -c Release -r win-x64 --self-contained false -o $dir --nologo
            if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $dir $t[2]))) {
              throw ('D244_BUILD_FAILED_'+$t[2])
            }
          }
      - name: Quatro regressoes reais e mutacoes dos proprios recibos de CI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $d0=Join-Path $env:RUNNER_TEMP 'gf-d24-d0\GF.D11.D0Probe.exe'
          $d23=Join-Path $env:RUNNER_TEMP 'gf-d23-dotnet\GF.D23.HttpClientLab.exe'
          $d24=Join-Path $env:RUNNER_TEMP 'gf-d24-bridge\GF.D24.InertChainLab.exe'
          $script='prototipos/autoatualizador-seguro/github-d24-integrated/d244_consolidated_gate.py'
          $out=Join-Path $env:RUNNER_TEMP 'd244-stdout.txt'
          $err=Join-Path $env:RUNNER_TEMP 'd244-stderr.txt'
          python $script $d0 $d23 $d24 1> $out 2> $err
          $exitCode=$LASTEXITCODE
          Get-Content $out | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            Get-Content $err | ForEach-Object { Write-Host $_ }
            throw 'D244_ADVERSARIAL_SUITE_FAILED'
          }
          $lines=@(Get-Content $out | Where-Object { $_.StartsWith('GF_D244_RESULT ') })
          if ($lines.Count -ne 1) { throw 'D244_RESULT_COUNT' }
          $r=$lines[0].Substring('GF_D244_RESULT '.Length) | ConvertFrom-Json
          # The Python gate is authoritative for exact schema/type validation;
          # these explicit assertions add a second independent workflow gate.
          if ($r.schema -ne 'gf-d244-strict-inert-evidence/1' -or
              $r.status -ne 'passed' -or
              @($r.independent_test_suites_executed).Count -ne 4 -or
              $r.independent_test_suites_executed[0] -ne 'D2' -or
              $r.independent_test_suites_executed[1] -ne 'D23' -or
              $r.independent_test_suites_executed[2] -ne 'D242' -or
              $r.independent_test_suites_executed[3] -ne 'D243' -or
              $r.required_trigger_dependencies_covered -ne 20 -or
              $r.schema_mutations_rejected -lt 250 -or
              !$r.exact_field_sets_and_types_enforced -or
              !$r.duplicate_missing_extra_and_forged_fields_refused -or
              !$r.tuf_replay_with_intact_history_blocked -or
              !$r.full_history_rewind_reaccepted_old_version -or
              !$r.full_history_rewind_is_security_counterexample -or
              $r.same_user_rollback_resistance_proven -or
              $r.same_user_ntfs_toctou_resistance_proven -or
              $r.cooperative_lock_is_security_boundary -or
              $r.production_signing_authority -or
              $r.operational_ready -or $r.automatic_recovery_authorized -or
              $r.real_external_downloads -ne 0 -or
              $r.real_executable_installs -ne 0 -or $r.product_modified) {
            throw 'D244_UNSUPPORTED_OPERATIONAL_AUTHORITY'
          }
          Write-Host $lines[0]
# No external code download, installed GF change, merge, release, deploy, stage
# promotion, recovery, production keys, or distribution of test executables.
