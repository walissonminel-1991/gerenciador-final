name: GF - descoberta GitHub Releases sem instalacao (laboratorio)
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/github-metadata-lab/**'
      - '.github/workflows/gf-github-releases-metadata-lab.yml'
permissions:
  contents: read
concurrency:
  group: gf-github-metadata-lab
  cancel-in-progress: false
jobs:
  github-release-metadata-only:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout sem credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Isolamento do GF e ausência de instaladores
        shell: pwsh
        run: |
          $p=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($p.Items.Compile | Where-Object { $_.Identity -match 'prototipos[/\\]autoatualizador-seguro' }).Count -ne 0) {
            throw 'GF_METADATA_LAB_LEAK_IN_PRODUCT'
          }
          $files=Get-ChildItem 'prototipos/autoatualizador-seguro/github-metadata-lab' -File
          if (@($files | Where-Object {$_.Extension -notin @('.txt','.csproj','.md')}).Count -ne 0) {
            throw 'GF_METADATA_LAB_UNEXPECTED_PAYLOAD'
          }
      - name: Validar consulta GitHub e recusas sem rede
        shell: pwsh
        run: |
          $project='prototipos/autoatualizador-seguro/github-metadata-lab/GF.GithubMetadataLab.csproj'
          dotnet run --project $project --configuration Release --no-launch-profile
          if ($LASTEXITCODE -ne 0) { throw 'GF_METADATA_LAB_TESTS_FAILED' }
      - name: Consultar GitHub REAL, sem baixar pacote ou publicar Release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project='prototipos/autoatualizador-seguro/github-metadata-lab/GF.GithubMetadataLab.csproj'
          $line=(dotnet run --project $project --configuration Release --no-launch-profile -- --live | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$line -or !$line.StartsWith('GF_GITHUB_LIVE_ORIGIN ')) {
            throw 'GF_LIVE_GITHUB_ORIGIN_QUERY_FAILED_CLOSED'
          }
          $r=($line.Substring('GF_GITHUB_LIVE_ORIGIN '.Length) | ConvertFrom-Json)
          if ($r.schema -ne 'gf-github-live-origin-preflight/1' -or
              $r.repository -ne 'walissonminel-1991/gerenciador-final' -or
              !$r.actual_https_request -or
              $r.gate -notin @('BLOCKED_NO_GITHUB_RELEASE',
                               'BLOCKED_NO_AUTHORIZED_TEST_ORIGIN',
                               'BLOCKED_METADATA_NOT_AUTHENTICATED_PACKAGE') -or
              $r.package_origin_authorized -or $r.downloaded_gf_packages -ne 0 -or
              $r.executed_gf_packages -ne 0 -or $r.live_asset_authentication -or
              $r.old_to_new_applied -or $r.operational_ready -or
              $r.automatic_recovery_authorized) {
            throw 'GF_LIVE_GITHUB_ORIGIN_SCOPE_VIOLATION'
          }
          Write-Host $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @(
            '## GF autoatualizacao real — etapa 1 (origem GitHub)'
            "- HTTPS GitHub real: $($r.observed_state)"
            "- Bloqueio de homologacao: $($r.gate)"
            '- Sem origem aprovada e autenticada: nenhum download ou troca OLD/NEW'
            '- CI verde indica somente preflight de origem, NAO ponta a ponta'
          )
# No installer, release, deploy, telemetry, trust promotion or product integration.
