name: M3 G8 G1 — triagem read-only do journal pendente
on:
  push:
    branches:
      - experimento-g5-ipc-chat-alto-20261029
    paths:
      - 'prototipos/autoatualizador-seguro/m3-pending/**'
      - '.github/workflows/autoatualizador-m3-pending-isolado.yml'
permissions:
  contents: read
concurrency:
  group: gf-m3-pending-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pending-inspection:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Fonte experimental isolada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK exato
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Classificar fixtures pendentes sem mutações
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          $ErrorActionPreference='Stop'
          $project='prototipos/autoatualizador-seguro/m3-pending/Pending.csproj'
          $out=Join-Path $env:RUNNER_TEMP 'gf-m3-pending-artifacts'
          $report=Join-Path $env:RUNNER_TEMP 'gf-m3-pending-report.json'
          if ((dotnet --version).Trim() -ne '10.0.402') { throw 'M3_PENDING_SDK_MISMATCH' }
          dotnet restore $project "-p:ArtifactsPath=$out" --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project "-p:ArtifactsPath=$out" -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runners=@(Get-ChildItem $out -Filter 'GF.Updater.M3.PendingTests.exe' -Recurse -File)
          if ($runners.Count -ne 1) { throw 'M3_PENDING_RUNNER_NOT_UNIQUE' }
          & $runners[0].FullName --report $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r=Get-Content $report -Raw | ConvertFrom-Json
          if ($r.failed -ne 0 -or $r.passed -ne 12 -or
              !$r.plausible_pending_never_accepted -or
              !$r.corrupted_pending_blocked -or
              !$r.stale_or_foreign_pending_blocked -or
              !$r.unknown_ledger_entries_blocked -or
              !$r.multiple_pending_blocked -or
              !$r.committed_prefix_checked -or
              !$r.selector_mismatch_blocked -or !$r.bundle_tamper_blocked -or
              !$r.lease_contention_blocked -or
              !$r.inspection_preserved_bytes -or
              $r.pending_auto_promoted -or $r.pending_auto_deleted -or
              $r.operational_gates_closed -ne 0 -or
              $r.product_built -or $r.product_executed -or
              $r.durable_power_loss_tested -or $r.external_freshness_witness) { throw 'M3_PENDING_REPORT_INVALID' }
          $compile=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          $leaks=@($compile.Items.Compile | Where-Object { $_.Identity -match 'prototipos[/\\]autoatualizador-seguro[/\\]m3-pending' })
          if ($leaks.Count -ne 0) { throw 'M3_PENDING_PRODUCT_COMPILE_LEAK' }
          "M3 pending triage: $($r.passed) passed, no mutation, no product or operational gate." >> $env:GITHUB_STEP_SUMMARY
# No credentials, installations, ACL modification, telemetry or deployment.
