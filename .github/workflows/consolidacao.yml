name: Consolidacao v5.13.10.19 - regressoes offline Windows
on:
  push:
    branches: [teste-consolidacao-v5.13.10.19]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Compilar aplicacao
        shell: pwsh
        run: |
          dotnet build GerenciadorAplicativos.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regressoes de inventario, atualizacoes, residuos e seguranca
        shell: pwsh
        run: |
          $projects = @('TestesMotor', 'TestesAtualizador', 'TestesCatalogo', 'TestesMultifontes', 'TestesMsix', 'TestesFechamento', 'TestesResiduos', 'TestesSeguranca', 'TestesDrivers')
          foreach ($project in $projects) {
            Write-Output "INICIO $project"
            dotnet run --project "$project/$project.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Falhou: $project" }
            Write-Output "APROVADO $project"
          }
      - name: Consulta real de drivers no runner (somente leitura)
        shell: pwsh
        run: |
          dotnet run --project TestesDrivers/TestesDrivers.csproj -c Release -- --live
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Layout, bandeja e monitoramento
        shell: pwsh
        run: |
          dotnet run --project TestesLayout/TestesLayout.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Layout-consolidacao-v5.13.10.19
          path: LayoutCaptures/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preparar pacote para validacao futura
        shell: pwsh
        run: |
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o Distribuicao-v5.13.10.19
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./TestesManifesto/Testar-Ativacao.ps1 -ExecutablePath './Distribuicao-v5.13.10.19/GerenciadorFinal.exe'
          $folder = 'Distribuicao-v5.13.10.19'
          Get-ChildItem $folder -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content (Join-Path $folder 'SHA256SUMS.txt') -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GerenciadorFinal-v5.13.10.19-TESTE-NAO-ASSINADO
          path: Distribuicao-v5.13.10.19/
          if-no-files-found: error
          retention-days: 7
