name: Autoatualizador Etapa 8 — deltas G2 G8
on:
  push:
    branches: [work-autoatualizador-etapa8-validacao-20261028]
    paths:
      - prototipos/autoatualizador-seguro/stage8/**
      - .github/workflows/autoatualizador-etapa8-isolado.yml
permissions:
  contents: read
concurrency:
  group: gf-updater-stage8-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-deltas:
    name: Relógio por tentativa, término TUF e ownership de I/O
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GF_U8_CASE_PREFIX: ${{ contains(github.event.head_commit.message, '[gf-u8-late-file]') && 'U8-G8-LATE-FILE-WRITE' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Signer independente das fixtures públicas
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Somente deltas G2 G8, sem GF ou sonda GUI
        shell: pwsh
        run: |
          $arguments = @('--report', "$env:RUNNER_TEMP/gf-u8-windows.json")
          if ($env:GF_U8_CASE_PREFIX) { $arguments += @('--prefix', $env:GF_U8_CASE_PREFIX) }
          python prototipos/autoatualizador-seguro/stage8/run_tests.py @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content "$env:RUNNER_TEMP/gf-u8-windows.json" -Raw | ConvertFrom-Json
          "Etapa 8: $($result.passed)/$($result.total); zero gates operacionais fechados." >> $env:GITHUB_STEP_SUMMARY
# No upload, secrets, private channel, schedules, product publication or automatic retries.
