name: Gerenciador Final v5.12.6 RuckZuck - Windows x64

on:
  push:
    branches:
      - teste-completo-ruckzuck-v5.12.6
    paths:
      - 'Program.cs'
      - 'GerenciadorAplicativos.csproj'
      - 'RuckZuckCatalog.cs'
      - 'RuckZuckModels.cs'
      - 'Matching.cs'
      - 'TestesMotor/**'
      - 'TestesRede/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-e-publicar:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Obter arquivos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Testes offline do comparador
        shell: pwsh
        run: |
          dotnet run --project TestesMotor/TestesMotor.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar acesso real ao catalogo (somente GET)
        shell: pwsh
        run: |
          dotnet run --project TestesRede/TestesRede.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verificar manifesto Windows
        shell: pwsh
        run: |
          [xml]$m = Get-Content -Raw app.manifest
          $n = [System.Xml.XmlNamespaceManager]::new($m.NameTable)
          $n.AddNamespace('asm', 'urn:schemas-microsoft-com:asm.v1')
          $identity = $m.SelectSingleNode('/asm:assembly/asm:assemblyIdentity', $n)
          if ($null -eq $identity -or $identity.GetAttribute('version') -ne '5.12.6.0') { throw 'Manifesto inválido' }
      - name: Publicar portatil Windows x64
        shell: pwsh
        run: |
          if (Test-Path Distribuicao-v5.12.6) { Remove-Item Distribuicao-v5.12.6 -Force -Recurse }
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o Distribuicao-v5.12.6
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path Distribuicao-v5.12.6/GerenciadorFinal.exe)) { throw 'Executável ausente' }
      - name: Registrar hash SHA-256
        shell: pwsh
        run: Get-FileHash Distribuicao-v5.12.6/GerenciadorFinal.exe -Algorithm SHA256 | Format-List
      - name: Publicar artefato para testes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GerenciadorFinal-v5.12.6-TESTE-Windows-x64-NAO-ASSINADO
          path: Distribuicao-v5.12.6/
          retention-days: 7
          if-no-files-found: error
