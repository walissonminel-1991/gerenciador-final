name: Compilar Windows (sem assinatura)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validar:
    uses: ./.github/workflows/validar-candidata-windows.yml
  politica:
    uses: ./.github/workflows/triagem-diagnostico-github.yml
  build:
    name: Compilação Windows x64
    needs: [validar, politica]
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.pacote.outputs.nome }}
      is_beta: ${{ steps.pacote.outputs.beta }}
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GF_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Baixar fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar SDK .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402 # mesmo SDK exato de global.json; sem canal flutuante

      - name: Identificar pacote pela versao e commit
        id: pacote
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'GerenciadorAplicativos.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^[0-9]+([.][0-9]+){3}$') { throw 'Versao invalida no projeto' }
          $shortCommit = $env:GF_SOURCE_SHA.Substring(0, 8).ToLowerInvariant()
          $artifactName = "GerenciadorFinal-v$version-$shortCommit-TESTE-win-x64"
          "nome=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "versao=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $betaEnabled = ([string]$project.Project.PropertyGroup.DefineConstants) -match '(^|;)GF_BETA(;|$)'
          "beta=$($betaEnabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Artefato identificado como: $artifactName"

      - name: Publicar para Windows x64 (self-contained)
        shell: pwsh
        run: |
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o "$env:GITHUB_WORKSPACE\Distribuicao"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\Distribuicao\GerenciadorFinal.exe")) { throw 'GerenciadorFinal.exe ausente' }

      - name: Verificar ativacao do manifesto Win32 no executavel
        shell: pwsh
        run: |
          ./TestesManifesto/Testar-Ativacao.ps1 -ExecutablePath './Distribuicao/GerenciadorFinal.exe'

      - name: Registrar origem e versao da compilacao
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'GerenciadorAplicativos.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          @(
            'Produto: Gerenciador Final'
            "Versao: $version"
            "Commit Git: $env:GITHUB_SHA"
            "Commit fonte: $env:GF_SOURCE_SHA"
            "Base da PR (quando aplicavel): $env:GF_BASE_SHA"
            "Execucao GitHub Actions: $env:GITHUB_RUN_ID"
            'Assinatura digital: AUSENTE (pacote experimental)'
            'Status AVG: NAO VALIDADO; nao executar se estiver em quarentena'
            'Origem: https://github.com/walissonminel-1991/gerenciador-final'
          ) | Set-Content 'Distribuicao/BUILD-INFO.txt' -Encoding utf8

      - name: Gerar e verificar SHA256SUMS.txt
        shell: pwsh
        run: |
          $root = (Resolve-Path 'Distribuicao').Path
          $files = @(Get-ChildItem -LiteralPath $root -File -Recurse |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object FullName)
          if ($files.Count -lt 3) { throw 'Distribuicao incompleta' }
          $lines = foreach ($file in $files) {
            $relative = [IO.Path]::GetRelativePath($root, $file.FullName).Replace('\', '/')
            $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $relative"
          }
          $lines | Set-Content 'Distribuicao/SHA256SUMS.txt' -Encoding utf8
          $verified = 0
          foreach ($line in (Get-Content 'Distribuicao/SHA256SUMS.txt')) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw 'Manifesto SHA256 invalido' }
            $expected = $Matches[1]
            $relative = $Matches[2]
            $path = Join-Path $root ($relative.Replace('/', [IO.Path]::DirectorySeparatorChar))
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Arquivo ausente: $relative" }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA256 divergente: $relative" }
            $verified++
          }
          if ($verified -ne $files.Count) { throw 'Contagem de arquivos do checksum divergente' }
          Write-Host "Integridade aprovada: $verified arquivos."

      - name: Validar composicao, origem, runtime e integridade antes do upload
        shell: pwsh
        run: |
          $arguments = @('scripts/verificar_pacote.py', 'Distribuicao', '--version', '${{ steps.pacote.outputs.versao }}', '--source', $env:GF_SOURCE_SHA, '--build', $env:GITHUB_SHA)
          if ($env:GF_BASE_SHA) { $arguments += @('--base', $env:GF_BASE_SHA) }
          python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Registrar integridade e assinatura para investigação antivírus
        shell: pwsh
        run: ./scripts/Registrar-Evidencia-Antivirus.ps1 -Directory Distribuicao -OutputPath Antivirus-evidencias.json

      - name: Conservar evidência técnica (não é varredura AVG)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Antivirus-evidencias-${{ env.GF_SOURCE_SHA }}
          path: Antivirus-evidencias.json
          retention-days: 7
          if-no-files-found: error

      - name: Conservar artefato para testes (nao assinado)
        if: ${{ steps.pacote.outputs.beta != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pacote.outputs.nome }}
          path: Distribuicao/
          retention-days: 7
          if-no-files-found: error

  # OIDC e permissao de atestacao somente em contexto confiavel da main.
  # PRs externos nunca recebem id-token:write nem attestations:write.
  attest:
    name: Atestar pacote apenas na main
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false && needs.build.outputs.is_beta != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Recuperar somente artefato do build deste workflow
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: Distribuicao
      - name: Verificar manifesto e integridade antes de atestar
        shell: bash
        run: |
          test -s Distribuicao/GerenciadorFinal.exe
          test -s Distribuicao/SHA256SUMS.txt
          (cd Distribuicao && sha256sum --check SHA256SUMS.txt)
      # Atestado de procedencia GitHub nao substitui assinatura Authenticode.
      - name: Atestar procedencia do executavel da main
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: Distribuicao/GerenciadorFinal.exe
