name: Compilar Windows (sem assinatura)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Baixar fonte
        uses: actions/checkout@v4

      - name: Preparar SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Identificar pacote pela versao e commit
        id: pacote
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'GerenciadorAplicativos.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^[0-9]+([.][0-9]+){3}$') { throw 'Versao invalida no projeto' }
          $shortCommit = $env:GITHUB_SHA.Substring(0, 8).ToLowerInvariant()
          $artifactName = "GerenciadorFinal-v$version-$shortCommit-TESTE-win-x64"
          "nome=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Artefato identificado como: $artifactName"

      - name: Publicar para Windows x64 (self-contained)
        shell: pwsh
        run: |
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o "$env:GITHUB_WORKSPACE\Distribuicao"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\Distribuicao\GerenciadorFinal.exe")) { throw 'GerenciadorFinal.exe ausente' }

      - name: Verificar ativacao do manifesto Win32 no executavel
        shell: pwsh
        run: |
          ./TestesManifesto/Testar-Ativacao.ps1 -ExecutablePath './Distribuicao/GerenciadorFinal.exe'

      - name: Registrar origem e versao da compilacao
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'GerenciadorAplicativos.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          @(
            'Produto: Gerenciador Final'
            "Versao: $version"
            "Commit Git: $env:GITHUB_SHA"
            "Execucao GitHub Actions: $env:GITHUB_RUN_ID"
            'Assinatura digital: AUSENTE (pacote experimental)'
            'Status AVG: NAO VALIDADO; nao executar se estiver em quarentena'
            'Origem: https://github.com/walissonminel-1991/gerenciador-final'
          ) | Set-Content 'Distribuicao/BUILD-INFO.txt' -Encoding utf8

      - name: Gerar e verificar SHA256SUMS.txt
        shell: pwsh
        run: |
          $root = (Resolve-Path 'Distribuicao').Path
          $files = @(Get-ChildItem -LiteralPath $root -File -Recurse |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object FullName)
          if ($files.Count -lt 3) { throw 'Distribuicao incompleta' }
          $lines = foreach ($file in $files) {
            $relative = [IO.Path]::GetRelativePath($root, $file.FullName).Replace('\', '/')
            $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $relative"
          }
          $lines | Set-Content 'Distribuicao/SHA256SUMS.txt' -Encoding utf8
          $verified = 0
          foreach ($line in (Get-Content 'Distribuicao/SHA256SUMS.txt')) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw 'Manifesto SHA256 invalido' }
            $expected = $Matches[1]
            $relative = $Matches[2]
            $path = Join-Path $root ($relative.Replace('/', [IO.Path]::DirectorySeparatorChar))
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Arquivo ausente: $relative" }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA256 divergente: $relative" }
            $verified++
          }
          if ($verified -ne $files.Count) { throw 'Contagem de arquivos do checksum divergente' }
          Write-Host "Integridade aprovada: $verified arquivos."

      - name: Conservar artefato para testes (nao assinado)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pacote.outputs.nome }}
          path: Distribuicao/
          retention-days: 7
          if-no-files-found: error

      # Atestado de origem GitHub nao assina o executavel (Authenticode).
      - name: Atestar procedencia do executavel (GitHub)
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: Distribuicao/GerenciadorFinal.exe
