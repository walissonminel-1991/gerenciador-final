name: Gerenciador Final v5.12.6.3 Inicialização Automática - Windows x64

on:
  push:
    branches:
      - teste-inicializacao-v5.12.6.3
    paths:
      - 'Program.cs'
      - 'GerenciadorAplicativos.csproj'
      - 'RuckZuckCatalog.cs'
      - 'RuckZuckModels.cs'
      - 'Matching.cs'
      - 'DarkControls.cs'
      - 'IntegratedSystemUi.cs'
      - 'AdvancedFeatures.cs'
      - 'DiagnosticTrace.cs'
      - 'app.manifest'
      - '.github/workflows/compilar-gerenciador-v5.12.6.3.yml'
      - 'TestesMotor/**'
      - 'TestesRede/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-e-publicar:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar rotinas de inicializacao e atualizacao segura
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $systemUi = Get-Content IntegratedSystemUi.cs -Raw
          $logic = Get-Content DarkControls.cs -Raw
          if (-not $main.Contains('BeginStartupChecks();')) { throw 'Inicializacao automatica ausente' }
          if (-not $main.Contains('ScanWindowsUpdatesInBackgroundAsync();')) { throw 'Windows Update nao e iniciado automaticamente' }
          if (-not $main.Contains('_ = LoadUpdatesAsync();')) { throw 'RuckZuck nao e iniciado automaticamente' }
          if (-not $main.Contains('DrawRowButton(e.Graphics, AppRowGeometry.UpdateButton')) { throw 'Botao atualizar ausente' }
          if (-not $systemUi.Contains('_processTimer.Start();')) { throw 'Amostragem automatica ausente' }
          if (-not $systemUi.Contains('WindowsUpdateClient.ScanAsync()')) { throw 'Consulta oficial do Windows Update ausente' }
          if (-not $logic.Contains('update-not-validated')) { throw 'Acao sem instalador nao esta protegida' }

      - name: Testes offline do comparador
        shell: pwsh
        run: |
          dotnet run --project TestesMotor/TestesMotor.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar acesso real ao catalogo (somente GET)
        shell: pwsh
        run: |
          dotnet run --project TestesRede/TestesRede.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verificar manifesto Windows
        shell: pwsh
        run: |
          [xml]$m = Get-Content -Raw app.manifest
          $n = [System.Xml.XmlNamespaceManager]::new($m.NameTable)
          $n.AddNamespace('asm', 'urn:schemas-microsoft-com:asm.v1')
          $identity = $m.SelectSingleNode('/asm:assembly/asm:assemblyIdentity', $n)
          if ($null -eq $identity -or $identity.GetAttribute('version') -ne '5.12.6.3') { throw 'Manifesto inválido' }
      - name: Publicar portatil Windows x64
        shell: pwsh
        run: |
          if (Test-Path Distribuicao-v5.12.6.3) { Remove-Item Distribuicao-v5.12.6.3 -Force -Recurse }
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o Distribuicao-v5.12.6.3
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path Distribuicao-v5.12.6.3/GerenciadorFinal.exe)) { throw 'Executável ausente' }
      - name: Registrar hash SHA-256
        shell: pwsh
        run: Get-FileHash Distribuicao-v5.12.6.3/GerenciadorFinal.exe -Algorithm SHA256 | Format-List
      - name: Publicar artefato para testes
        uses: actions/upload-artifact@v4
        with:
          name: GerenciadorFinal-v5.12.6.3-TESTE-Windows-x64-NAO-ASSINADO
          path: Distribuicao-v5.12.6.3/
          retention-days: 7
          if-no-files-found: error
