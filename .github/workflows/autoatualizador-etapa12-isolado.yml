name: Autoatualizador Etapa 12 — duas divergências TUF
on:
  push:
    branches: [work-autoatualizador-etapa12-validacao-20261029]
    paths:
      - prototipos/autoatualizador-seguro/stage12/**
      - .github/workflows/autoatualizador-etapa12-isolado.yml
permissions:
  contents: read
concurrency:
  group: gf-updater-stage12-${{ github.ref }}
  cancel-in-progress: false
jobs:
  minimal-rotation:
    name: Vetores mínimos, cache e recuperação dirigida
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Mesmas dependências de oráculo da Etapa 11
        shell: pwsh
        run: python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
      - name: Apenas Etapa 12; sem as 45 provas anteriores
        shell: pwsh
        run: |
          python prototipos/autoatualizador-seguro/stage12/run_tests.py --report "$env:RUNNER_TEMP/gf-u12.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content "$env:RUNNER_TEMP/gf-u12.json" -Raw | ConvertFrom-Json
          "Etapa 12: .NET $($r.windows.passed)/14; observações Python $($r.python_probe.passed)/16. Duas divergências brutas reproduzidas; G2 blocked. Diagnóstico de invalidação não é correção operacional." >> $env:GITHUB_STEP_SUMMARY
# No uploads, product build/launch, secrets, production keys, old suites or automatic retry.
