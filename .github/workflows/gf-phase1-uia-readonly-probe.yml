name: GF Fase 1 - prova externa UIA MSAA (investigacao)
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/phase1-composed/uia_item_discovery.ps1'
      - 'prototipos/autoatualizador-seguro/phase1-composed/uia_probe_real_gf.py'
      - '.github/workflows/gf-phase1-uia-readonly-probe.yml'
permissions:
  contents: read
concurrency:
  group: gf-fase1-uia-experimental
  cancel-in-progress: false
jobs:
  external-uia-feasibility:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET 10 fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependencias da fixture HKCU de laboratorio
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'GF_PHASE1_UIA_DEPENDENCIES' }
      - name: Garantir prototipos excluidos do produto
        shell: pwsh
        run: |
          $p=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($p.Items.Compile | Where-Object { $_.Identity -match 'prototipos[/\\]autoatualizador-seguro' }).Count -ne 0) {
            throw 'GF_PHASE1_UIA_PRODUCT_COMPILE_LEAK'
          }
      - name: Compilar somente NEW real em pasta temporaria
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $env:RUNNER_TEMP 'gf-phase1-uia-new'
          if (Test-Path $output) { throw 'GF_PHASE1_UIA_OUTPUT_NOT_FRESH' }
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:GfBetaProfile=local -p:Version=5.13.11.66 -o $output --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $output 'GerenciadorFinal.exe'))) {
            throw 'GF_PHASE1_UIA_BUILD_FAILED'
          }
      - name: Provar execucao do GF real e investigar UIA MSAA sem READY
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-phase1-uia-new\GerenciadorFinal.exe'
          $script='prototipos/autoatualizador-seguro/phase1-composed/uia_probe_real_gf.py'
          $line=(python $script $exe | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$line -or !$line.StartsWith('GF_PHASE1_UIA_REAL_GF_FEASIBILITY ')) {
            throw 'GF_PHASE1_UIA_PROBE_NOT_EXECUTED'
          }
          $r=($line.Substring('GF_PHASE1_UIA_REAL_GF_FEASIBILITY '.Length) | ConvertFrom-Json)
          if ($r.schema -ne 'gf-phase1-uia-real-gf-feasibility/1' -or
              $r.scope -ne 'DISPOSABLE_WINDOWS_REAL_GF_TRIAL_NOT_PRODUCTION' -or
              !$r.gf_image_and_process_verified -or !$r.probe_on_real_gf -or
              !$r.positive_query_echo_verified -or !$r.negative_query_echo_verified -or
              $r.experimental_positive_ui_proof -or $r.operational_ready -or
              $r.automatic_recovery_authorized) {
            throw 'GF_PHASE1_UIA_REAL_GUARDS_OR_SEARCH_NOT_PROVED'
          }
          Write-Host $line
          Write-Host 'GF_PHASE1_UIA_RESEARCH: NO_QUALIFIED_POSITIVE_ITEM; READY=false; recovery=false'
