name: M3 L15 — vinculo TUF Stage3 NTFS e recovery inerte
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/m3-l15-bound/**'
      - '.github/workflows/autoatualizador-m3-l15-vinculo-tuf-ntfs-recuperacao-inerte.yml'
permissions:
  contents: read
concurrency:
  group: gf-m3-l15-bound-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-bound-crash-fixtures:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python de fixtures
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependencias TUF de laboratorio fixadas
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 17 negativos reais Windows apos TUF fixture assinada
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          $project='prototipos/autoatualizador-seguro/m3-l15-bound/L15Bound.csproj'
          $anchor='prototipos/autoatualizador-seguro/fixtures/bootstrap.test-only.json'
          $work=Join-Path $env:RUNNER_TEMP 'gf-m3-l15-pinned-source'
          $fixtures=Join-Path $env:RUNNER_TEMP 'gf-m3-l15-signed-fixtures'
          $out=Join-Path $env:RUNNER_TEMP 'gf-m3-l15-artifacts'
          $report=Join-Path $env:RUNNER_TEMP 'gf-m3-l15-report.json'
          if ((dotnet --version).Trim() -ne '10.0.402') { throw 'L15_SDK_MISMATCH' }
          $source=(python prototipos/autoatualizador-seguro/m3-composed/prepare_pinned_source.py $work | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $source)) { throw 'L15_TUF_SOURCE_UNAVAILABLE' }
          python prototipos/autoatualizador-seguro/m3-composed-3/generate_signed_fixtures.py $fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore $project "-p:ArtifactsPath=$out" "-p:Stage8Source=$source" --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project "-p:ArtifactsPath=$out" "-p:Stage8Source=$source" -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exes=@(Get-ChildItem $out -Filter 'GF.Updater.M3.L15BoundTests.exe' -Recurse -File)
          if ($exes.Count -ne 1) { throw 'L15_RUNNER_NOT_UNIQUE' }
          & $exes[0].FullName --report $report $fixtures $anchor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r=Get-Content $report -Raw | ConvertFrom-Json
          if ($r.passed -ne 17 -or $r.failed -ne 0 -or
              !$r.signed_test_only_tuf_stage11 -or
              !$r.stage3_rebuilt_across_fresh_process -or
              !$r.ntfs_handle_guard_exercised -or
              !$r.real_child_process_killed -or
              !$r.fresh_process_recovery -or
              !$r.before_terminal_inert_rollback_observed -or
              !$r.after_terminal_only_inert_observation -or
              !$r.cross_installation_replay_refused -or
              !$r.deliberate_toctou_second_check_refused -or
              !$r.timeout_did_not_cancel_child -or
              !$r.old_fixtures_and_markers_preserved -or
              $r.signed_binary_covers_l14_new_bytes -or
              $r.independent_witness_exists -or
              $r.arbitrary_toctou_window_proven_closed -or
              $r.power_loss_tested -or
              $r.product_compiled_or_executed -or
              $r.install_update_ready_or_confirmation_authorized -or
              $r.real_credential_or_remote_service_used -or
              $r.operational_gates_closed -ne 0) { throw 'L15_FALSE_SECURITY_CLAIM' }
          $compile=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          $leaks=@($compile.Items.Compile | Where-Object { $_.Identity -match 'prototipos[/\\]autoatualizador-seguro[/\\]m3-l15-bound' })
          if ($leaks.Count -ne 0) { throw 'L15_PRODUCT_COMPILE_LEAK' }
          "L15: signed Stage11 TUF fixture, Stage3, NTFS and L14 process crash integration; 17 checks PASS, no operational authorization; G1-G8 BLOCKED." >> $env:GITHUB_STEP_SUMMARY
# No updater, release, merge, keys, service, Cloudflare, BETA .66, product execution, telemetry or WORK.
