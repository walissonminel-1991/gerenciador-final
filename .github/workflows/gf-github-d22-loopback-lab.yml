name: GF D2.2 - HTTP real loopback com bytes inertes
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/github-d22-loopback/**'
      - '.github/workflows/gf-github-d22-loopback-lab.yml'
permissions:
  contents: read
concurrency:
  group: gf-d22-loopback-lab
  cancel-in-progress: false
jobs:
  windows-d22:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout sem credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependencias TUF ja utilizadas nos laboratorios
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'D22_TUF_DEPS' }
      - name: Confirmar isolamento do produto e compilar parser Csharp D0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($p.Items.Compile | Where-Object {$_.Identity -match 'prototipos[/\\]autoatualizador-seguro'}).Count -ne 0) {
            throw 'D22_PRODUCT_SOURCE_LEAK'
          }
          $dest=Join-Path $env:RUNNER_TEMP 'gf-d22-d0'
          dotnet build prototipos/autoatualizador-seguro/github-trust-lab/GF.D11.D0Probe.csproj -c Release -r win-x64 --self-contained false -o $dest --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $dest 'GF.D11.D0Probe.exe'))) {
            throw 'D22_D0_BUILD'
          }
      - name: Validar HTTP real apenas loopback, bytes inertes, falhas e limites
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-d22-d0\GF.D11.D0Probe.exe'
          $script='prototipos/autoatualizador-seguro/github-d22-loopback/d22_loopback_http_lab.py'
          $line=(python $script $exe | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$line -or !$line.StartsWith('GF_D22_RESULT ')) {
            throw 'D22_LAB_NOT_COMPLETED'
          }
          $r=$line.Substring('GF_D22_RESULT '.Length) | ConvertFrom-Json
          if ($r.schema -ne 'gf-github-d22-loopback-http/1' -or
              $r.status -ne 'passed' -or
              $r.positive_inert_http_transfers -ne 3 -or
              $r.negative_http_cases_rejected -ne 31 -or
              $r.loopback_requests -ne 34 -or
              $r.transport -ne 'tcp-ipv4-loopback-only' -or
              $r.http_library -ne 'python-stdlib-http.client' -or
              !$r.http_real_loopback_exercised -or
              !$r.d0_d1_test_manifest_verified -or
              !$r.d2_writer_reused -or
              !$r.outside_stage_sentinel_preserved -or
              $r.external_http_requests -ne 0 -or
              $r.github_redirect_support_proven -or
              $r.tls_or_github_real_tested -or
              $r.production_trust_root -or
              $r.same_user_toctou_resistance_proven -or
              $r.full_history_rollback_resistance_proven -or
              $r.real_executable_downloads -ne 0 -or
              $r.installations -ne 0 -or
              $r.product_modified -or
              $r.operational_ready -or
              $r.automatic_recovery_authorized) {
            throw 'D22_FALSE_SECURITY_OR_INSTALL_CLAIM'
          }
          Write-Host $line
# No external fetch, executable, installation, release, deploy, merge or recovery.
