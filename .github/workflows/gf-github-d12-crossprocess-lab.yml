name: GF D1.2 - trust entre processos e contraexemplo rollback (laboratorio)
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/github-crossprocess-lab/**'
      - '.github/workflows/gf-github-d12-crossprocess-lab.yml'
permissions:
  contents: read
concurrency:
  group: gf-d12-crossprocess-lab
  cancel-in-progress: false
jobs:
  crossprocess-trust-lab:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout sem credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK dotnet fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependencias python TUF Stage11
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'D12_DEPS_FAILED' }
      - name: Compilar probe D0 isolado
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $compile=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($compile.Items.Compile | Where-Object {$_.Identity -match 'prototipos[/\\]autoatualizador-seguro'}).Count -ne 0) {
            throw 'D12_PRODUCT_CODE_LEAK'
          }
          $dest=Join-Path $env:RUNNER_TEMP 'gf-d12-d0'
          dotnet build prototipos/autoatualizador-seguro/github-trust-lab/GF.D11.D0Probe.csproj -c Release -r win-x64 --self-contained false -o $dest --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $dest 'GF.D11.D0Probe.exe'))) {
            throw 'D12_D0_NOT_COMPILED'
          }
      - name: Processos distintos, negative controls e H1 contraexemplo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-d12-d0\GF.D11.D0Probe.exe'
          $script='prototipos/autoatualizador-seguro/github-crossprocess-lab/d12_crossprocess_lab.py'
          $line=(python $script $exe | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$line -or !$line.StartsWith('GF_D12_RESULT ')) {
            throw 'D12_SUITE_FAILED'
          }
          $r=$line.Substring('GF_D12_RESULT '.Length) | ConvertFrom-Json
          if ($r.schema -ne 'gf-github-d12-crossprocess/1' -or
              $r.status -ne 'passed' -or
              $r.independent_windows_processes -ne 21 -or
              $r.trusted_generations_across_processes -ne 2 -or
              $r.intact_history_negative_controls -ne 18 -or
              !$r.full_history_rewind_accepted -or
              !$r.rewind_is_security_counterexample -or
              $r.same_user_rollback_protection_proven -or
              $r.cryptographic_production_authority -or
              $r.process_crash_durability_proven -or
              !$r.test_root_public -or
              $r.real_network_requests -ne 0 -or
              $r.real_executable_downloads -ne 0 -or
              $r.product_modified -or $r.operational_ready -or
              $r.automatic_recovery_authorized) {
            throw 'D12_FALSE_SECURITY_CLAIM'
          }
          Write-Host $line
# No release, GF binary, signing key, install, rollback or operational trust.
