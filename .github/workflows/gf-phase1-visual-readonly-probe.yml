name: GF Fase 1 - estudo visual de regiao da lista, sem READY
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/phase1-visual-probe/**'
      - '.github/workflows/gf-phase1-visual-readonly-probe.yml'
permissions:
  contents: read
concurrency:
  group: gf-phase1-visual-feasibility-disposable
  cancel-in-progress: false
jobs:
  list-visual-feasibility:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET 10 fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependencias somente para fixture HKCU de laboratorio
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'GF_PHASE1_VISUAL_DEPENDENCIES' }
      - name: Confirmar isolamento do codigo de produto
        shell: pwsh
        run: |
          $p=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($p.Items.Compile | Where-Object { $_.Identity -match 'prototipos[/\\]autoatualizador-seguro' }).Count -ne 0) {
            throw 'GF_PHASE1_VISUAL_PRODUCT_CODE_LEAK'
          }
      - name: Compilar NEW real sem pacote publico
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'gf-phase1-visual-new'
          if (Test-Path $out) { throw 'GF_PHASE1_VISUAL_NOT_FRESH' }
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:GfBetaProfile=local -p:Version=5.13.11.66 -o $out --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $out 'GerenciadorFinal.exe'))) {
            throw 'GF_PHASE1_VISUAL_GF_BUILD_FAILED'
          }
      - name: Estudar apenas regiao de lista do GF real
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-phase1-visual-new\GerenciadorFinal.exe'
          $script='prototipos/autoatualizador-seguro/phase1-visual-probe/visual_feasibility.py'
          $line=(python $script $exe | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$line -or !$line.StartsWith('GF_PHASE1_VISUAL_FEASIBILITY ')) {
            throw 'GF_PHASE1_VISUAL_PROBE_NOT_EXECUTED'
          }
          $r=($line.Substring('GF_PHASE1_VISUAL_FEASIBILITY '.Length) | ConvertFrom-Json)
          if ($r.schema -ne 'gf-phase1-visual-list-feasibility/1' -or
              $r.scope -ne 'DISPOSABLE_WINDOWS_VERIFIED_LIST_ROI_ONLY' -or
              !$r.real_gf_verified -or
              $r.item_name_visually_proven -or $r.operational_ready -or
              $r.automatic_recovery_authorized) {
            throw 'GF_PHASE1_VISUAL_IDENTITY_OR_READY_FALSE_CLAIM'
          }
          # Feasibility may be inconclusive; only tests an owned in-memory ROI.
          Write-Host $line
          Write-Host 'GF_PHASE1_VISUAL_RESEARCH: NAME_IDENTITY_UNPROVEN; READY=false'
