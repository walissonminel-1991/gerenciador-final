name: Laboratório de provedores - Windows x64

on:
  push:
    branches:
      - laboratorio-provedores-v0.1
    paths:
      - 'LaboratorioGerenciador/**'
      - 'TestesMotor/**'
      - '.github/workflows/laboratorio-provedores.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar-laboratorio:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testar motor de comparacao
        shell: pwsh
        run: |
          dotnet run --project TestesMotor/TestesMotor.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar versao portatil x64
        shell: pwsh
        run: |
          dotnet publish LaboratorioGerenciador/LaboratorioGerenciador.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false --output "$env:GITHUB_WORKSPACE\LabDistribuicao"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\LabDistribuicao\GerenciadorFinal.Laboratorio.exe")) { throw "Executavel nao encontrado" }

      - name: Registrar hash do executavel
        shell: pwsh
        run: |
          Get-FileHash "LabDistribuicao/GerenciadorFinal.Laboratorio.exe" -Algorithm SHA256 | Format-List

      - name: Disponibilizar ZIP de teste
        uses: actions/upload-artifact@v4
        with:
          name: Laboratorio-Provedores-Windows-x64
          path: LabDistribuicao/
          retention-days: 7
          if-no-files-found: error
