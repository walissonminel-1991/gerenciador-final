name: Laboratório de provedores - Windows x64

on:
  push:
    branches:
      - laboratorio-provedores-v0.1
    paths:
      - 'LaboratorioGerenciador/**'
      - 'TestesMotor/**'
      - 'TestesRede/**'
      - '.github/workflows/laboratorio-provedores.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar-laboratorio:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Diagnosticar contrato publico RuckZuck (sem dados do computador)
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $response = Invoke-WebRequest -Uri 'https://ruckzuck.tools/rest/v2/geturl' -MaximumRedirection 0 -TimeoutSec 25 -ErrorAction Stop
            $body = [string]$response.Content
            $value = $body.Trim()
            $kind = if ($value.StartsWith('"')) { 'aspas-json-ou-texto' } elseif ($value.StartsWith('{')) { 'objeto-json' } elseif ($value.StartsWith('[')) { 'lista-json' } elseif ($value.StartsWith('https://')) { 'url-https' } else { 'outro' }
            if ($value.StartsWith('"')) {
              try { $value = $value | ConvertFrom-Json -ErrorAction Stop } catch { $value = $value.Trim('"') }
            }
            $allowed = $false
            $hostKind = 'invalido'
            try {
              $uri = [uri]([string]$value)
              if (-not $uri.IsAbsoluteUri) { $uri = [uri]('https://' + [string]$value) }
              if ($uri.Scheme -eq 'https') {
                if ($uri.Host -eq 'ruckzuck.tools' -or $uri.Host.EndsWith('.ruckzuck.tools')) {
                  $allowed = $true; $hostKind='ruckzuck.tools'
                } else { $hostKind='outro-dominio' }
              }
            } catch {}
            Write-Host "GETURL status=$([int]$response.StatusCode) formato=$kind comprimento=$($body.Length) dominio=$hostKind"
            if ($allowed) {
              $catalogUri = 'https://' + $uri.Host + '/rest/v2/getcatalog'
              try {
                $c = Invoke-WebRequest -Uri $catalogUri -MaximumRedirection 0 -TimeoutSec 35 -ErrorAction Stop
                $raw = [string]$c.Content
                $trim = $raw.TrimStart()
                $shape = if ($trim.StartsWith('[')) { 'lista-json' } elseif ($trim.StartsWith('{')) { 'objeto-json' } elseif ($trim.StartsWith('<')) { 'html-ou-xml' } else { 'outro' }
                Write-Host "GETCATALOG status=$([int]$c.StatusCode) formato=$shape comprimento=$($raw.Length) tipo=$($c.Headers['Content-Type'])"
              } catch { Write-Host "GETCATALOG falha=$($_.Exception.GetType().Name)" }
            }
          } catch { Write-Host "GETURL falha=$($_.Exception.GetType().Name)" }

      - name: Testar leitor real RuckZuck via .NET
        shell: pwsh
        run: |
          dotnet run --project TestesRede/TestesRede.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Testar motor de comparacao
        shell: pwsh
        run: |
          dotnet run --project TestesMotor/TestesMotor.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar versao portatil x64
        shell: pwsh
        run: |
          dotnet publish LaboratorioGerenciador/LaboratorioGerenciador.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false --output "$env:GITHUB_WORKSPACE\LabDistribuicao"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\LabDistribuicao\GerenciadorFinal.Laboratorio.exe")) { throw "Executavel nao encontrado" }

      - name: Registrar hash do executavel
        shell: pwsh
        run: |
          Get-FileHash "LabDistribuicao/GerenciadorFinal.Laboratorio.exe" -Algorithm SHA256 | Format-List

      - name: Disponibilizar ZIP de teste
        uses: actions/upload-artifact@v4
        with:
          name: Laboratorio-Provedores-Windows-x64
          path: LabDistribuicao/
          retention-days: 7
          if-no-files-found: error
