name: M3 G1 — CAS e commit ambiguo (modelo inerte)
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/m3-g1-transaction/**'
      - '.github/workflows/autoatualizador-m3-g1-tx-inerte.yml'
permissions:
  contents: read
concurrency:
  group: gf-m3-g1-tx-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tx-model:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Fonte isolada sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Apenas testes negativos da maquina de estados G1
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          $ErrorActionPreference='Stop'
          $project='prototipos/autoatualizador-seguro/m3-g1-transaction/G1Transaction.csproj'
          $output=Join-Path $env:RUNNER_TEMP 'gf-m3-g1tx-artifacts'
          $report=Join-Path $env:RUNNER_TEMP 'gf-m3-g1tx-report.json'
          if ((dotnet --version).Trim() -ne '10.0.402') { throw 'G1TX_SDK_MISMATCH' }
          dotnet restore $project "-p:ArtifactsPath=$output" --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project "-p:ArtifactsPath=$output" -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runners=@(Get-ChildItem $output -Filter 'GF.Updater.M3.G1TransactionTests.exe' -Recurse -File)
          if ($runners.Count -ne 1) { throw 'G1TX_RUNNER_NOT_UNIQUE' }
          & $runners[0].FullName --report $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r=Get-Content $report -Raw | ConvertFrom-Json
          if ($r.failed -ne 0 -or $r.passed -ne 16 -or
              !$r.post_commit_lost_reply_reconciled_blocked -or
              !$r.concurrent_cas_single_winner -or !$r.ack_did_not_activate -or
              !$r.offline_did_not_fallback -or !$r.competing_commit_refused -or
              !$r.idempotent_retry_no_double_commit -or
              !$r.simulated_crash_boundaries_exercised -or
              !$r.stage2_original_fixture_untouched -or
              $r.operational_gates_closed -ne 0 -or
              $r.local_journal_durable -or $r.remote_witness_durable -or
              $r.authenticated_witness -or $r.physical_power_loss_tested -or
              $r.product_built -or $r.product_executed -or
              $r.update_execution_implemented) { throw 'G1TX_REPORT_INVALID' }
          $compile=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          $leaks=@($compile.Items.Compile | Where-Object { $_.Identity -match 'prototipos[/\\]autoatualizador-seguro[/\\]m3-g1-transaction' })
          if ($leaks.Count -ne 0) { throw 'G1TX_PRODUCT_COMPILE_LEAK' }
          "G1 TX fixture: $($r.passed) PASS; CAS+ack ambiguity and crashes modeled, no product build/deploy or operational gates." >> $env:GITHUB_STEP_SUMMARY
# Inert journal/witness in memory, no network, keys, telemetry, release or GF execution.
