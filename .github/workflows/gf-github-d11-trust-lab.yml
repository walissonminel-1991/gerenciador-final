name: GF - D1.1 vinculo D0 TUF persistente (laboratorio)
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/github-trust-lab/**'
      - '.github/workflows/gf-github-d11-trust-lab.yml'
permissions:
  contents: read
concurrency:
  group: gf-d11-persistent-lab
  cancel-in-progress: false
jobs:
  persistent-trust:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout sem credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .NET 10 fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python 3.13 fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependencias TUF Stage11
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'GF_D11_DEPS' }
      - name: Compilar D0 isolado sem injetar fontes no GF
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($p.Items.Compile | Where-Object { $_.Identity -match 'prototipos[/\\]autoatualizador-seguro' }).Count -ne 0) {
            throw 'GF_D11_GLOB_LEAK'
          }
          $project='prototipos/autoatualizador-seguro/github-trust-lab/GF.D11.D0Probe.csproj'
          $output=Join-Path $env:RUNNER_TEMP 'gf-d11-d0'
          dotnet build $project -c Release -r win-x64 --self-contained false -o $output --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $output 'GF.D11.D0Probe.exe'))) {
            throw 'GF_D11_BUILD'
          }
      - name: Provar pisos TUF persistentes e 14 recusas
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-d11-d0\GF.D11.D0Probe.exe'
          $script='prototipos/autoatualizador-seguro/github-trust-lab/d11_persistent_lab.py'
          $line=(python $script $exe | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$line -or !$line.StartsWith('GF_D11_RESULT ')) {
            throw 'GF_D11_SUITE_NOT_EXECUTED'
          }
          $r=$line.Substring('GF_D11_RESULT '.Length) | ConvertFrom-Json
          if ($r.schema -ne 'gf-github-d11-persist/1' -or
              $r.scope -ne 'D0_REAL_CSHARP_FIXTURE_PLUS_PYTHON_TUF' -or
              $r.status -ne 'passed' -or $r.positive_cycles -ne 2 -or
              $r.adversarial_rejected -ne 14 -or
              @($r.persisted_role_versions).Count -ne 4 -or
              @($r.persisted_role_versions)[0] -ne 1 -or
              @($r.persisted_role_versions)[1] -ne 2 -or
              @($r.persisted_role_versions)[2] -ne 2 -or
              @($r.persisted_role_versions)[3] -ne 2 -or
              $r.same_user_global_rollback_resistant -or
              $r.cross_process_recovery_proven -or
              $r.production_root -or $r.network_requests -ne 0 -or
              $r.executables_downloaded -ne 0 -or $r.product_modified -or
              $r.operational_ready -or $r.automatic_recovery_authorized) {
            throw 'GF_D11_UNPROVEN_TRUST_AUTHORITY'
          }
          Write-Host $line
# No deploy, no release, no binary download, no installation, no product changes.
