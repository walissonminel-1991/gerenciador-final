name: M3 L5 — TUF Stage3 Stage2 CAS L4 em composicao inerte
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/m3-l5-composed/**'
      - '.github/workflows/autoatualizador-m3-l5-composicao-real-inerte.yml'
permissions:
  contents: read
concurrency:
  group: gf-m3-l5-composed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-bytes-inert:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout somente leitura sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python de fixture
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependencias de assinatura publicas de teste fixadas no Stage11
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar e executar apenas seis negativos novos do Lote 5
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          $project='prototipos/autoatualizador-seguro/m3-l5-composed/L5Composed.csproj'
          $anchor='prototipos/autoatualizador-seguro/fixtures/bootstrap.test-only.json'
          $work=Join-Path $env:RUNNER_TEMP 'gf-m3-l5-pinned-source'
          $fixtures=Join-Path $env:RUNNER_TEMP 'gf-m3-l5-public-signed-fixtures'
          $out=Join-Path $env:RUNNER_TEMP 'gf-m3-l5-artifacts'
          $report=Join-Path $env:RUNNER_TEMP 'gf-m3-l5-report.json'
          if ((dotnet --version).Trim() -ne '10.0.402') { throw 'L5_SDK_MISMATCH' }
          $source=(python prototipos/autoatualizador-seguro/m3-composed/prepare_pinned_source.py $work | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $source)) { throw 'L5_PINNED_TUF_UNAVAILABLE' }
          python prototipos/autoatualizador-seguro/m3-composed-3/generate_signed_fixtures.py $fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore $project "-p:ArtifactsPath=$out" "-p:Stage8Source=$source" --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project "-p:ArtifactsPath=$out" "-p:Stage8Source=$source" -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe=@(Get-ChildItem $out -Filter 'GF.Updater.M3.L5ComposedTests.exe' -Recurse -File)
          if ($exe.Count -ne 1) { throw 'L5_RUNNER_NOT_UNIQUE' }
          & $exe[0].FullName --report $report $fixtures $anchor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r=Get-Content $report -Raw | ConvertFrom-Json
          if ($r.passed -ne 6 -or $r.failed -ne 0 -or
              !$r.exact_stage3_signed_binding_bytes_carried -or
              !$r.both_remote_reply_loss_cutpoints_reconciled -or
              !$r.stage3_unmapped_manifest_change_blocked -or
              !$r.operation_journal_drift_blocked -or
              !$r.stage2_intent_byte_drift_blocked -or
              !$r.intent_alone_does_not_authenticate_terminal -or
              !$r.rolled_back_terminal_byte_fork_blocked -or
              !$r.old_selector_never_changed -or
              !$r.complete_tuf_signed_fixture_refresh -or
              !$r.actual_stage2_rollback_read -or
              !$r.witness_in_memory_only -or
              $r.durable_independent_witness_exists -or
              $r.external_receipt_signed -or
              $r.real_crash_recovery_after_witness_restart -or
              $r.physical_power_failure_tested -or
              $r.production_key_or_service_created -or
              $r.product_executed -or $r.product_built -or
              $r.selection_authorized -or $r.confirmation_authorized -or
              $r.operational_gates_closed -ne 0) { throw 'L5_FALSE_SECURITY_SUCCESS' }
          $projectItems=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          $leak=@($projectItems.Items.Compile | Where-Object { $_.Identity -match 'prototipos[/\\]autoatualizador-seguro[/\\]m3-l5-composed' })
          if ($leak.Count -ne 0) { throw 'L5_PRODUCT_COMPILE_LEAK' }
          "L5: $($r.passed) negative composed tests PASS. Real signed Stage11 TUF, Stage2 rollback, L4 memory CAS; no production gates." >> $env:GITHUB_STEP_SUMMARY
# No real updater, services, subscriptions, operational keys, telemetry or deploy.
