# Historico: usar somente na branch da versao correspondente.
name: Gerenciador Final v5.13.10.3 Layout Responsivo - Windows x64

on:
  push:
    branches:
      - teste-layout-v5.13.10.3
    paths:
      - 'Program.cs'
      - 'StartupWindowSizing.cs'
      - 'ResponsiveLayout.cs'
      - 'LayoutTestAccess.cs'
      - 'TestesLayout/**'
      - 'ResidualAudit.cs'
      - 'ResidualAuditDialog.cs'
      - 'HistoricalResidualAudit.cs'
      - 'BroadResidualDiscovery.cs'
      - 'ActionableInventory.cs'
      - 'UninstallLaunchDiagnostics.cs'
      - 'MaintenanceAudit.cs'
      - 'HistoricalDeviceAudit.cs'
      - 'GameLibraryAudit.cs'
      - 'CatalogoAuditoriaHistorica.json'
      - 'GerenciadorAplicativos.csproj'
      - 'RuckZuckCatalog.cs'
      - 'OfficialReleaseSources.cs'
      - 'LocalMsixInventory.cs'
      - 'InventoryReconciler.cs'
      - 'ProtectedApplications.cs'
      - 'TestesMsix/**'
      - 'TestesMultifontes/**'
      - 'TestesCatalogo/**'
      - 'RuckZuckModels.cs'
      - 'Matching.cs'
      - 'DarkControls.cs'
      - 'DarkConfirmDialog.cs'
      - 'Matching.cs'
      - 'RuckZuckModels.cs'
      - 'VerifiedUpdaters.cs'
      - 'WindowsTerminalUpdater.cs'
      - 'UpdateProcessCoordinator.cs'
      - 'InstallerLockScanner.cs'
      - 'UpdateBlockingPreflight.cs'
      - 'UninstallResiduals.cs'
      - 'AdvancedUninstallCleaner.cs'
      - 'UninstallRuleCatalog.cs'
      - 'CatalogoDesinstalacao.json'
      - 'CatalogoIdentidades.json'
      - 'ApplicationIdentityCatalog.cs'
      - 'TestesResiduos/**'
      - 'TestesFechamento/**'
      - 'TestesAtualizador/**'
      - 'IntegratedSystemUi.cs'
      - 'AdvancedFeatures.cs'
      - 'DiagnosticTrace.cs'
      - 'app.manifest'
      - 'TestesManifesto/**'
      - 'VerifiedUpdaters.cs'
      - 'TestesAtualizador/**'
      - '.github/workflows/compilar-gerenciador-v5.12.7.yml'
      - 'TestesMotor/**'
      - 'TestesRede/**'
      - '.github/workflows/compilar-gerenciador-v5.13.10.3.yml'




  pull_request:
    branches:
      - teste-residuos-contextuais-v5.13.7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-e-publicar:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Obter arquivos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Testar 21 resolucoes e referencia 1440x900 com foco e rolagem
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet run --project TestesLayout/TestesLayout.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guardar capturas do layout
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Layout-v5.13.10.3
          path: LayoutCaptures/
          if-no-files-found: ignore
          retention-days: 7
      - name: Validar protecao de jogos ativos e cobertura alem dos 12 exemplos
        shell: pwsh
        run: |
          $games = Get-Content GameLibraryAudit.cs -Raw
          $broad = Get-Content BroadResidualDiscovery.cs -Raw
          $ui = Get-Content Program.cs -Raw
          $tests = Get-Content TestesResiduos/Program.cs -Raw
          if (-not $games.Contains('activeNames.Add(name)') -or
              -not $games.Contains('ActiveNames = activeNames.ToArray()')) {
            throw 'Manifestos Steam e Epic precisam contribuir com todos os nomes ativos'
          }
          if (-not $broad.Contains('protectedGames.Contains') -or
              -not $broad.Contains('gameInventoryPartial')) {
            throw 'Auditoria nao protege jogos ativos ou nao sinaliza inventario parcial'
          }
          if (-not $ui.Contains('gameInventory.ActiveNames') -or
              -not $ui.Contains('jogos_ativos=')) {
            throw 'Lista de jogos nao integrada ao scanner geral'
          }
          if (-not $tests.Contains('Jogo ativo via Steam/Epic nao e falso residuo')) {
            throw 'Teste de regressao de jogos ativos ausente'
          }

      - name: Validar jogos adicionais somente leitura sem atualizacao ou uninstall
        shell: pwsh
        run: |
          $game = Get-Content GameLibraryAudit.cs -Raw
          $app = Get-Content Program.cs -Raw
          $test = Get-Content TestesResiduos/Program.cs -Raw
          if (-not $game.Contains('AllGames = allGames.ToArray()') -or
              -not $game.Contains('UnregisteredGames(')) {
            throw 'Apenas exemplos da biblioteca estao sendo inventariados'
          }
          if (-not $game.Contains('if (!SafeFile(filename)) { unreadable++; partial = true; continue; }') -or
              -not $game.Contains('if (name is null) { unreadable++; partial = true; continue; }')) {
            throw 'Manifestos ilegíveis ou invalidos nao podem declarar inventario completo'
          }
          if (-not $app.Contains('GameLibraryAudit.UnregisteredGames(games, result)') -or
              -not $app.Contains('InventoryOnly = true') -or
              -not $app.Contains('Biblioteca de jogos: ') -or
              -not $app.Contains('JOGOS.LEITURA')) {
            throw 'Jogos sem ARP nao foram integrados como somente leitura'
          }
          if (-not $app.Contains('!x.InventoryOnly || x.VerifiedMsixIdentity')) {
            throw 'Jogos sem receita nao podem participar do motor de atualizacoes'
          }
          if (-not $app.Contains('var inventorySnapshot = await Task.Run(AppServices.ScanAllInstalledApps);') -or
              -not $app.Contains('var gameInventory = inventorySnapshot.Games;')) {
            throw 'Auditoria historica nao reutiliza inventario Win32/MSIX/Steam/Epic'
          }
          if ($app.Contains('var updatedInventory = await Task.Run(AppServices.GetInstalledPrograms);')) {
            throw 'Auditoria nao deve voltar a ignorar MSIX ou repetir a leitura de jogos'
          }
          if (-not $test.Contains('Deduplicar mesma identidade por plataforma')) {
            throw 'Teste da deduplicacao Steam Epic e ARP nao esta presente'
          }

      - name: Verificar versao real do log e preservacao de integracoes ativas
        shell: pwsh
        run: |
          $trace = Get-Content DiagnosticTrace.cs -Raw
          $source = Get-Content HistoricalResidualAudit.cs -Raw
          $rules = Get-Content CatalogoAuditoriaHistorica.json -Raw | ConvertFrom-Json
          $ui = Get-Content Program.cs -Raw
          $tests = Get-Content TestesResiduos/Program.cs -Raw
          if (-not $trace.Contains('typeof(DiagnosticTrace).Assembly.GetName().Version') -or
              -not $trace.Contains('GerenciadorFinal-Diagnostico-{VersionLabel}.log') -or
              $trace.Contains('Gerenciador Final v5.13.2')) {
            throw 'Log deve usar versao do assembly e jamais manter cabecalho antigo'
          }
          $vivaldi = @($rules.rules | Where-Object id -eq 'vivaldi')
          if ($vivaldi.Count -ne 1 -or -not $vivaldi[0].activeDependents.Contains('Proton Pass') -or
              -not $source.Contains('rule.InstalledNames.Concat(rule.ActiveDependents)')) {
            throw 'Host Proton Pass deve permanecer protegido enquanto em uso'
          }
          if (-not $ui.Contains('pnp_sem_correspondencia=') -or
              -not $ui.Contains('instâncias PnP sem confirmação')) {
            throw 'Comparacao PnP nao pode afirmar drivers antigos ou desconectados'
          }
          if (-not $tests.Contains('Dispositivos desconectados e instancias do Registro') -or
              -not $tests.Contains('Host de mensagens do Vivaldi protegido')) {
            throw 'Regressao dos resultados da maquina de testes ausente'
          }

      - name: Validar residuos contextuais e falhas de desinstalacao
        shell: pwsh
        run: |
          $audit = Get-Content BroadResidualDiscovery.cs -Raw
          $ui = Get-Content ResidualAuditDialog.cs -Raw
          $app = Get-Content Program.cs -Raw
          $advice = Get-Content UninstallLaunchDiagnostics.cs -Raw
          $tests = Get-Content TestesResiduos/Program.cs -Raw
          if (-not $audit.Contains('KnownSharedPublishers') -or
              -not $audit.Contains('Instalação não confirmada') -or
              -not $audit.Contains('Dados compartilhados de fabricante') -or
              -not $audit.Contains('Vestígio não confirmado')) {
            throw 'Faltam as tres categorias conservadoras do inventario'
          }
          if (-not $ui.Contains('INSTALAÇÃO A CONFERIR') -or
              -not $ui.Contains('PERFIL DE FABRICANTE / JOGOS') -or
              -not $ui.Contains('Uma única janela')) {
            throw 'Falta agrupamento protegido e compacto na janela escura'
          }
          if (-not $app.Contains('MaintenanceAudit.CheckUninstaller(command, false)') -or
              -not $app.Contains('catch (Win32Exception ex)') -or
              -not $app.Contains('codigo_win32=') -or
              -not $advice.Contains('1223') -or
              -not $advice.Contains('740')) {
            throw 'Falha nativa nao pode ser tratada por exclusao ou comando alternativo'
          }
          if (-not $tests.Contains('Netease com Program Files') -or
              -not $tests.Contains('Falhas reais de desinstalacao')) {
            throw 'Faltam testes de regressao dos resultados observados'
          }
          if ($audit.Contains('File.Delete(') -or $audit.Contains('Directory.Delete(') -or
              $audit.Contains('DeleteSubKey') -or $audit.Contains('Process.Start')) {
            throw 'Scanner contextual nao pode excluir ou executar'
          }

      - name: Garantir que aba Aplicativos mostre somente itens com acoes
        shell: pwsh
        run: |
          $app = Get-Content Program.cs -Raw
          $source = Get-Content ActionableInventory.cs -Raw
          $row = Get-Content DarkControls.cs -Raw
          $tests = Get-Content TestesResiduos/Program.cs -Raw
          if (-not $source.Contains('CheckUninstaller(app.UninstallString') -or
              -not $source.Contains('CheckUninstaller(app.QuietUninstallString') -or
              -not $source.Contains('app.CanUninstall || app.IsUpdate')) {
            throw 'O filtro deve mostrar so desinstaladores reais e candidatos de atualizacao'
          }
          if (-not $app.Contains('ActionableInventory.ShouldShow(entry)') -or
              -not $app.Contains('ActionableInventory.VisibleCount(_installed)') -or
              -not $app.Contains('item.CanUninstall') -or
              -not $app.Contains('!ActionableInventory.CanUninstall(x)')) {
            throw 'O desenho, a contagem e a desinstalacao devem usar as mesmas regras'
          }
          if (-not $row.Contains('item.CanUninstall') -or
              -not $row.Contains('current.CanUninstall')) {
            throw 'Selecao e clique nao podem habilitar desinstalacao de MSIX ou jogos'
          }
          if (-not $tests.Contains('Lista principal mostra apenas dois aplicativos realmente desinstalaveis') -or
              -not $tests.Contains('Atualizacao na Store permanece visivel')) {
            throw 'Faltam os testes de inventario util contra itens sem acao'
          }
          if ($source.Contains('File.Delete(') -or $source.Contains('Process.Start(') -or
              $source.Contains('DeleteSubKey')) {
            throw 'Filtro nao pode apagar arquivos ou executar desinstaladores'
          }

      - name: Validar limites rigorosos da limpeza profunda avançada
        shell: pwsh
        run: |
          $ui = Get-Content Program.cs -Raw
          $deep = Get-Content AdvancedUninstallCleaner.cs -Raw
          if (-not $ui.Contains('Tool("Limpeza avançada"')) { throw 'Opção avançada não encontrada' }
          if (-not $ui.Contains('Limpeza avançada — confirmar exclusão')) { throw 'Confirmação separada ausente' }
          if (-not $ui.Contains('AdvancedUninstallCleaner.StillInstalled(item.App, fresh)')) { throw 'Deve revalidar instalação' }
          if (-not $deep.Contains('Registry.CurrentUser')) { throw 'Escopo HKCU ausente' }
          if ($deep.Contains('Registry.LocalMachine') -or $deep.Contains('Registry.ClassesRoot')) {
            throw 'Não é permitido apagar HKLM nem classes compartilhadas'
          }
          if (-not $deep.Contains('FileAttributes.ReparsePoint')) { throw 'Proteção de symlinks ausente' }
          if (-not $deep.Contains('OwnRegistryPath(key, allowlist)')) { throw 'Permitir somente chaves exatas' }
          if ($deep.Contains('Remove-Item') -or $deep.Contains('taskkill.exe')) { throw 'Operação deve ser nativa .NET' }

      - name: Validar catalogo embutido e corrigir botoes que estavam ocultos
        shell: pwsh
        run: |
          $source = Get-Content Program.cs -Raw
          $catalog = Get-Content UninstallRuleCatalog.cs -Raw
          $json = Get-Content CatalogoDesinstalacao.json -Raw | ConvertFrom-Json
          $proj = Get-Content GerenciadorAplicativos.csproj -Raw
          if ($json.rules.Count -lt 6) { throw 'Cobertura minima do catalogo nao atingida' }
          if (-not $proj.Contains('GerenciadorFinal.UninstallCatalog')) { throw 'Catalogo nao esta embutido' }
          if (-not $source.Contains('compact: true')) { throw 'Cartoes em quatro colunas ausentes' }
          if (-not $source.Contains('ScrollablePage(cleaningLayout, width =>')) { throw 'Layout responsivo ausente' }
          if (-not $source.Contains('AdvancedUninstallCleaner.StillInstalled(item.App, fresh)')) {
            throw 'Nao pode apagar dados de programas reinstalados'
          }
          if ($catalog.Contains('WebClient') -or $catalog.Contains('HttpClient') -or $catalog.Contains('Process.Start')) {
            throw 'Banco de dados nao deve executar comandos ou baixar scripts'
          }

      - name: Cruzar os tres bancos de identidades sem permitir comandos ou delecoes
        shell: pwsh
        run: |
          $shared = Get-Content CatalogoIdentidades.json -Raw | ConvertFrom-Json
          $cleanup = Get-Content CatalogoDesinstalacao.json -Raw | ConvertFrom-Json
          $official = Get-Content OfficialReleaseSources.cs -Raw
          $program = Get-Content Program.cs -Raw
          $identity = Get-Content ApplicationIdentityCatalog.cs -Raw
          $residual = Get-Content UninstallResiduals.cs -Raw
          $catalog = Get-Content UninstallRuleCatalog.cs -Raw
          if ($shared.rules.Count -ne 18) { throw 'Catalogo nao possui 18 familias' }
          if (@($shared.rules | Where-Object officialSource).Count -ne 14) {
            throw 'Deve haver 14 identificadores de fonte oficial'
          }
          if (@($shared.rules | Where-Object cleanupPolicy).Count -ne 6) {
            throw 'As 6 politicas de limpeza precisam de identidade'
          }
          foreach ($rule in $shared.rules) {
            if ($rule.officialSource -and -not $official.Contains('new("' + $rule.officialSource + '"')) {
              throw "Fonte oficial desconhecida no catálogo: $($rule.id)"
            }
            if ($rule.cleanupPolicy -and @($cleanup.rules | Where-Object id -eq $rule.cleanupPolicy).Count -ne 1) {
              throw "Política de limpeza ausente: $($rule.id)"
            }
          }
          if (-not $program.Contains('ApplicationIdentityCatalog.Resolve(name, publisher)') -or
              -not $program.Contains('CatalogIdentity = known?.Id ?? ""')) {
            throw 'O inventario deve usar o banco central'
          }
          if (-not $program.Contains('entry.CatalogIdentity, entry.CatalogDisplayName')) {
            throw 'Pesquisa deve reconhecer identidade e nome oficial'
          }
          if (-not $official.Contains('ApplicationIdentityCatalog.MatchesOfficialSource(')) {
            throw 'Atualizacoes oficiais nao passaram pelo banco central'
          }
          if (-not $residual.Contains('ApplicationIdentityCatalog.IsStillInstalled(') -or
              -not $catalog.Contains('ApplicationIdentityCatalog.Resolve(')) {
            throw 'Desinstalacao/limpeza precisam reutilizar o ID comum'
          }
          if ($identity.Contains('Process.Start') -or $identity.Contains('HttpClient') -or
              $identity.Contains('File.Delete') -or $identity.Contains('Registry.CurrentUser')) {
            throw 'Banco de identidade nunca executa nem remove arquivos'
          }

      - name: Validar tamanho inicial e fluxo de confirmacao pos-desinstalacao
        shell: pwsh
        run: |
          $source = Get-Content Program.cs -Raw
          $sizing = Get-Content StartupWindowSizing.cs -Raw
          if (-not $sizing.Contains('PreferredSize = new(875, 745)')) {
            throw 'Nao corresponde ao dimensionamento da captura aprovada'
          }
          if (-not $source.Contains('Bounds = opening;') -or
              -not $source.Contains('StartupWindowSizing.Fit(display)') -or
              -not $source.Contains('StartupWindowSizing.KeepVisible(Bounds, area)')) {
            throw 'Janela nao respeita tamanho inicial e area util do monitor'
          }
          if (-not $source.Contains('Screen.FromControl(this).WorkingArea')) {
            throw 'DPI e tela atual nao conferidos'
          }
          if (-not $source.Contains('await proc.WaitForExitAsync(timeout.Token)')) {
            throw 'Desinstalacao precisa aguardar encerramento do instalador'
          }
          if (-not $source.Contains('DESINSTALACAO.REGISTRO_AUSENTE') -or
              -not $source.Contains('UninstallResiduals.StillInstalled(entry, inventory)')) {
            throw 'Desinstalacao sem confirmacao da remocao do Registro'
          }
          if (-not $source.Contains('await Task.Run(() => UninstallResiduals.Inspect(item))')) {
            throw 'Inspecao pos-desinstalacao sem ligacao ao fluxo real'
          }
          if (-not $source.Contains('DarkConfirmDialog.Confirm(this, question, "Limpar resíduos após desinstalação")')) {
            throw 'Falta confirmacao explicita dos residuos encontrados'
          }

      - name: Garantir comparação histórica de dispositivos sem exclusões
        shell: pwsh
        run: |
          $scan = Get-Content HistoricalDeviceAudit.cs -Raw
          $maintenance = Get-Content MaintenanceAudit.cs -Raw
          $ui = Get-Content Program.cs -Raw
          $tests = Get-Content TestesResiduos/Program.cs -Raw
          if (-not $scan.Contains('CurrentControlSet\Enum') -or
              -not $scan.Contains('"PCI", "USB", "USBSTOR"') -or
              -not $scan.Contains('writable: false')) {
            throw 'Scanner de Registro deve cobrir apenas instancias PnP PCI/USB somente leitura'
          }
          if ($scan.Contains('DeleteSubKey') -or $scan.Contains('Process.Start') -or
              $scan.Contains('File.Delete') -or $scan.Contains('CreateSubKey')) {
            throw 'Scanner PnP não deve modificar sistema'
          }
          if (-not $maintenance.Contains('HistoricalDeviceAudit.Inspect(device.PresentIds)') -or
              -not $maintenance.Contains('device.PresentIds is { Count: > 0 }') -or
              -not $maintenance.Contains('!device.Partial')) {
            throw 'Histórico PnP não pode ser comparado contra consulta WMI incompleta'
          }
          if (-not $ui.Contains('previewRow.ColumnStyles.Add(new ColumnStyle(SizeType.Absolute, 248))')) {
            throw 'Botão Diagnóstico completo continua cortado'
          }
          if (-not $ui.Contains('REGISTRO PnP:') -or
              -not $ui.Contains('WithPublisher') -or
              -not $ui.Contains('WithVersion')) {
            throw 'Diferenciar inventário real da cobertura de receitas'
          }
          if (-not $tests.Contains('Comparação encontra hardware histórico') -or
              -not $tests.Contains('Acesso parcial não declara')) {
            throw 'Casos de troca de hardware ausentes'
          }

      - name: Provar que a auditoria de software e hardware nao modifica o Windows
        shell: pwsh
        run: |
          $source = Get-Content MaintenanceAudit.cs -Raw
          $games = Get-Content GameLibraryAudit.cs -Raw
          $ui = Get-Content Program.cs -Raw
          $tests = Get-Content TestesResiduos/Program.cs -Raw
          if (-not $source.Contains('Win32_PnPEntity') -or
              -not $source.Contains('Present, ConfigManagerErrorCode') -or
              -not $source.Contains('PNPDeviceID')) {
            throw 'Falta consulta real ao inventario PnP'
          }
          if (-not $source.Contains('CheckUninstaller(') -or
              -not $source.Contains('IsPathFullyQualified')) {
            throw 'Desinstaladores devem ser verificados de maneira conservadora'
          }
          if ($source.Contains('File.Delete(') -or
              $source.Contains('Directory.Delete(') -or
              $source.Contains('DeleteSubKey(') -or
              $source.Contains('Process.Start(') -or
              $source.Contains('pnputil.exe') -or
              $source.Contains('cmd.exe /c')) {
            throw 'Auditoria nova deve ser absolutamente somente de leitura'
          }
          if (-not $ui.Contains('RunMaintenanceAuditAsync') -or
              -not $ui.Contains('Diagnóstico completo') -or
              -not $ui.Contains('MaintenanceAudit.Inspect(apps)')) {
            throw 'Botao de diagnostico sem operacao real'
          }
          if (-not $ui.Contains('DIAGNOSTICO_COMPLETO.FIM')) {
            throw 'Falta telemetria local por contadores, sem dados pessoais'
          }
          if (-not $games.Contains('appmanifest_*.acf') -or
              -not $games.Contains('EpicGamesLauncher') -or
              -not $games.Contains('TryReadEpicManifest') -or
              -not $ui.Contains('GameLibraryAudit.Inspect')) {
            throw 'Falta reconhecimento de jogos anteriores Steam e Epic'
          }
          if ($games.Contains('File.Delete(') -or $games.Contains('Process.Start(') -or
              $games.Contains('Directory.Delete(')) {
            throw 'Motor de jogos não pode executar ações destrutivas'
          }
          if (-not $tests.Contains('Steam pode possuir vários discos') -or
              -not $tests.Contains('Manifesto Epic sem identificador')) {
            throw 'Faltam testes contra jogos inventados'
          }
          if (-not $tests.Contains('GPU PCI desconectada') -or
              -not $tests.Contains('Hardware presente ou status desconhecido') -or
              -not $tests.Contains('Caminho absoluto removido')) {
            throw 'Testes de troca de hardware e desinstalacao ausentes'
          }

      - name: Validar varredura geral sem rastros anteriores e sem excluir dados pessoais
        shell: pwsh
        run: |
          $code = Get-Content BroadResidualDiscovery.cs -Raw
          $ui = Get-Content Program.cs -Raw
          $tests = Get-Content TestesResiduos/Program.cs -Raw
          if (-not $code.Contains('Environment.SpecialFolder.CommonApplicationData') -or
              -not $code.Contains('Environment.SpecialFolder.LocalApplicationData') -or
              -not $code.Contains('Environment.SpecialFolder.ProgramFiles') -or
              -not $code.Contains('Environment.SpecialFolder.Programs') -or
              -not $code.Contains('RegistryHive.LocalMachine') -or
              -not $code.Contains('RegistryHive.CurrentUser')) {
            throw 'O inventario historico deve examinar locais de apps e os dois hives'
          }
          if ($code.Contains('File.Delete(') -or $code.Contains('Directory.Delete(') -or
              $code.Contains('DeleteSubKey') -or $code.Contains('CreateSubKey') -or
              $code.Contains('Process.Start') -or $code.Contains('cmd.exe')) {
            throw 'Motor geral nao pode modificar nem executar'
          }
          if (-not $code.Contains('SpecialFolder.CommonPrograms') -or
              -not $code.Contains('RegistryView.Registry32')) {
            throw 'Atalhos gerais e entradas de registro 32 bits precisam ser analisados'
          }
          if (-not $code.Contains('TimeSpan.FromSeconds(14)') -or
              -not $code.Contains('MaxEntriesPerRoot = 2500')) {
            throw 'Limites de desempenho ausentes'
          }
          if (-not $tests.Contains('Bibliotecas pessoais') -and
              -not $tests.Contains('bibliotecas pessoais')) {
            throw 'Falta teste de exclusao das bibliotecas pessoais'
          }
          if (-not $ui.Contains('BroadResidualDiscovery.Inspect(updatedInventory,') -or
              -not $ui.Contains('RESIDUOS_GERAIS.CONSULTA_FIM')) {
            throw 'A varredura deve estar disponivel no botao Residuos de aplicativos'
          }
          if (-not $ui.Contains('broad.Incomplete')) {
            throw 'Aviso de analise parcial nao pode ser omitido'
          }

      - name: Validar catalogo histórico somente leitura e dados protegidos
        shell: pwsh
        run: |
          $code = Get-Content HistoricalResidualAudit.cs -Raw
          $data = Get-Content CatalogoAuditoriaHistorica.json -Raw | ConvertFrom-Json
          $proj = Get-Content GerenciadorAplicativos.csproj -Raw
          $ui = Get-Content ResidualAuditDialog.cs -Raw
          $program = Get-Content Program.cs -Raw
          if ($data.rules.Count -ne 3) { throw 'Origem uTorrent e Vivaldi faltando' }
          if (-not $data.rules.id.Contains('origin-legacy') -or
              -not $data.rules.id.Contains('vivaldi') -or
              -not $data.rules.id.Contains('utorrent-web')) {
            throw 'Familias historicas ausentes'
          }
          if (-not $proj.Contains('GerenciadorFinal.HistoricalOrphanCatalog')) {
