      - name: Testar nomes, descricoes, cores e texto sem truncamento na limpeza
        shell: pwsh
        run: |
          $source = Get-Content Program.cs -Raw
          if (-not $source.Contains('AllowMultilineText ? TextFormatFlags.WordBreak')) {
            throw 'Modo de quebra em linhas ausente; titulos podem ficar cortados'
          }
          if (-not $source.Contains('Limpeza de Disco\nautomática')) {
            throw 'Titulo longo de Limpeza de Disco sem segunda linha'
          }
          if (-not $source.Contains('compact ? 146 : 146')) { throw 'Card não ganhou altura para descricao' }
          if (-not $source.Contains('compact ? 58 : 48')) { throw 'Botao nao comporta duas linhas' }
          if (-not $source.Contains('ToolsHeight(cleaningActions, width)')) {
            throw 'Pagina precisa medir a altura real da grade'
          }
          $expected = @(
            @('Temporários do usuário', 'AppServices.Blue'),
            @('Temporários do Windows', 'AppServices.Orange'),
            @('Cache do Windows Update', 'AppServices.Red'),
            @('Esvaziar Lixeira', 'AppServices.Red'),
            @('Limpeza de Disco automática', 'AppServices.Blue'),
            @('Cache de shaders DirectX', 'AppServices.Gray'),
            @('Resíduos de aplicativos', 'AppServices.Gray'),
            @('Limpeza avançada', 'AppServices.Orange')
          )
          foreach ($pair in $expected) {
            $name = [regex]::Escape($pair[0])
            $color = [regex]::Escape($pair[1])
            if (-not [regex]::IsMatch($source, 'Tool\("' + $name + '"\s*,[\s\S]*?' + $color + '\s*,', 'Singleline')) {
              throw "Cor de impacto ausente/incorreta para $($pair[0])"
            }
          }
          $tools = [regex]::Matches($source, 'Tool\("(?<name>[^"]+)"\s*,\s*"(?<description>[^"]+)"\s*,\s*AppServices\.(Blue|Orange|Red|Gray)')
          foreach ($pair in $expected) {
            $item = @($tools | Where-Object { $_.Groups['name'].Value -eq $pair[0] })
            if ($item.Count -ne 1 -or $item[0].Groups['description'].Value.Length -lt 35) {
              throw "Descricao incompleta ou duplicada: $($pair[0])"
            }
          }
          if ($source.Contains('Tool("Limpeza profunda (avançado)"')) { throw 'Nome antigo ainda visivel' }
          if (-not $source.Contains('LIMPEZA_AVANCADA.CONSULTA_INICIO')) {
            throw 'Etapas do diagnostico nao receberam o novo nome'
          }
          if (-not $source.Contains('button.AccessibleName = tool.Name')) {
            throw 'Acessibilidade dos botões sem nome completo'
          }

