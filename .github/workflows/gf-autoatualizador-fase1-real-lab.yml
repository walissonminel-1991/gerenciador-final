name: GF Fase 1 - composicao de bytes reais em Windows descartavel
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/phase1-composed/**'
      - '.github/workflows/gf-autoatualizador-fase1-real-lab.yml'
permissions:
  contents: read
concurrency:
  group: gf-fase1-real-lab-branch-experimental
  cancel-in-progress: false
jobs:
  gf-real-product-lab:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET 10 fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependencias TUF de laboratorio
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'GF_PHASE1_TUF_DEPENDENCIES' }
      - name: Recusar criacao acidental de subprocesso no verificador de dados
        shell: pwsh
        run: |
          python prototipos/autoatualizador-seguro/phase1-composed/phase1_lab.py --data-only-launch-guard-test
          if ($LASTEXITCODE -ne 0) { throw 'GF_PHASE1_DATA_ONLY_LAUNCH_GUARD' }
      - name: Confirmar exclusao dos prototipos do produto
        shell: pwsh
        run: |
          if ((dotnet --version).Trim() -ne '10.0.402') { throw 'GF_PHASE1_SDK_UNEXPECTED' }
          $p=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($p.Items.Compile | Where-Object { $_.Identity -match 'prototipos[/\\]autoatualizador-seguro' }).Count -ne 0) {
            throw 'GF_PHASE1_PRODUCT_COMPILE_LEAK'
          }
      - name: Auditar rotas reais de efeitos delegados sem executar operacoes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $line=(python prototipos/autoatualizador-seguro/phase1-composed/delegated_effect_surface_gate.py | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$line -or !$line.StartsWith('GF_PHASE1_DELEGATED_EFFECT_SURFACE_REPORT ')) {
            throw 'GF_PHASE1_REAL_DELEGATED_EFFECT_SURFACE_GATE_FAILED'
          }
          $r=($line.Substring('GF_PHASE1_DELEGATED_EFFECT_SURFACE_REPORT '.Length) | ConvertFrom-Json)
          if ($r.source_routes.Count -ne 9 -or $r.unbounded_delegated_effect_routes -ne 7 -or
              $r.scope -ne 'SELECTED_REAL_PRODUCT_SOURCE_ANCHORS_ONLY' -or
              $r.status -ne 'SOURCE_ANCHORS_REVIEWED_NOT_EFFECTS_BOUNDED' -or
              !$r.fail_closed_barrier_present -or !$r.out_of_scope_brokers_may_exist -or
              $r.quiescence_proven -or $r.operational_ready -or
              $r.complete_call_graph_audited -or $r.production_authority -or
              $r.new_windows_operations_executed -or
              $r.job_empty_proves_all_effects_complete -or
              $r.provider_exit_proves_all_effects_complete) {
            throw 'GF_PHASE1_REAL_EFFECTS_CANNOT_CONFER_READY'
          }
          Write-Host $line
      - name: Refutar atribuicao transacional por caminho hash e identidade NTFS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $line=(python prototipos/autoatualizador-seguro/phase1-composed/effect_attribution_alias_probe.py | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$line -or !$line.StartsWith('GF_PHASE1_EFFECT_ATTRIBUTION_CASE ')) {
            throw 'GF_PHASE1_EFFECT_ATTRIBUTION_NEGATIVE_TEST_FAILED'
          }
          $r=($line.Substring('GF_PHASE1_EFFECT_ATTRIBUTION_CASE '.Length) | ConvertFrom-Json)
          if ($r.schema -ne 'gf-phase1-effect-attribution-alias/1' -or
              $r.status -ne 'NEGATIVE_PROVENANCE_COUNTEREXAMPLE' -or
              $r.scope -ne 'DISPOSABLE_WINDOWS_NTFS_HARDLINK_FIXTURE' -or
              !$r.different_writer_processes_executed -or
              !$r.distinct_test_transaction_origins -or
              !$r.hardlinks_share_ntfs_file_identity -or
              !$r.same_projected_evidence_for_distinct_origins -or
              !$r.same_user_claim_misattributed_other_origin -or
              @($r.observed_fields).Count -ne 6 -or
              $r.external_authority_established -or $r.quiescence_proven -or
              $r.automatic_recovery_permitted -or $r.operational_ready -or
              $r.real_msi_or_provider_executed -or
              $r.new_gf_execution -or $r.new_windows_maintenance_executed) {
            throw 'GF_PHASE1_EFFECT_ATTRIBUTION_UNTRUSTED_CLAIM_CANNOT_AUTHORIZE'
          }
          Write-Host $line
      - name: Compilar duas versoes reais do GF sem publicar artefatos
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $old=Join-Path $env:RUNNER_TEMP 'gf-phase1-old-publish'
          $new=Join-Path $env:RUNNER_TEMP 'gf-phase1-new-publish'
          if ((Test-Path $old) -or (Test-Path $new)) { throw 'GF_PHASE1_OUTPUT_NOT_FRESH' }
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:GfBetaProfile=local -p:Version=5.13.11.65 -o $old --nologo
          if ($LASTEXITCODE -ne 0) { throw 'GF_PHASE1_BUILD_OLD' }
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:GfBetaProfile=local -p:Version=5.13.11.66 -o $new --nologo
          if ($LASTEXITCODE -ne 0) { throw 'GF_PHASE1_BUILD_NEW' }
          if (!(Test-Path (Join-Path $old 'GerenciadorFinal.exe')) -or
              !(Test-Path (Join-Path $new 'GerenciadorFinal.exe'))) { throw 'GF_PHASE1_EXES_MISSING' }
      - name: Preparar fixtures e compilar coordenador C# para fluxo unificado
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sourceWork=Join-Path $env:RUNNER_TEMP 'gf-phase1-pinned-source'
          $fixtures=Join-Path $env:RUNNER_TEMP 'gf-phase1-signed-fixtures'
          $outputs=Join-Path $env:RUNNER_TEMP 'gf-phase1-csharp-artifacts'
          $project='prototipos/autoatualizador-seguro/phase1-composed/Phase1RealBridge.csproj'
          $stageSource=(python prototipos/autoatualizador-seguro/m3-composed/prepare_pinned_source.py $sourceWork | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $stageSource)) { throw 'GF_PHASE1_PINNED_STAGE8_SOURCE_REQUIRED' }
          python prototipos/autoatualizador-seguro/m3-composed-3/generate_signed_fixtures.py $fixtures
          if ($LASTEXITCODE -ne 0) { throw 'GF_PHASE1_SIGNED_INERT_FIXTURES_REQUIRED' }
          dotnet restore $project "-p:ArtifactsPath=$outputs" "-p:Stage8Source=$stageSource" --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { throw 'GF_PHASE1_CSHARP_RESTORE' }
          dotnet build $project "-p:ArtifactsPath=$outputs" "-p:Stage8Source=$stageSource" -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'GF_PHASE1_CSHARP_BUILD' }
      - name: Interromper coordenadores e reconciliar GF real em processos novos
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path '.').Path
          $outputs=Join-Path $env:RUNNER_TEMP 'gf-phase1-csharp-artifacts'
          $exes=@(Get-ChildItem $outputs -Filter 'GF.Updater.M3.L18Tests.exe' -File -Recurse)
          if ($exes.Count -ne 1) { throw 'GF_PHASE1_RECOVERY_RUNNER_NOT_UNIQUE' }
          $fixtures=Join-Path $env:RUNNER_TEMP 'gf-phase1-signed-fixtures'
          $anchor=Join-Path $root 'prototipos/autoatualizador-seguro/fixtures/bootstrap.test-only.json'
          $script=Join-Path $root 'prototipos/autoatualizador-seguro/phase1-composed/phase1_lab.py'
          $old=Join-Path $env:RUNNER_TEMP 'gf-phase1-old-publish'
          $new=Join-Path $env:RUNNER_TEMP 'gf-phase1-new-publish'
          $report=Join-Path $env:RUNNER_TEMP 'gf-phase1-real-crash-report.json'
          $pythonExe=(Get-Command python).Source
          # Retain the existing private fixture temp root. RUNNER_TEMP has
          # broad inherited writes and is intentionally rejected by NTFS guards.
          # Original build inputs remain in RUNNER_TEMP; copies use marked,
          # strictly checked private fixture roots on this disposable runner.
          & $exes[0].FullName --real-suite $report $fixtures $anchor $root $pythonExe $script $old $new
          if ($LASTEXITCODE -ne 0) { throw 'GF_PHASE1_REAL_CRASH_CASE_FAILED' }
          $r=Get-Content $report -Raw | ConvertFrom-Json
          if ($r.failed -ne 0 -or $r.expected_cases -ne 26 -or $r.tests.Count -ne 26 -or
              @($r.tests | Where-Object { $_.status -ne 'passed' }).Count -ne 0 -or
              @($r.tests | Where-Object { $_.classification -eq 'PASS_RECOVERY_LAB_ONLY' }).Count -ne 0 -or
              @($r.tests | Where-Object { $_.classification -eq 'PASS_CONTAINMENT' }).Count -ne 26 -or
              @($r.tests | Where-Object {
                $_.test -in @('prepare-only','prepare-before-verify','prepare-after-verify','before-old-observation') -and
                $_.no_functional_observation_on_audited_route -and
                $_.no_launch_claim_scope -eq 'AUDITED_COORDINATOR_AND_PYTHON_API_GUARD_ONLY' -and
                !$_.global_no_launch_proven -and !$_.independent_recovery_authority -and
                $_.outcome -eq 'UnknownBlocked' -and $_.replay -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_NO_INDEPENDENT_NO_LAUNCH_AUTHORITY' }).Count -ne 4 -or
              @($r.tests | Where-Object {
                $_.test -eq 'prepare-only' -and $_.preparation_completed_without_observation -and
                $_.data_only_verification_completed -and !$_.interrupted_owner }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -in @('prepare-before-verify','prepare-after-verify') -and
                $_.preparation_interrupted -and $_.interrupted_owner }).Count -ne 2 -or
              @($r.tests | Where-Object {
                $_.test -eq 'prepare-after-verify' -and $_.data_only_verification_completed }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -eq 'before-old-observation' -and $_.local_old_may_launch_boundary_observed -and
                !$_.data_only_verification_completed }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -eq 'provider-late-spawn-after-reconcile' -and
                $_.classification -eq 'PASS_CONTAINMENT' -and
                $_.provider_client_exited_before_worker_spawn -and
                $_.provider_worker_spawned_after_reconcile -and
                $_.outcome -eq 'UnknownBlocked' -and
                $_.replay -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_NEW_EFFECTS_NOT_INDEPENDENTLY_BOUNDED' -and
                !$_.unsafe_recovery_after_real_new }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -eq 'out-of-band-new-with-old-selected' -and
                $_.classification -eq 'PASS_CONTAINMENT' -and
                $_.out_of_band_new_execution_observed -and
                $_.out_of_band_no_launch_claim_rejected -and
                $_.outcome -eq 'UnknownBlocked' -and
                $_.replay -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_NO_INDEPENDENT_NO_LAUNCH_AUTHORITY' -and
                !$_.unsafe_recovery_after_real_new }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.unsafe_recovery_after_real_new -or
                $_.outcome -in @('OldRecoveredNoReady','OldReobservedNoReady') }).Count -ne 0 -or
              @($r.tests | Where-Object {
                $_.test -eq 'same-user-full-state-rollback-after-new' -and
                $_.classification -eq 'PASS_CONTAINMENT' -and
                $_.full_state_rollback_blocked -and
                !$_.unsafe_recovery_after_real_new -and
                $_.outcome -eq 'UnknownBlocked' -and
                $_.replay -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_NO_INDEPENDENT_NO_LAUNCH_AUTHORITY' }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -in @('intent','recover-before-replace','recover-after-replace') -and
                $_.outcome -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_NO_INDEPENDENT_NO_LAUNCH_AUTHORITY' }).Count -ne 3 -or
              @($r.tests | Where-Object {
                $_.test -eq 'selector-locked' -and $_.outcome -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_UNREADABLE_HISTORY_BLOCKED' }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -eq 'selected' -and $_.outcome -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_NEW_SELECTED_NO_INDEPENDENT_NO_LAUNCH_PROOF' }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -eq 'fence-directory-before-new' -and $_.wrong_type_marker_fail_closed -and
                $_.outcome -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_NEW_FENCE_NOT_REGULAR_FILE' }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -eq 'joint-fence-journal-erasure' -and
                $_.joint_fence_journal_erasure_blocked -and
                $_.outcome -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_NEW_SELECTED_NO_INDEPENDENT_NO_LAUNCH_PROOF' }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -eq 'launch-fence-lost-after-new' -and
                $_.missing_launch_fence_with_new_journal_observed -and
                $_.outcome -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_LAUNCHED_NEW_JOURNAL_FENCE_MISSING' }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -eq 'external-broker-handoff' -and $_.external_handoff_effect_observed -and
                $_.outcome -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_NEW_EFFECTS_NOT_INDEPENDENTLY_BOUNDED' }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -eq 'external-broker' -and $_.external_broker_effect_observed -and
                $_.outcome -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_NEW_EFFECTS_NOT_INDEPENDENTLY_BOUNDED' }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -eq 'witness-recreated' -and $_.outcome -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_OWNER_WITNESS_NOT_INHERITED' }).Count -ne 1 -or
              @($r.tests | Where-Object {
                $_.test -eq 'witness-wrong-object' -and $_.outcome -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_OWNER_WITNESS_OBJECT_MISMATCH' }).Count -ne 1 -or
              @($r.tests | Where-Object { $_.test -eq 'normal' -and
                $_.normal_owner_completed_without_crash -and
                $_.outcome -eq 'UnknownBlocked' -and
                $_.block_reason -eq 'REAL_NEW_EFFECTS_NOT_INDEPENDENTLY_BOUNDED' }).Count -ne 1 -or
              @($r.tests | Where-Object { !$_.old_and_canary_preserved -or !$_.reconciler_new_process -or
                                         !$_.manifest_and_object_identities_rechecked -or $_.operational_ready }).Count -ne 0 -or
              $r.operational_ready -or $r.phase1_complete -or $r.operational_gates_closed -ne 0 -or
              $r.real_power_loss_tested -or $r.supervisor_loss_recovery_proven -or
              $r.new_effects_quiescence_proven -or $r.production_tuf_authority) {
            throw 'GF_PHASE1_CRASH_FALSE_READY_OR_INCOMPLETE_EVIDENCE'
          }
          @(
            '## Fase 1 - interrupcao real de processos, sem READY'
            '* 26 PASS_CONTAINMENT (22 anteriores + 4 de preparacao/fronteira OLD); 0 recuperacoes'
            '* PREPARE_DATA_ONLY termina antes de OLD/NEW; cortes antes/depois da verificacao permanecem UnknownBlocked'
            '* Fence OLD persistido antes da primeira observacao; guard Python de API e regressao, NAO sandbox ou autoridade global'
            '* MSI-ASYNC-ANALOGUE INERT: provider client terminated; simulated external broker creates late writer ONLY AFTER L18 returned UnknownBlocked'
            '* This test does not execute MSI, msiexec, services, updates, uninstallers or maintenance; it cannot prove real Windows Installer behavior'
            '* NOVO teste de escopo: GF NEW real executa FORA do coordenador e Jobs C#, seletor permanece OLD/1 sem fence; reconciliacao UNKNOWN/BLOCKED'
            '* Isso refuta uma garantia global de no-launch, sem autorizar relancamento de OLD ou uma politica de execucao na maquina'
            '* Contraexemplo historico REPRODUZIDO no run 41071494214: NEW real executou, state rollback OLD/1, reconciliacao OldRecoveredNoReady antes de assert legado'
            '* Nesta rodada o mesmo rollback e agora UnknownBlocked por REAL_NO_INDEPENDENT_NO_LAUNCH_AUTHORITY'
            '* Cenários historicos recover-before/after agora validam recusa; NAO executam corte de recuperacao'
            '* Autoridade duravel de no-launch ainda ausente: nenhum READY, recuperacao fria ou power-loss provado'
            '* Erro File.Exists em entrada-diretorio nao e aceito como ausencia autentica'
            '* Fence e tail do journal removidos juntos: UNKNOWN/BLOCKED, sem inferir pre-lancamento'
            '* Jornal L18 com launch observado bloqueia restauracao mesmo sem fence fisico'
            '* Ausencia de broker intermediario nao demonstra ausencia de efeitos de um processo delegado'
            '* Broker externo e proxy LAB do supervisor; nao demonstra que GF/WMI criou broker real'
            '* Efeito tardio em fixture inerte ocorre mesmo com ambos Jobs vazios e recibo falso'
            '* O caminho normal e a recuperacao usam os mesmos contexto, pins, Job, seletor e fences'
            '* Reconciliacao idempotente em processos C# novos, diario L18 e seletor unico'
            '* Descendente tardio sobrevive ao coordenador; escritas em OLD/canario recusadas por handles NTFS'
            '* Grupo de processos vazio nao prova ausencia de efeitos: fence NEW permanece bloqueante'
            '* Crash do coordenador/reconciliador nao equivale a reboot nem queda de energia'
            '* Testemunha supervisora perdida, journal truncado e seletor contraditorio: UNKNOWN/BLOCKED'
            '* Fase 1 aberta; READY recusado; G1-G8 BLOCKED (0/8)'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
# No downloadable GF builds, secrets, releases, production updater or READY claim.
