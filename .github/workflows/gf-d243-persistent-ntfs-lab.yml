name: GF D2.4.3 - TUF persistente e contenção NTFS inerte
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/github-d24-integrated/**'
      - 'prototipos/autoatualizador-seguro/github-d23-dotnet-loopback/HttpClientLoopback.cs.txt'
      - 'prototipos/autoatualizador-seguro/github-trust-lab/**'
      - 'prototipos/autoatualizador-seguro/github-auth-lab/**'
      - 'prototipos/autoatualizador-seguro/github-d2-inert/d2_inert_lab.py'
      - 'prototipos/autoatualizador-seguro/fixtures/bootstrap.test-only.json'
      - '.github/workflows/gf-d243-persistent-ntfs-lab.yml'
permissions:
  contents: read
concurrency:
  group: gf-d243-persistent-ntfs
  cancel-in-progress: false
jobs:
  d243-windows:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout de laboratório sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET 10 fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python 3.13 fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependências TUF do laboratório já utilizadas
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'D243_TUF_DEPENDENCY_FAILURE' }
      - name: Verificar isolamento do projeto GF distribuído
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($p.Items.Compile | Where-Object {$_.Identity -match 'prototipos[/\\]autoatualizador-seguro'}).Count -ne 0) { throw 'D243_PRODUCT_SOURCE_LEAK' }
      - name: Compilar D0 e C# D2.4 somente no runner descartável
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $d0=Join-Path $env:RUNNER_TEMP 'gf-d24-d0'
          $d24=Join-Path $env:RUNNER_TEMP 'gf-d24-bridge'
          dotnet build prototipos/autoatualizador-seguro/github-trust-lab/GF.D11.D0Probe.csproj -c Release -r win-x64 --self-contained false -o $d0 --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $d0 'GF.D11.D0Probe.exe'))) { throw 'D243_D0_BUILD' }
          dotnet build prototipos/autoatualizador-seguro/github-d24-integrated/GF.D24.InertChainLab.csproj -c Release -r win-x64 --self-contained false -o $d24 --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $d24 'GF.D24.InertChainLab.exe'))) { throw 'D243_CSHARP_BUILD' }
      - name: Provas de histórico TUF e NTFS; nenhuma recuperação autorizada
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $d0=Join-Path $env:RUNNER_TEMP 'gf-d24-d0\GF.D11.D0Probe.exe'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-d24-bridge\GF.D24.InertChainLab.exe'
          $script='prototipos/autoatualizador-seguro/github-d24-integrated/d243_persistent_lab.py'
          $out=Join-Path $env:RUNNER_TEMP 'd243-stdout.txt'
          $err=Join-Path $env:RUNNER_TEMP 'd243-stderr.txt'
          python $script $d0 $exe 1> $out 2> $err
          $exitCode=$LASTEXITCODE
          Get-Content $out | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            Get-Content $err | ForEach-Object { Write-Host $_ }
            throw 'D243_SUITE_FAILED'
          }
          $line=(Get-Content $out | Where-Object { $_.StartsWith('GF_D243_RESULT ') } | Select-Object -Last 1)
          if (!$line) { throw 'D243_RESULT_MISSING' }
          $r=$line.Substring('GF_D243_RESULT '.Length) | ConvertFrom-Json
          if ($r.schema -ne 'gf-d243-persistent-ntfs-lab/1' -or
              $r.status -ne 'passed' -or
              $r.csharp_controlled_test_tuf_generations -ne 2 -or
              $r.observed_trust_role_generations.Count -ne 2 -or
              $r.observed_trust_role_generations[0] -ne 1 -or
              $r.observed_trust_role_generations[1] -ne 2 -or
              !$r.independent_windows_coordinator_processes -or
              !$r.intact_history_replay_blocked -or
              !$r.cooperative_concurrency_denied -or
              !$r.partial_history_held_without_cleanup -or
              !$r.full_history_rewind_reaccepted_old_version -or
              !$r.full_history_rewind_is_security_counterexample -or
              $r.ntfs_observation_cases -ne 6 -or
              !$r.reparse_junction_hardlink_and_race_tested -or
              !$r.external_sentinel_preserved -or
              $r.same_user_rollback_resistance_proven -or
              $r.same_user_ntfs_toctou_resistance_proven -or
              $r.crash_durability_proven -or $r.production_signing_authority -or
              $r.operational_ready -or $r.automatic_recovery_authorized -or
              $r.real_external_network_requests -ne 0 -or
              $r.real_executable_downloads -ne 0 -or
              $r.installations -ne 0 -or $r.product_modified -or
              $r.staging_or_recovery_performed) {
            throw 'D243_UNSUPPORTED_SECURITY_CLAIM'
          }
          Write-Host $line
# Never run a GF updater, download executables or modify installed programs.
