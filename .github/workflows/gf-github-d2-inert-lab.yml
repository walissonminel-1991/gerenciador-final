name: GF D2 - aquisicao e preparo somente de bytes inertes (laboratorio)
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/github-d2-inert/**'
      - '.github/workflows/gf-github-d2-inert-lab.yml'
permissions:
  contents: read
concurrency:
  group: gf-d2-inert-lab
  cancel-in-progress: false
jobs:
  d2-inert-validation:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout sem credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET 10 fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python fixado
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependencias TUF fixadas
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'D2_DEPENDENCIES_FAILED' }
      - name: Verificar isolamento GF e compilar somente parser D0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($p.Items.Compile | Where-Object {$_.Identity -match 'prototipos[/\\]autoatualizador-seguro'}).Count -ne 0) {
            throw 'D2_PRODUCT_SOURCE_LEAK'
          }
          $dest=Join-Path $env:RUNNER_TEMP 'gf-d2-d0'
          dotnet build prototipos/autoatualizador-seguro/github-trust-lab/GF.D11.D0Probe.csproj -c Release -r win-x64 --self-contained false -o $dest --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $dest 'GF.D11.D0Probe.exe'))) { throw 'D2_D0_BUILD_FAILED' }
      - name: Verificar aquisicao de bytes inertes e recusas
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-d2-d0\GF.D11.D0Probe.exe'
          $script='prototipos/autoatualizador-seguro/github-d2-inert/d2_inert_lab.py'
          $line=(python $script $exe | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$line -or !$line.StartsWith('GF_D2_RESULT ')) {
            throw 'D2_SUITE_NOT_COMPLETED'
          }
          $r=$line.Substring('GF_D2_RESULT '.Length) | ConvertFrom-Json
          if ($r.schema -ne 'gf-github-d2-inert-acquisition/1' -or
              $r.status -ne 'passed' -or
              $r.positive_inert_acquisitions -ne 2 -or
              $r.adversarial_rejected -ne 21 -or
              !$r.persistent_tuf_lab_used -or
              !$r.d0_real_csharp_parser_used -or
              !$r.manifest_authenticated_with_public_test_key -or
              !$r.memory_only_source -or
              !$r.readback_sha_verified -or
              !$r.outside_stage_sentinel_preserved -or
              $r.same_user_toctou_resistance_proven -or
              $r.production_signing_authority -or
              $r.full_history_rollback_resistance_proven -or
              $r.real_network_requests -ne 0 -or
              $r.executable_downloads -ne 0 -or
              $r.executable_launches -ne 0 -or
              $r.installations -ne 0 -or $r.product_modified -or
              $r.operational_ready -or $r.automatic_recovery_authorized) {
            throw 'D2_FALSE_OPERATIONAL_CLAIM'
          }
          Write-Host $line
# No download of program, real network, installer, merge, deploy or recovery.
