name: M3 L17 — tres contraexemplos adversariais Windows (inerte)
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/m3-l17-adversarial/**'
      - 'prototipos/autoatualizador-seguro/m3-l16-signed-stage/L16Boundary.cs.txt'
      - 'prototipos/autoatualizador-seguro/m3-l16-signed-stage/L16Tests.cs.txt'
      - '.github/workflows/autoatualizador-m3-l17-adversarial-inerte.yml'
permissions:
  contents: read
concurrency:
  group: gf-m3-l17-${{ github.ref }}
  cancel-in-progress: false
jobs:
  three-adversarial-counterexamples:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .NET SDK fixado
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python de fixtures
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: TUF assinado SOMENTE de laboratorio
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar e provar tres cenarios adversariais
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          $project='prototipos/autoatualizador-seguro/m3-l17-adversarial/L17Adversarial.csproj'
          $anchor='prototipos/autoatualizador-seguro/fixtures/bootstrap.test-only.json'
          $work=Join-Path $env:RUNNER_TEMP 'gf-m3-l17-source'
          $fixtures=Join-Path $env:RUNNER_TEMP 'gf-m3-l17-fixtures'
          $out=Join-Path $env:RUNNER_TEMP 'gf-m3-l17-artifacts'
          $report=Join-Path $env:RUNNER_TEMP 'gf-m3-l17-report.json'
          if ((dotnet --version).Trim() -ne '10.0.402') { throw 'L17_SDK_MISMATCH' }
          $source=(python prototipos/autoatualizador-seguro/m3-composed/prepare_pinned_source.py $work | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $source)) { throw 'L17_PINNED_SOURCE_UNAVAILABLE' }
          python prototipos/autoatualizador-seguro/m3-composed-3/generate_signed_fixtures.py $fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore $project "-p:ArtifactsPath=$out" "-p:Stage8Source=$source" --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project "-p:ArtifactsPath=$out" "-p:Stage8Source=$source" -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exes=@(Get-ChildItem $out -Filter 'GF.Updater.M3.L17Tests.exe' -Recurse -File)
          if ($exes.Count -ne 1) { throw 'L17_RUNNER_NOT_UNIQUE' }
          & $exes[0].FullName --report $report $fixtures $anchor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r=Get-Content $report -Raw | ConvertFrom-Json
          if ($r.passed -ne 3 -or $r.failed -ne 0 -or
              !$r.selector_read_pinned_against_same_user -or
              !$r.scratch_identity_swap_detected_and_unknown_persisted -or
              !$r.forged_terminal_not_independent_commit_authority -or
              !$r.busy_while_owner_holds_lease -or
              !$r.timeout_unknown_persisted_after_owner_exit -or
              !$r.late_owner_completes_after_wait_timeout -or
              !$r.original_version_and_markers_preserved -or
              $r.arbitrary_toctou_excluded -or
              $r.same_user_tamperproof_storage -or
              $r.independent_freshness_or_witness_present -or
              $r.operational_install_or_ready -or $r.power_loss_proven -or
              $r.operational_gates_closed -ne 0) {
            throw 'L17_FALSE_SECURITY_CLAIM'
          }
          $compile=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          $leaks=@($compile.Items.Compile | Where-Object { $_.Identity -match 'prototipos[/\\]autoatualizador-seguro[/\\]m3-l17-adversarial' })
          if ($leaks.Count -ne 0) { throw 'L17_PRODUCT_COMPILE_LEAK' }
          "L17: 3 adversarial child process fixtures PASS, independent authority still absent, G1-G8 BLOCKED." >> $env:GITHUB_STEP_SUMMARY
# No GF integration, release, deploy, WORK, real credentials, helper or CI on personal PCs.
