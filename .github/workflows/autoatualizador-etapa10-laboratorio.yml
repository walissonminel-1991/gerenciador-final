name: Autoatualizador Etapa 10 — pacote GF em laboratório
on:
  push:
    branches: [work-autoatualizador-etapa10-validacao-20261029]
    paths:
      - prototipos/autoatualizador-seguro/stage10/**
      - .github/workflows/autoatualizador-etapa10-laboratorio.yml
permissions:
  contents: read
concurrency:
  group: gf-updater-stage10-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: GF portátil real — inspeção estática e adaptadores isolados
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GF_U10_PHASE: ${{ contains(github.event.head_commit.message, '[gf-u10-windows]') && 'windows' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Signer preexistente de fixtures; nunca assina pacote GF
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Qualificar bytes reais sem executar GF ou enviar binários
        shell: pwsh
        run: |
          python prototipos/autoatualizador-seguro/stage10/run_lab.py --report "$env:RUNNER_TEMP/gf-u10.json" --phase $env:GF_U10_PHASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content "$env:RUNNER_TEMP/gf-u10.json" -Raw | ConvertFrom-Json
          "Etapa 10: $($r.status). $($r.windows.passed)/$($r.windows.total) ensaios Windows. Pacote apagado: $($r.lab_tree_deleted). Zero gate operacional fechado." >> $env:GITHUB_STEP_SUMMARY
# No upload-artifact, secrets, product launch, Release, private delivery, deploy or retries.
