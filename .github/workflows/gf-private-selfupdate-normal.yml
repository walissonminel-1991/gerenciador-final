name: GF private self-update - normal-build token-free query
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'Program.cs'
      - 'GerenciadorAplicativos.csproj'
      - 'prototipos/autoatualizador-seguro/phase1-composed/GfPrivateSelfUpdateProbe.cs.txt'
      - 'prototipos/autoatualizador-seguro/phase1-composed/GfPrivateFunctionalUpdate.cs.txt'
      - 'prototipos/autoatualizador-seguro/phase1-composed/GfGithubWeeklyUpdate.cs.txt'
      - 'prototipos/autoatualizador-seguro/phase1-composed/private_functional_feed.py'
      - '.github/workflows/gf-private-selfupdate-normal.yml'
permissions:
  contents: read
jobs:
  normal-private-query:
    if: github.repository == 'walissonminel-1991/gerenciador-final'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Guardar isolamento da compilacao publica e excluir E2E da privada
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $public=(dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json).Items.Compile
          if (@($public | Where-Object { $_.Identity -match 'GfPrivateSelfUpdateProbe|GfOldDraftAcquire' }).Count -ne 0) { throw 'PRIVATE_SOURCE_IN_PUBLIC_PRODUCT' }
          $private=(dotnet msbuild GerenciadorAplicativos.csproj -p:GfSelfUpdatePrivate=true -getItem:Compile | ConvertFrom-Json).Items.Compile
          if (@($private | Where-Object { $_.Identity -match 'GfPrivateSelfUpdateProbe' }).Count -ne 1) { throw 'NORMAL_PRIVATE_CLIENT_NOT_INCLUDED' }
          if (@($private | Where-Object { $_.Identity -match 'GfOldDraftAcquire' }).Count -ne 0) { throw 'E2E_CODE_IN_PRIVATE_CLIENT' }
          Write-Host 'GF_PRIVATE_UPDATE_NORMAL_SOURCE_PASS no_e2e=true normal_private=true public_unchanged=true'
      - name: Compilar GF normal privado com acao de consulta real
        shell: pwsh
        run: |
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:GfBetaProfile=local -p:GfSelfUpdatePrivate=true -p:GfE2eLab=false -p:Version=5.13.11.65 -o "$env:RUNNER_TEMP/gf-normal-private" --nologo
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_NORMAL_BUILD_FAILED' }
          Write-Host 'GF_PRIVATE_UPDATE_NORMAL_BUILD_PASS'
      - name: Consultar endpoint publico sem token nem ambiente E2E, nunca instalar
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $privateExe=Join-Path $env:RUNNER_TEMP 'gf-normal-private/GerenciadorFinal.exe'
          if (!(Test-Path -LiteralPath $privateExe)) { throw 'PRIVATE_BINARY_ABSENT' }
          $env:GH_TOKEN=''
          $env:GITHUB_ACTIONS='false'
          $env:GITHUB_REPOSITORY=''
          $env:RUNNER_TEMP=''
          $smoke=Start-Process -FilePath $privateExe -ArgumentList '--gf-private-update-smoke' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "PRIVATE_NORMAL_PROBE_FAILED_CODE_$($smoke.ExitCode)" }
          Write-Host 'GF_PRIVATE_UPDATE_TOKEN_FREE_READONLY_PASS READY=false no_download=true no_install=true'
      - name: Weekly GitHub release check persists and suppresses repeat inside seven days
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-normal-private/GerenciadorFinal.exe'
          $env:GH_TOKEN=''
          $env:GITHUB_ACTIONS='false'
          $env:GITHUB_REPOSITORY=''
          $env:GF_PRIVATE_FUNCTIONAL_LAB=''
          $state=Join-Path $env:LOCALAPPDATA 'GerenciadorFinal/autoatualizacao/ultima-consulta.json'
          if (Test-Path $state) { throw 'WEEKLY_SMOKE_NOT_FRESH' }
          $check=Start-Process -FilePath $exe -ArgumentList '--gf-private-weekly-smoke' -PassThru -Wait
          if ($check.ExitCode -ne 0) { throw "GF_WEEKLY_SMOKE_FAILED_$($check.ExitCode)" }
          if (!(Test-Path $state)) { throw 'GF_WEEKLY_PERSISTENCE_MISSING' }
          $saved=Get-Content -LiteralPath $state -Raw | ConvertFrom-Json
          if ($saved.schema -ne 'gf-weekly-update/1' -or !$saved.last_attempt_utc) { throw 'GF_WEEKLY_PERSISTENCE_INVALID' }
          Write-Host 'GF_GITHUB_WEEKLY_PASS official_releases_only=true interval=7days persisted=true token_free=true private_only=true READY=false'

  functional-old-to-new:
    name: Functional-first GF .65 to .66 on disposable Windows
    if: github.repository == 'walissonminel-1991/gerenciador-final'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GF_BETA_ENDPOINT: ''
      GF_PRIVATE_FUNCTIONAL_LAB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Compile REAL GF OLD and NEW in private normal mode, never E2E
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $old=Join-Path $env:RUNNER_TEMP 'gf-private-e2e-old'
          $new=Join-Path $env:RUNNER_TEMP 'gf-private-e2e-payload'
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:GfBetaProfile=local -p:GfSelfUpdatePrivate=true -p:GfE2eLab=false -p:Version=5.13.11.65 -o $old --nologo
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_FUNCTIONAL_BUILD_OLD_FAILED' }
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:GfBetaProfile=local -p:GfSelfUpdatePrivate=true -p:GfE2eLab=false -p:Version=5.13.11.66 -o $new --nologo
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_FUNCTIONAL_BUILD_NEW_FAILED' }
          $oldV=[Reflection.AssemblyName]::GetAssemblyName((Join-Path $old 'GerenciadorFinal.dll')).Version.ToString()
          $newV=[Reflection.AssemblyName]::GetAssemblyName((Join-Path $new 'GerenciadorFinal.dll')).Version.ToString()
          if ($oldV -ne '5.13.11.65' -or $newV -ne '5.13.11.66') { throw 'PRIVATE_FUNCTIONAL_VERSION_BUILD_WRONG' }
          Write-Host 'GF_PRIVATE_FUNCTIONAL_BUILDS_PASS old=5.13.11.65 new=5.13.11.66 normal_build=true no_e2e=true'
      - name: Generate .66 ZIP, serve private localhost feed, run OLD and verify installed NEW
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:RUNNER_TEMP
          $old=Join-Path $root 'gf-private-e2e-old'
          $new=Join-Path $root 'gf-private-e2e-payload'
          $zip=Join-Path $root 'gf-private-e2e-new.zip'
          $ready=Join-Path $root 'gf-private-e2e-port.txt'
          $done=Join-Path $root 'gf-private-e2e-applied.json'
          $py=@'
          import sys,zipfile
          from pathlib import Path
          src=Path(sys.argv[1]).resolve(strict=True)
          target=Path(sys.argv[2])
          assert not target.exists()
          with zipfile.ZipFile(target,'x',compression=zipfile.ZIP_DEFLATED,compresslevel=1) as archive:
              for item in sorted(src.rglob('*')):
                  if item.is_file():
                      archive.write(item,item.relative_to(src).as_posix())
          print("GF_PRIVATE_FUNCTIONAL_ZIP_CREATED",flush=True)
          '@
          $py | python - $new $zip
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_FUNCTIONAL_ZIP_FAILED' }
          $serverScript=Join-Path $env:GITHUB_WORKSPACE 'prototipos/autoatualizador-seguro/phase1-composed/private_functional_feed.py'
          $pythonExe=(Get-Command python).Source
          $server=Start-Process -FilePath $pythonExe -ArgumentList @('-u',('"' + $serverScript + '"'),('"' + $root + '"')) -PassThru -WindowStyle Hidden
          $until=[DateTime]::UtcNow.AddSeconds(25)
          while (!(Test-Path -LiteralPath $ready) -and [DateTime]::UtcNow -lt $until) {
            if ($server.HasExited) { throw 'PRIVATE_FUNCTIONAL_FEED_DIED' }
            Start-Sleep -Milliseconds 150
          }
          if (!(Test-Path -LiteralPath $ready)) { throw 'PRIVATE_FUNCTIONAL_FEED_NOT_READY' }
          $port=[int]([System.IO.File]::ReadAllText($ready))
          if ($port -lt 1024 -or $port -gt 65535) { throw 'PRIVATE_FUNCTIONAL_FEED_PORT_INVALID' }
          $env:GF_PRIVATE_FUNCTIONAL_FEED="http://127.0.0.1:$port/feed.json"
          $exe=Join-Path $old 'GerenciadorFinal.exe'
          $parent=Start-Process -FilePath $exe -WorkingDirectory $old -PassThru
          $click=@'
          import ctypes,os,sys,time
          from pathlib import Path
          repo=Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          sys.path.insert(0,str(repo/"prototipos"/"autoatualizador-seguro"/"phase1-composed"))
          from win32_process_observation import own_main_windows,message_pump_ping
          pid=int(sys.argv[1])
          u=ctypes.WinDLL("user32",use_last_error=True)
          CB=ctypes.WINFUNCTYPE(ctypes.c_int,ctypes.c_void_p,ctypes.c_ssize_t)
          enum=u.EnumChildWindows
          enum.argtypes=[ctypes.c_void_p,CB,ctypes.c_ssize_t]
          enum.restype=ctypes.c_int
          get=u.GetWindowTextW
          get.argtypes=[ctypes.c_void_p,ctypes.c_void_p,ctypes.c_int]
          get.restype=ctypes.c_int
          send=u.SendMessageTimeoutW
          send.argtypes=[ctypes.c_void_p,ctypes.c_uint,ctypes.c_size_t,
                         ctypes.c_ssize_t,ctypes.c_uint,ctypes.c_uint,
                         ctypes.POINTER(ctypes.c_size_t)]
          send.restype=ctypes.c_ssize_t
          until=time.monotonic()+45
          buttons=[]
          while time.monotonic()<until:
              windows=[w for w in own_main_windows(pid)
                       if w["visible"] and message_pump_ping(w["hwnd"])]
              if len(windows)!=1:
                  time.sleep(.25)
                  continue
              buttons.clear()
              @CB
              def visit(hwnd,_):
                  text=ctypes.create_unicode_buffer(128)
                  get(hwnd,text,len(text))
                  if text.value=="Verificar GF":
                      buttons.append(hwnd)
                  return 1
              enum(windows[0]["hwnd"],visit,0)
              if len(buttons)==1:
                  break
              time.sleep(.25)
          assert len(buttons)==1,"NORMAL_OLD_SELF_UPDATE_BUTTON_NOT_FOUND"
          result=ctypes.c_size_t()
          assert send(buttons[0],0x00F5,0,0,0x0002,2500,
                      ctypes.byref(result)), "NORMAL_OLD_SELF_UPDATE_CLICK_FAILED"
          print("GF_PRIVATE_FUNCTIONAL_OLD_GUI_CLICK_PASS visible_normal_old=true button=Verificar_GF READY=false",flush=True)
          '@
          $click | python - $parent.Id
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_FUNCTIONAL_OLD_UI_CLICK_UNPROVEN' }
          # Wait only for the ORIGINAL OLD. A proper NEW GUI must remain alive.
          if (!$parent.WaitForExit(120000)) { throw 'PRIVATE_FUNCTIONAL_OLD_TIMEOUT' }
          if ($parent.ExitCode -ne 0) { throw "PRIVATE_FUNCTIONAL_OLD_FAILED_$($parent.ExitCode)" }
          $until=[DateTime]::UtcNow.AddSeconds(100)
          while (!(Test-Path -LiteralPath $done) -and [DateTime]::UtcNow -lt $until) {
            Start-Sleep -Milliseconds 250
          }
          if (!(Test-Path -LiteralPath $done)) { throw 'PRIVATE_FUNCTIONAL_WORKER_NO_COMPLETION' }
          $info=Get-Content -LiteralPath $done -Raw | ConvertFrom-Json
          if ($info.schema -ne 'gf-private-functional-transition/1' -or $info.ready -or !$info.test_only -or
              $info.old_version -ne '5.13.11.65' -or $info.new_version -ne '5.13.11.66' -or
              !$info.installed_at_original_path) { throw 'PRIVATE_FUNCTIONAL_WORKER_REPORT_INVALID' }
          $current=[Reflection.AssemblyName]::GetAssemblyName((Join-Path $old 'GerenciadorFinal.dll')).Version.ToString()
          $preserved=[Reflection.AssemblyName]::GetAssemblyName((Join-Path $root 'gf-private-e2e-old-preserved/GerenciadorFinal.dll')).Version.ToString()
          if ($current -ne '5.13.11.66' -or $preserved -ne '5.13.11.65') { throw 'PRIVATE_FUNCTIONAL_INSTALLED_VERSION_WRONG' }
          $health=@'
          import json,os,sys,time
          from pathlib import Path
          src=Path(sys.argv[1]).resolve(strict=True)
          repo=Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          sys.path.insert(0,str(repo/"prototipos"/"autoatualizador-seguro"/"phase1-composed"))
          from win32_process_observation import own_main_windows,process_image_path,message_pump_ping
          marker=json.loads((src/"gf-private-e2e-applied.json").read_text(encoding="utf-8"))
          pid=marker["started_pid"]
          expected=src/"gf-private-e2e-old"/"GerenciadorFinal.exe"
          deadline=time.monotonic()+45
          ok=False
          while time.monotonic()<deadline:
              w=own_main_windows(pid)
              image=process_image_path(pid)
              if (image and os.path.samefile(image,expected)
                      and any(x["visible"] and message_pump_ping(x["hwnd"]) for x in w)):
                  ok=True
                  break
              time.sleep(.2)
          assert ok,"NEW_UI_NOT_FUNCTIONAL"
          print("GF_PRIVATE_FUNCTIONAL_E2E_PASS old=5.13.11.65 new=5.13.11.66 downloaded_zip=true old_exited=true new_installed_original_path=true new_real_gui_responsive=true local_lab_only=true READY=false",flush=True)
          '@
          $health | python - $root
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_FUNCTIONAL_NEW_HEALTH_FAILED' }

          # Validate the NEW GitHub-release coordinator with a local .66 asset.
          # This tests the real installed-folder swap without publishing a Release.
          $retained=Join-Path $root 'gf-private-e2e-old-preserved'
          $fixture=Start-Process -FilePath (Join-Path $retained 'GerenciadorFinal.exe') -WorkingDirectory $retained -ArgumentList '--gf-private-github-fixture' -PassThru
          if (!$fixture.WaitForExit(100000) -or $fixture.ExitCode -ne 0) { throw "PRIVATE_GITHUB_WORKER_FIXTURE_FAILED_$($fixture.ExitCode)" }
          $folder=Join-Path $root '.gf-private-e2e-old-preserved-gfupdate-5.13.11.66'
          $report=Join-Path $folder 'applied.json'
          $until=[DateTime]::UtcNow.AddSeconds(60)
          while (!(Test-Path -LiteralPath $report) -and [DateTime]::UtcNow -lt $until) { Start-Sleep -Milliseconds 250 }
          if (!(Test-Path -LiteralPath $report)) {
            $phase='MISSING'
            $phaseFile=Join-Path $folder 'phase.txt'
            if (Test-Path -LiteralPath $phaseFile) { $phase=Get-Content -LiteralPath $phaseFile -Raw }
            $errorType='NONE'
            $errorFile=Join-Path $folder 'worker-error-category.txt'
            if (Test-Path -LiteralPath $errorFile) { $errorType=Get-Content -LiteralPath $errorFile -Raw }
            $oldExists=Test-Path -LiteralPath $retained
            $stageExists=Test-Path -LiteralPath (Join-Path $folder 'stage')
            $backupExists=Test-Path -LiteralPath (Join-Path $folder 'old-preserved')
            Write-Host "GF_GITHUB_WORKER_DIAGNOSTIC phase=$phase failure_category=$errorType original_present=$oldExists staged_present=$stageExists backup_present=$backupExists READY=false"
            throw 'PRIVATE_GITHUB_WORKER_NO_HEALTH_RECEIPT'
          }
          $json=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($json.schema -ne 'gf-private-github-update/1' -or $json.ready -or $json.installed_version -ne '5.13.11.66') { throw 'PRIVATE_GITHUB_WORKER_RECEIPT_INVALID' }
          $actual=[Reflection.AssemblyName]::GetAssemblyName((Join-Path $retained 'GerenciadorFinal.dll')).Version.ToString()
          $oldRetained=[Reflection.AssemblyName]::GetAssemblyName((Join-Path $folder 'old-preserved/GerenciadorFinal.dll')).Version.ToString()
          if ($actual -ne '5.13.11.66' -or $oldRetained -ne '5.13.11.65') { throw 'PRIVATE_GITHUB_WORKER_INSTALLED_VERSION_WRONG' }
          Write-Host 'GF_GITHUB_WORKER_FUNCTIONAL_PASS new=5.13.11.66 original_path=true backup_preserved=true mainform_verified=true fixture_only=true READY=false'
