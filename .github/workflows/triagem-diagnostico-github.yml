name: Triagem segura de diagnostico GitHub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressao:
    if: ${{ github.event_name != 'issues' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sem token persistente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Testar formatos, dados extras e falha fechada
        run: python3 -B -m unittest discover -s scripts -p 'test_triagem_diagnostico.py' -v

  triagem:
    if: ${{ github.event_name == 'issues' && startsWith(github.event.issue.title, '[GF Diagnostico] ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sem token persistente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar Issue como dado nao confiavel
        run: python3 -B scripts/triagem_diagnostico.py
