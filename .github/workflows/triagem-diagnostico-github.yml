name: Validar politica de diagnostico sem arquivos

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: politica-diagnostico-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  politica:
    name: Política de segurança e privacidade
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Codigo sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exigir ausencia de envio manual e codigo remoto nao confiavel
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_p*.py' -v
          python3 scripts/verificar_pacote.py . --metadata
      - name: Simular receptor HTTPS isolado (Node, sem rede externa)
        run: node --test prototipos/telemetria-worker/test.mjs prototipos/telemetria-worker/staging-receiver.test.mjs
      - name: Preparar Node fixo para SQLite local da BETA
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Retencao e receptor BETA antecipados (SQLite sintetico, sem rede)
        run: node --test prototipos/beta-telemetria/test.mjs prototipos/beta-telemetria/ingest.test.mjs prototipos/beta-telemetria/retention.test.mjs prototipos/beta-telemetria/round2.test.mjs
