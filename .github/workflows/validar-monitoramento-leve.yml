name: Validar monitoramento leve (Windows)

on:
  pull_request:
    branches:
      - teste-consolidacao-v5.13.10.19
      - correcao-residuos-driver-booster-v5.13.10.20
      - diagnostico-bandeja-msix-v5.13.10.21
      - monitoramento-leve-compatibilidade-v5.13.10.22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar aplicacao
        run: dotnet build GerenciadorAplicativos.csproj -c Release -p:RunAnalyzers=true
      - name: Testar monitor e layout sem servicos da aplicacao
        run: dotnet run --project TestesLayout/TestesLayout.csproj -c Release
      - name: Testar inventario MSIX e falhas tratadas
        run: dotnet run --project TestesMsix/TestesMsix.csproj -c Release
      - name: Testar politica de residuos sem remocao
        run: dotnet run --project TestesResiduos/TestesResiduos.csproj -c Release
