name: Gerenciador Final v5.12.21.1 Refinamento Visual Limpeza e Desempenho - Windows x64

on:
  push:
    branches:
      - teste-refinamento-limpeza-v5.12.21.1
    paths:
      - 'Program.cs'
      - 'GerenciadorAplicativos.csproj'
      - 'RuckZuckCatalog.cs'
      - 'OfficialReleaseSources.cs'
      - 'LocalMsixInventory.cs'
      - 'ProtectedApplications.cs'
      - 'TestesMsix/**'
      - 'TestesMultifontes/**'
      - 'TestesCatalogo/**'
      - 'RuckZuckModels.cs'
      - 'Matching.cs'
      - 'DarkControls.cs'
      - 'DarkConfirmDialog.cs'
      - 'Matching.cs'
      - 'RuckZuckModels.cs'
      - 'VerifiedUpdaters.cs'
      - 'WindowsTerminalUpdater.cs'
      - 'UpdateProcessCoordinator.cs'
      - 'InstallerLockScanner.cs'
      - 'UpdateBlockingPreflight.cs'
      - 'UninstallResiduals.cs'
      - 'AdvancedUninstallCleaner.cs'
      - 'UninstallRuleCatalog.cs'
      - 'CatalogoDesinstalacao.json'
      - 'CatalogoIdentidades.json'
      - 'ApplicationIdentityCatalog.cs'
      - 'TestesResiduos/**'
      - 'TestesFechamento/**'
      - 'TestesAtualizador/**'
      - 'IntegratedSystemUi.cs'
      - 'AdvancedFeatures.cs'
      - 'DiagnosticTrace.cs'
      - 'app.manifest'
      - 'TestesManifesto/**'
      - 'VerifiedUpdaters.cs'
      - 'TestesAtualizador/**'
      - '.github/workflows/compilar-gerenciador-v5.12.7.yml'
      - 'TestesMotor/**'
      - 'TestesRede/**'
      - '.github/workflows/compilar-gerenciador-v5.12.21.1.yml'




  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-e-publicar:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validar limites rigorosos da limpeza profunda avançada
        shell: pwsh
        run: |
          $ui = Get-Content Program.cs -Raw
          $deep = Get-Content AdvancedUninstallCleaner.cs -Raw
          if (-not $ui.Contains('Tool("Limpeza avançada"')) { throw 'Opção avançada não encontrada' }
          if (-not $ui.Contains('Limpeza avançada — confirmar exclusão')) { throw 'Confirmação separada ausente' }
          if (-not $ui.Contains('AdvancedUninstallCleaner.StillInstalled(item.App, fresh)')) { throw 'Deve revalidar instalação' }
          if (-not $deep.Contains('Registry.CurrentUser')) { throw 'Escopo HKCU ausente' }
          if ($deep.Contains('Registry.LocalMachine') -or $deep.Contains('Registry.ClassesRoot')) {
            throw 'Não é permitido apagar HKLM nem classes compartilhadas'
          }
          if (-not $deep.Contains('FileAttributes.ReparsePoint')) { throw 'Proteção de symlinks ausente' }
          if (-not $deep.Contains('OwnRegistryPath(key, allowlist)')) { throw 'Permitir somente chaves exatas' }
          if ($deep.Contains('Remove-Item') -or $deep.Contains('taskkill.exe')) { throw 'Operação deve ser nativa .NET' }

      - name: Validar catalogo embutido e corrigir botoes que estavam ocultos
        shell: pwsh
        run: |
          $source = Get-Content Program.cs -Raw
          $catalog = Get-Content UninstallRuleCatalog.cs -Raw
          $json = Get-Content CatalogoDesinstalacao.json -Raw | ConvertFrom-Json
          $proj = Get-Content GerenciadorAplicativos.csproj -Raw
          if ($json.rules.Count -lt 6) { throw 'Cobertura minima do catalogo nao atingida' }
          if (-not $proj.Contains('GerenciadorFinal.UninstallCatalog')) { throw 'Catalogo nao esta embutido' }
          if (-not $source.Contains('compact: true')) { throw 'Cartoes em quatro colunas ausentes' }
          if (-not $source.Contains('void AdjustCleaningCards()')) { throw 'Layout responsivo ausente' }
          if (-not $source.Contains('AdvancedUninstallCleaner.StillInstalled(item.App, fresh)')) {
            throw 'Nao pode apagar dados de programas reinstalados'
          }
          if ($catalog.Contains('WebClient') -or $catalog.Contains('HttpClient') -or $catalog.Contains('Process.Start')) {
            throw 'Banco de dados nao deve executar comandos ou baixar scripts'
          }

      - name: Cruzar os tres bancos de identidades sem permitir comandos ou delecoes
        shell: pwsh
        run: |
          $shared = Get-Content CatalogoIdentidades.json -Raw | ConvertFrom-Json
          $cleanup = Get-Content CatalogoDesinstalacao.json -Raw | ConvertFrom-Json
          $official = Get-Content OfficialReleaseSources.cs -Raw
          $program = Get-Content Program.cs -Raw
          $identity = Get-Content ApplicationIdentityCatalog.cs -Raw
          $residual = Get-Content UninstallResiduals.cs -Raw
          $catalog = Get-Content UninstallRuleCatalog.cs -Raw
          if ($shared.rules.Count -ne 18) { throw 'Catalogo nao possui 18 familias' }
          if (@($shared.rules | Where-Object officialSource).Count -ne 14) {
            throw 'Deve haver 14 identificadores de fonte oficial'
          }
          if (@($shared.rules | Where-Object cleanupPolicy).Count -ne 6) {
            throw 'As 6 politicas de limpeza precisam de identidade'
          }
          foreach ($rule in $shared.rules) {
            if ($rule.officialSource -and -not $official.Contains('new("' + $rule.officialSource + '"')) {
              throw "Fonte oficial desconhecida no catálogo: $($rule.id)"
            }
            if ($rule.cleanupPolicy -and @($cleanup.rules | Where-Object id -eq $rule.cleanupPolicy).Count -ne 1) {
              throw "Política de limpeza ausente: $($rule.id)"
            }
          }
          if (-not $program.Contains('CatalogIdentity = ApplicationIdentityCatalog.Resolve(')) {
            throw 'O inventario deve usar o banco central'
          }
          if (-not $program.Contains('entry.CatalogIdentity, entry.CatalogDisplayName')) {
            throw 'Pesquisa deve reconhecer identidade e nome oficial'
          }
          if (-not $official.Contains('ApplicationIdentityCatalog.MatchesOfficialSource(')) {
            throw 'Atualizacoes oficiais nao passaram pelo banco central'
          }
          if (-not $residual.Contains('ApplicationIdentityCatalog.IsStillInstalled(') -or
              -not $catalog.Contains('ApplicationIdentityCatalog.Resolve(')) {
            throw 'Desinstalacao/limpeza precisam reutilizar o ID comum'
          }
          if ($identity.Contains('Process.Start') -or $identity.Contains('HttpClient') -or
              $identity.Contains('File.Delete') -or $identity.Contains('Registry.CurrentUser')) {
            throw 'Banco de identidade nunca executa nem remove arquivos'
          }

      - name: Testar nomes, descricoes, cores e texto sem truncamento na limpeza
        shell: pwsh
        run: |
          $source = Get-Content Program.cs -Raw
          if (-not $source.Contains('AllowMultilineText ? TextFormatFlags.WordBreak')) {
            throw 'Modo de quebra em linhas ausente; titulos podem ficar cortados'
          }
          if (-not $source.Contains('Limpeza de Disco\nautomática')) {
            throw 'Titulo longo de Limpeza de Disco sem segunda linha'
          }
          if (-not $source.Contains('compact ? 146 : 116')) { throw 'Card não ganhou altura para descricao' }
          if (-not $source.Contains('compact ? 58 : 48')) { throw 'Botao nao comporta duas linhas' }
          if (-not $source.Contains('Math.Max(342, 22 + rows * 160)')) {
            throw 'Altura responsiva insuficiente para a nova grade'
          }
          $expected = @(
            @('Temporários do usuário', 'AppServices.Blue'),
            @('Temporários do Windows', 'AppServices.Orange'),
            @('Cache do Windows Update', 'AppServices.Red'),
            @('Esvaziar Lixeira', 'AppServices.Red'),
            @('Limpeza de Disco automática', 'AppServices.Blue'),
            @('Cache de shaders DirectX', 'AppServices.Gray'),
            @('Resíduos de aplicativos', 'AppServices.Gray'),
            @('Limpeza avançada', 'AppServices.Orange')
          )
          foreach ($pair in $expected) {
            $name = [regex]::Escape($pair[0])
            $color = [regex]::Escape($pair[1])
            if (-not [regex]::IsMatch($source, 'Tool\("' + $name + '"\s*,[\s\S]*?' + $color + '\s*,', 'Singleline')) {
              throw "Cor de impacto ausente/incorreta para $($pair[0])"
            }
          }
          $tools = [regex]::Matches($source, 'Tool\("(?<name>[^"]+)"\s*,\s*"(?<description>[^"]+)"\s*,\s*AppServices\.(Blue|Orange|Red|Gray)')
          foreach ($pair in $expected) {
            $item = @($tools | Where-Object { $_.Groups['name'].Value -eq $pair[0] })
            if ($item.Count -ne 1 -or $item[0].Groups['description'].Value.Length -lt 35) {
              throw "Descricao incompleta ou duplicada: $($pair[0])"
            }
          }
          if ($source.Contains('Tool("Limpeza profunda (avançado)"')) { throw 'Nome antigo ainda visivel' }
          if (-not $source.Contains('LIMPEZA_AVANCADA.CONSULTA_INICIO')) {
            throw 'Etapas do diagnostico nao receberam o novo nome'
          }
          if (-not $source.Contains('button.AccessibleName = tool.Name')) {
            throw 'Acessibilidade dos botões sem nome completo'
          }

      - name: Testes isolados de residuos com pastas temporarias
        shell: pwsh
        run: |
          dotnet run --project TestesResiduos/TestesResiduos.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirmar que nenhuma desinstalacao limpa sem consentimento
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $safe = Get-Content UninstallResiduals.cs -Raw
          if (-not $main.Contains('DESINSTALACAO.REGISTRO_AUSENTE')) { throw 'Falta confirmar remoção do Registro' }
          if (-not $main.Contains('DESINSTALACAO.RESIDUOS_CONSULTA_INICIO')) { throw 'Falta revisar resíduos apos desinstalar' }
          if (-not $main.Contains('DarkConfirmDialog.Confirm(this, question, "Limpar resíduos após desinstalação")')) {
            throw 'A limpeza exige confirmacao separada'
          }
          if (-not $main.Contains('ReviewOldUninstallResiduesAsync')) { throw 'Falta revisao de residuos antigos' }
          if (-not $safe.Contains('FileAttributes.ReparsePoint')) { throw 'Pastas e arquivos de reparse precisam ser excluídos' }
          if (-not $safe.Contains('SearchOption.TopDirectoryOnly')) { throw 'Proibida varredura recursiva destrutiva' }
          if ($safe.Contains('RegistryKey.Delete') -or $safe.Contains('Directory.Delete(candidate.Root, true)')) {
            throw 'Proibido apagar Registro e pastas recursivamente'
          }

      - name: Verificar rotinas de inicializacao e atualizacao segura
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $systemUi = Get-Content IntegratedSystemUi.cs -Raw
          $logic = Get-Content DarkControls.cs -Raw
          if (-not $main.Contains('BeginStartupChecks();')) { throw 'Inicializacao automatica ausente' }
          if (-not $main.Contains('ScanWindowsUpdatesInBackgroundAsync();')) { throw 'Windows Update nao e iniciado automaticamente' }
          if (-not $main.Contains('_ = LoadUpdatesAsync();')) { throw 'RuckZuck nao e iniciado automaticamente' }
          if (-not $main.Contains('DrawRowButton(e.Graphics, AppRowGeometry.UpdateButton')) { throw 'Botao atualizar ausente' }
          if (-not $systemUi.Contains('_processTimer.Start();')) { throw 'Amostragem automatica ausente' }
          if (-not $systemUi.Contains('WindowsUpdateClient.ScanAsync()')) { throw 'Consulta oficial do Windows Update ausente' }
          if (-not $logic.Contains('VerifiedUpdaters.Resolve(item) is not null')) { throw 'Acao Atualizar sem autorizacao de receita' }
          if (-not $main.Contains('VerifiedUpdaters.DownloadAndVerifyAsync')) { throw 'Motor de validacao de instaladores nao integrado' }
          if (-not $main.Contains('VerifiedUpdaters.GetOfficialPage')) { throw 'Opcao de site oficial ausente' }

      - name: Verificar feedback visual e disparo seguro de clique
        shell: pwsh
        run: |
          $control = Get-Content DarkControls.cs -Raw
          $main = Get-Content Program.cs -Raw
          if (-not $control.Contains('protected override void OnMouseUp(MouseEventArgs e)')) { throw 'Falta evento de soltar o botao' }
          if (-not $control.Contains('private void AdvanceButtonAnimation()')) { throw 'Falta animacao de clique' }
          if (-not $control.Contains('ActionVisual(ProgramEntry item, string action)')) { throw 'Falta feedback de estado de cada botao' }
          if (-not $main.Contains('_programList.ActionVisual(item, primaryAction)')) { throw 'Falta animacao da acao principal' }
          if (-not $main.Contains('_programList.ActionVisual(item, "site")')) { throw 'Falta animacao do botao Site' }
          if (-not $main.Contains('visual.Pressed')) { throw 'Falta movimento visual de pressao' }

      - name: Validar clique uniforme e ausencia de confirmacao redundante
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $controls = Get-Content DarkControls.cs -Raw
          $updaters = Get-Content VerifiedUpdaters.cs -Raw
          if (-not $main.Contains('private const double FeedbackMs = 145')) { throw 'Feedback visual ausente em botoes comuns' }
          if (-not $main.Contains('protected override void OnClick(EventArgs e)')) { throw 'Animacao sem controle de clique' }
          if (-not $main.Contains('base.OnClick(EventArgs.Empty)')) { throw 'Disparo do clique nao confirmado' }
          if (-not $controls.Contains('private void StartTabFeedback(int index)')) { throw 'Feedback visual ausente nas abas' }
          if (-not $controls.Contains('private const double PulseMs = 145')) { throw 'Animacao de abas ausente' }
          if (-not $controls.Contains('private void AdvanceButtonAnimation()')) { throw 'Feedback dos botoes na lista ausente' }
          if ($main.Contains('MessageBox.Show(this, confirmation, "Confirmar atualização"')) { throw 'Dialogo redundante de atualizacao permanece' }
          if (-not $main.Contains('VerifiedUpdaters.DownloadAndVerifyAsync')) { throw 'Validacao de instalador removida' }
          if (-not $updaters.Contains('helpx.adobe.com/br/acrobat/desktop/get-set-up/access-the-app/update-manual.html')) { throw 'Pagina Adobe incorreta' }

      - name: Validar protecoes, atualizacao automatica da lista e janelas escuras
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $matching = Get-Content Matching.cs -Raw
          $dialog = Get-Content DarkConfirmDialog.cs -Raw
          $tabs = Get-Content DarkControls.cs -Raw
          if (-not $main.Contains('DarkConfirmDialog.Confirm(this')) { throw 'Confirmacao escura nao integrada' }
          if (-not $main.Contains('await LoadUpdatesAsync();')) { throw 'Reconsulta automatica apos atualizar ausente' }
          if (-not $main.Contains('MatchState.SupersededRegistration')) { throw 'Registro Visual C++ antigo sem aviso' }
          if (-not $matching.Contains('SameVisualCpp2013Family')) { throw 'Validacao de arquitetura Visual C++ ausente' }
          if (-not $dialog.Contains('DialogResult.Yes')) { throw 'Confirmacao escura sem aceite explicito' }
          if ($main.Contains('foreach (Control c in _actionControls) c.Enabled = false')) { throw 'Desabilitacao global de botoes mantida' }
          if ($tabs.Contains('e.Graphics.FillRectangle(accent, bounds.X + 12, bounds.Bottom - 4')) { throw 'Sublinhado redundante mantido' }

      - name: Verificar disponibilidade de acoes para todos os candidatos
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $control = Get-Content DarkControls.cs -Raw
          $verified = Get-Content VerifiedUpdaters.cs -Raw
          if (-not $verified.Contains('GetPrimaryAction(ProgramEntry entry)')) { throw 'Politica de acoes ausente' }
          if (-not $verified.Contains('return "guide"')) { throw 'Falta orientacao para programas sem pagina oficial' }
          if (-not $main.Contains('ShowUpdateGuidance(item);')) { throw 'Acao de orientacao nao integrada' }
          if (-not $main.Contains('primaryAction is "update" or "terminal"')) { throw 'Botao secundario deve aparecer somente com receita validada' }
          if (-not $control.Contains('VerifiedUpdaters.GetPrimaryAction(item)')) { throw 'Hit test da acao principal inconsistente' }
          if (-not $verified.Contains('if (Resolve(entry) is not null) return "update"')) { throw 'Atualizar sem verificacao de receita' }

      - name: Verificar mensagens claras e filtro de candidatos
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          if (-not $main.Contains('AddFilter(heading, "Com atualização", 2, "Possíveis")')) {
            throw 'Filtro visual deve explicar que sao candidatos'
          }
          if (-not $main.Contains('Versão em catálogo (')) { throw 'Falta distinguir origem externa da Store' }
          if (-not $main.Contains('Abrir indica que não há atualização oferecida nesta página')) {
            throw 'Orientacao sobre status Abrir na Store ausente'
          }
          if (-not $main.Contains('Store aberta: clique em Verificar se há atualizações.')) {
            throw 'Orientacao de GameInput sem atualizacao confirmada ausente'
          }
          if (-not $main.Contains('TimeSpan.FromSeconds(65)')) {
            throw 'Orcamento de consulta alterado indevidamente'
          }

      - name: Testar receitas de atualizacao oficiais e isolamento
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validar download e assinatura Microsoft no Windows CI
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release -- --verify-downloads
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validar hash e assinatura do instalador oficial OBS no CI
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release -- --verify-downloads --verify-obs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Testar instalador oficial Notepad++ com SHA e assinatura
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release -- --verify-downloads --verify-npp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Conferir instaladores SumatraPDF x86/x64 sem instalar
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release -- --verify-downloads --verify-sumatra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Evitar falsos positivos e verificar botao Atualizar Notepad
        shell: pwsh
        run: |
          $code = Get-Content VerifiedUpdaters.cs -Raw
          $inventory = Get-Content Program.cs -Raw
          if (-not $code.Contains('entry.Publisher.Equals("Notepad++ Team"')) {
            throw 'O Notepad++ Team oficial precisa receber botao Atualizar'
          }
          if (-not $code.Contains('GetPortableExecutableMachine')) {
            throw 'A arquitetura Sumatra deve ser lida antes de instalar'
          }
          if (-not $code.Contains('SumatraX64Digest') -or -not $code.Contains('SumatraX86Digest')) {
            throw 'Hashes oficiais da versao 3.6.1 ausentes'
          }
          if (-not $inventory.Contains('InstallLocation = inventoryOnly ?')) {
            throw 'Local de instalacao nao integrado'
          }

      - name: Validar Store, barra de progresso e timeout independente
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $recipes = Get-Content VerifiedUpdaters.cs -Raw
          $sources = Get-Content OfficialReleaseSources.cs -Raw
          $geometry = Get-Content DarkControls.cs -Raw
          if (-not $main.Contains('OpenMicrosoftStore(item);')) { throw 'Acao Microsoft Store nao integrada' }
          if (-not $main.Contains('primaryAction switch')) { throw 'Acao contextual ausente' }
          if (-not $main.Contains('(_consultaCatalogoCts is not null ? " · Verificando..."')) { throw 'Status de consulta ausente' }
          if (-not $main.Contains('_progress.Style = ProgressBarStyle.Marquee')) { throw 'Barra de progresso ausente' }
          if (-not $main.Contains('_progress.Visible = false')) { throw 'Barra de progresso sem encerramento' }
          if ($recipes.Contains('ms-windows-store://downloadsandupdates')) { throw 'GameInput nao existe na Store' }
          if (-not $recipes.Contains('9NRX63209R7B') -or -not $recipes.Contains('9N0DX20HK701')) { throw 'IDs da Microsoft Store ausentes' }
          if (-not $sources.Contains('TimeSpan.FromSeconds(5)')) { throw 'Timeout Proton ausente' }
          if (-not $geometry.Contains('GetPrimaryAction(item)')) { throw 'Clique contextual nao implementado' }

      - name: Testar politica de fechamento seguro sem encerrar processos
        shell: pwsh
        run: |
          dotnet run --project TestesFechamento/TestesFechamento.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Conferir consentimento e encerramento apenas de programas conhecidos
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $policy = Get-Content UpdateProcessCoordinator.cs -Raw
          $preflight = Get-Content UpdateBlockingPreflight.cs -Raw
          if (-not $main.Contains('UpdateProcessTarget.WindowsTerminal')) { throw 'Fechamento Terminal ausente' }
          if (-not $preflight.Contains('UpdateProcessTarget.ObsStudio')) { throw 'Fechamento OBS ausente' }
          if (-not $main.Contains('TERMINAL_GITHUB.PROCESSOS_VERIFICADOS_FECHADOS')) { throw 'Registro de preflight ausente' }
          if (-not $policy.Contains('p.CloseMainWindow()')) { throw 'Fechamento normal deve preceder forcar' }
          if (-not $policy.Contains('p.Kill(entireProcessTree: false)')) { throw 'Encerramento deve ser dirigido' }
          if (-not $policy.Contains('FORÇAR O ENCERRAMENTO pode perder')) { throw 'Aviso explicito de risco ausente' }
          if (-not $policy.Contains('if (!confirm(')) { throw 'Consentimento nao exigido antes de fechar/forcar' }
          if (-not $policy.Contains('IsVerified(p, target)')) { throw 'Processo deve ter caminho verificado' }
          if ($policy.Contains('taskkill') -eq $false) { throw 'Documentar por que nao utilizar taskkill' }
          if ($main.Contains('Feche o OBS Studio antes de atualizar e clique em Atualizar novamente.')) {
            throw 'Aviso OBS antigo impede automatizacao segura'
          }

      - name: Validar Restart Manager nativo e preflight reutilizavel
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $scanner = Get-Content InstallerLockScanner.cs -Raw
          $preflight = Get-Content UpdateBlockingPreflight.cs -Raw
          $policy = Get-Content UpdateProcessCoordinator.cs -Raw
          if (-not $main.Contains('UpdateBlockingPreflight.ReadyAsync(')) { throw 'Preflight de bloqueios ausente' }
          if ($main.Contains('OBS.EDGE_ABERTO_OU_FECHAMENTO_RECUSADO')) { throw 'Fechamento Edge indiscriminado' }
          if (-not $scanner.Contains('RmGetList(') -or -not $scanner.Contains('RmRegisterResources(')) {
            throw 'Restart Manager nao esta integrado'
          }
          if ($scanner.Contains('RmShutdown(') -or $scanner.Contains('RmRestart(')) {
            throw 'Restart Manager nao deve fechar processos diretamente'
          }
          if (-not $preflight.Contains('InstallerLockScanner.Inspect(files)')) { throw 'Arquivos em uso nao verificados' }
          if (-not $preflight.Contains('!TryKnownTarget(p.Name, out _)')) { throw 'Processos desconhecidos devem bloquear automacao' }
          if (-not $policy.Contains('UpdateProcessTarget.BraveBrowser')) { throw 'Brave nao tratado como processo autorizado' }
          if (-not $policy.Contains('if (!confirm(firstQuestion))')) { throw 'Fechamento sem autorizacao' }
          if (-not $policy.Contains('FORÇAR O ENCERRAMENTO pode perder')) { throw 'Risco de perda omitido' }

      - name: Verificar receita GitHub MSIX do Windows Terminal
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release -- --verify-terminal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validar instalacao Terminal sem PowerShell nem bypass
        shell: pwsh
        run: |
          $service = Get-Content WindowsTerminalUpdater.cs -Raw
          $main = Get-Content Program.cs -Raw
          $verified = Get-Content VerifiedUpdaters.cs -Raw
          if (-not $service.Contains('PackageManager().AddPackageAsync')) { throw 'API nativa do Windows ausente' }
          if (-not $service.Contains('ValidateBundleIdentity(path)')) { throw 'Identidade MSIX nao conferida' }
          if (-not $service.Contains('SHA256.HashDataAsync')) { throw 'Integridade SHA-256 ausente' }
          if (-not $service.Contains('Microsoft.WindowsTerminal')) { throw 'Identidade Windows Terminal ausente' }
          if (-not $service.Contains('DeploymentOptions.None')) { throw 'Instalador altera opcoes Windows' }
          if (-not $main.Contains('UpdateWindowsTerminalAsync(item);')) { throw 'Botao nao integrado' }
          if (-not $verified.Contains('WindowsTerminalUpdater.Resolve(entry) is not null')) {
            throw 'Acao GitHub nao autorizada pelas regras de versao/editor'
          }
          if ($service.Contains('Process.Start(') -or $service.Contains('powershell.exe') -or $service.Contains('winget.exe')) {
            throw 'Motor MSIX nao deve criar executaveis auxiliares'
          }

      - name: Conferir download oficial do GameInput sem instalar
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release -- --verify-downloads --verify-gameinput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Regressao de GameInput sem Store e pacote NuGet assinado
        shell: pwsh
        run: |
          $code = Get-Content VerifiedUpdaters.cs -Raw
          $main = Get-Content Program.cs -Raw
          if ($code.Contains('ms-windows-store://downloadsandupdates')) { throw 'GameInput nao pode abrir Store' }
          if (-not $code.Contains('GameInputDigest')) { throw 'SHA Microsoft nao fixado' }
          if (-not $code.Contains('redist/GameInputRedist.msi')) { throw 'MSI oficial nao identificado' }
          if (-not $code.Contains('VerifyAuthenticode(msi')) { throw 'MSI deve ser assinado digitalmente' }
          if (-not $code.Contains('host == "globalcdn.nuget.org"')) { throw 'Host do pacote deve ser restrito' }
          if (-not $code.Contains('entry.Publisher.Trim().Equals("Microsoft Corporation"')) { throw 'Editor precisa ser Microsoft' }
          if (-not $main.Contains('VerifiedUpdaters.LaunchAsync(recipe, verifiedInstaller, Status)')) {
            throw 'Somente instalador retornado pela validação deve ser executado'
          }

      - name: Validar expansao segura de fontes oficiais
        shell: pwsh
        run: |
          $engines = Get-Content OfficialReleaseSources.cs -Raw
          $main = Get-Content Program.cs -Raw
          $test = Get-Content TestesMultifontes/Program.cs -Raw
          foreach ($origin in @('ip7z/7zip/releases/latest', 'desktop/desktop/releases/latest', 'sumatrapdfreader/sumatrapdf/releases/latest', 'thunderbird_versions.json')) {
            if (-not $engines.Contains($origin)) { throw "Fonte ausente: $origin" }
          }
          if (-not $engines.Contains('NormalizeOfficialVersionTag')) { throw 'Normalizacao de etiquetas ausente' }
          if (-not $engines.Contains('Thunderbird') -or -not $test.Contains('unknownThunderbird')) { throw 'Protecao do canal ESR ausente' }
          if (-not $main.Contains('fontes_consultadas=')) { throw 'Medicao agregada de cobertura ausente' }

      - name: Validar proteção extra de GameInput sem SystemComponent
        shell: pwsh
        run: |
          $source = Get-Content Program.cs -Raw
          $guard = Get-Content ProtectedApplications.cs -Raw
          $test = Get-Content TestesMsix/Program.cs -Raw
          if (-not $source.Contains('InventoryOnly = inventoryOnly')) { throw 'Inventário desprotegido' }
          if (-not $source.Contains('entries.Any(x => x.InventoryOnly || ProtectedApplications.IsProtectedName(x.Name))')) {
            throw 'Falta segunda barreira na desinstalação'
          }
          if (-not $guard.Contains('Microsoft GameInput')) { throw 'Nome protegido não reconhecido' }
          if (-not $test.Contains('sem SystemComponent')) { throw 'Regressão ausente' }

      - name: Testar inventario MSIX do usuario atual e duplicatas
        shell: pwsh
        run: |
          dotnet run --project TestesMsix/TestesMsix.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validar seguranca de fontes complementares sem executar WinGet
        shell: pwsh
        run: |
          $inventory = Get-Content LocalMsixInventory.cs -Raw
          $api = Get-Content OfficialReleaseSources.cs -Raw
          $main = Get-Content Program.cs -Raw
          if (-not $inventory.Contains('FindPackagesForUser(string.Empty)')) { throw 'Inventario nao usa usuario atual' }
          if (-not $inventory.Contains('8wekyb3d8bbwe')) { throw 'Verificacao do publisher ausente' }
          if (-not $api.Contains('ParseWinGetVersionDirectories')) { throw 'Parse do catalogo ausente' }
          if (-not $main.Contains('item.InventoryOnly')) { throw 'Botao de desinstalacao desprotegido' }
          foreach ($source in @('Microsoft/GameInput', 'Microsoft/Outlook')) {
            if (-not $api.Contains($source)) { throw "Fonte Microsoft ausente $source" }
          }

      - name: Testar novos canais Microsoft e Proton
        shell: pwsh
        run: |
          $src = Get-Content OfficialReleaseSources.cs -Raw
          $test = Get-Content TestesMultifontes/Program.cs -Raw
          foreach ($signature in @('edgeupdates.microsoft.com', 'microsoft/terminal/releases/latest', 'ProtonMail/WebClients/main/applications/pass-desktop/CHANGELOG.md', 'ParseEdgeStableVersion')) {
            if (-not $src.Contains($signature)) { throw "Fonte obrigatoria ausente: $signature" }
          }
          foreach ($protection in @('wrongEdge', 'wrongProton', 'wrongTerminal', 'failEdge:true', 'failProton:true')) {
            if (-not $test.Contains($protection)) { throw "Teste de isolamento ausente: $protection" }
          }

      - name: Testar motores oficiais isoladamente e fusao segura
        shell: pwsh
        run: |
          dotnet run --project TestesMultifontes/TestesMultifontes.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verificar isolamento e seguranca dos novos motores
        shell: pwsh
        run: |
          $file = Get-Content OfficialReleaseSources.cs -Raw
          $main = Get-Content Program.cs -Raw
          if ($file.Contains('Process.Start') -or $file.Contains('powershell.exe') -or $file.Contains('winget.exe')) { throw 'Motores de busca não podem executar comandos' }
          if (-not $file.Contains('IsAllowedUrl')) { throw 'Proteção de domínio ausente' }
          if (-not $file.Contains('GithubConcurrency')) { throw 'Limite de consultas paralelas ausente' }
          if (-not $file.Contains('MatchState.SupersededRegistration')) { throw 'Regras de Visual C++ sem preservação' }
          if (-not $main.Contains('Task.WhenAll(ruckTask, officialTask)')) { throw 'As consultas não estão em paralelo' }
          if (-not $main.Contains('MultiSourceMatcher.Merge')) { throw 'Fusão de fontes ausente' }
          if (-not $main.Contains('match.Provider')) { throw 'Origem do resultado não indicada' }

      - name: Testes offline de cache, concorrencia, segurança e desempenho
        shell: pwsh
        run: |
          dotnet run --project TestesCatalogo/TestesCatalogo.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verificar metricas e reconsulta manual
        shell: pwsh
        run: |
          $app = Get-Content Program.cs -Raw
          $source = Get-Content RuckZuckCatalog.cs -Raw
          $matcher = Get-Content Matching.cs -Raw
          if (-not $app.Contains('LoadUpdatesAsync(forceRefresh: true)')) { throw 'Consulta manual nao ignora cache' }
          if (-not $app.Contains('comparacao_ms=')) { throw 'Tempos de comparacao nao registrados' }
          if (-not $source.Contains('private static readonly TimeSpan MemoryTtl')) { throw 'Cache de memoria ausente' }
          if (-not $source.Contains('CacheGate.WaitAsync')) { throw 'Protecao contra consultas simultaneas ausente' }
          if (-not $matcher.Contains('Math.Max(x.Build, 0)')) { throw 'Versoes equivalentes nao normalizadas' }

      - name: Consultar fontes oficiais ao vivo (somente HTTPS GET)
        shell: pwsh
        run: |
          dotnet run --project TestesMultifontes/TestesMultifontes.csproj --configuration Release -- --live
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Testes offline do comparador
        shell: pwsh
        run: |
          dotnet run --project TestesMotor/TestesMotor.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar acesso real ao catalogo (somente GET)
        shell: pwsh
        run: |
          dotnet run --project TestesRede/TestesRede.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verificar manifesto Windows
        shell: pwsh
        run: |
          [xml]$m = Get-Content -Raw app.manifest
          $n = [System.Xml.XmlNamespaceManager]::new($m.NameTable)
          $n.AddNamespace('asm', 'urn:schemas-microsoft-com:asm.v1')
          $identity = $m.SelectSingleNode('/asm:assembly/asm:assemblyIdentity', $n)
          if ($null -eq $identity -or $identity.GetAttribute('version') -ne '5.12.21.1') { throw 'Manifesto inválido' }
      - name: Publicar portatil Windows x64
        shell: pwsh
        run: |
          if (Test-Path Distribuicao-v5.12.21.1) { Remove-Item Distribuicao-v5.12.21.1 -Force -Recurse }
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o Distribuicao-v5.12.21.1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path Distribuicao-v5.12.21.1/GerenciadorFinal.exe)) { throw 'Executável ausente' }
      - name: Validar manifesto embutido e ativacao SxS nativa no Windows
        shell: pwsh
        run: |
          ./TestesManifesto/Testar-Ativacao.ps1 -ExecutablePath './Distribuicao-v5.12.21.1/GerenciadorFinal.exe'

      - name: Registrar hash SHA-256
        shell: pwsh
        run: Get-FileHash Distribuicao-v5.12.21.1/GerenciadorFinal.exe -Algorithm SHA256 | Format-List
      - name: Publicar artefato para testes
        uses: actions/upload-artifact@v4
        with:
          name: GerenciadorFinal-v5.12.21.1-TESTE-Windows-x64-NAO-ASSINADO
          path: Distribuicao-v5.12.21.1/
          retention-days: 7
          if-no-files-found: error
