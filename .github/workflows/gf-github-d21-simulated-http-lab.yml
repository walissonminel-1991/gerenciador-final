name: GF D2.1 - transporte HTTP simulado de bytes inertes
on:
  push:
    branches: [experimento-g5-ipc-chat-alto-20261029]
    paths:
      - 'prototipos/autoatualizador-seguro/github-d21-simulated-http/**'
      - '.github/workflows/gf-github-d21-simulated-http-lab.yml'
permissions:
  contents: read
concurrency:
  group: gf-d21-http-simulation
  cancel-in-progress: false
jobs:
  windows-d21:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GF_BETA_ENDPOINT: ''
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SDK .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Bibliotecas TUF do laboratorio fixadas
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check tuf==7.0.1 securesystemslib==1.3.1 cryptography==50.0.2 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw 'GF_D21_TUF_DEPS' }
      - name: Compilar somente parser D0 em Windows descartavel
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=dotnet msbuild GerenciadorAplicativos.csproj -getItem:Compile | ConvertFrom-Json
          if (@($p.Items.Compile | Where-Object {$_.Identity -match 'prototipos[/\\]autoatualizador-seguro'}).Count -ne 0) {
            throw 'GF_D21_LEAK_IN_PRODUCT'
          }
          $dir=Join-Path $env:RUNNER_TEMP 'gf-d21-d0'
          dotnet build prototipos/autoatualizador-seguro/github-trust-lab/GF.D11.D0Probe.csproj -c Release -r win-x64 --self-contained false -o $dir --nologo
          if ($LASTEXITCODE -ne 0 -or !(Test-Path (Join-Path $dir 'GF.D11.D0Probe.exe'))) { throw 'GF_D21_BUILD' }
      - name: Streamings inertes e contraprovas de transporte
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'gf-d21-d0\GF.D11.D0Probe.exe'
          $p='prototipos/autoatualizador-seguro/github-d21-simulated-http/d21_simulated_http_lab.py'
          $line=(python $p $exe | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$line -or !$line.StartsWith('GF_D21_RESULT ')) {
            throw 'GF_D21_SUITE_NOT_COMPLETED'
          }
          $r=$line.Substring('GF_D21_RESULT '.Length) | ConvertFrom-Json
          if ($r.schema -ne 'gf-github-d21-inert-http-simulation/1' -or
              $r.status -ne 'passed' -or
              $r.positive_inert_streams -ne 3 -or
              $r.negative_streams_rejected -ne 37 -or
              !$r.d0_csharp_reused -or !$r.d1_tuf_test_manifest_verified -or
              !$r.d2_stage_writer_reused -or !$r.memory_only_http_simulation -or
              !$r.streaming_length_sha_checked -or
              !$r.outside_stage_sentinel_preserved -or
              $r.actual_http_network_tested -or
              $r.github_redirect_flow_operational -or
              $r.production_trust_root -or $r.same_user_toctou_resistance_proven -or
              $r.full_history_rollback_resistance_proven -or
              $r.real_network_requests -ne 0 -or
              $r.real_executable_downloads -ne 0 -or
              $r.installations -ne 0 -or $r.product_modified -or
              $r.operational_ready -or $r.automatic_recovery_authorized) {
            throw 'GF_D21_FALSE_TRANSPORT_OR_INSTALL_CLAIM'
          }
          Write-Host $line
# No real HTTP sockets, no deploy, release, installation or rollback.
