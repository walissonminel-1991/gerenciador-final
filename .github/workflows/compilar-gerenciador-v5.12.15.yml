name: Gerenciador Final v5.12.15 GameInput Microsoft NuGet e MSI - Windows x64

on:
  push:
    branches:
      - teste-gameinput-v5.12.15
    paths:
      - 'Program.cs'
      - 'GerenciadorAplicativos.csproj'
      - 'RuckZuckCatalog.cs'
      - 'OfficialReleaseSources.cs'
      - 'LocalMsixInventory.cs'
      - 'ProtectedApplications.cs'
      - 'TestesMsix/**'
      - 'TestesMultifontes/**'
      - 'TestesCatalogo/**'
      - 'RuckZuckModels.cs'
      - 'Matching.cs'
      - 'DarkControls.cs'
      - 'DarkConfirmDialog.cs'
      - 'Matching.cs'
      - 'RuckZuckModels.cs'
      - 'VerifiedUpdaters.cs'
      - 'TestesAtualizador/**'
      - 'IntegratedSystemUi.cs'
      - 'AdvancedFeatures.cs'
      - 'DiagnosticTrace.cs'
      - 'app.manifest'
      - 'TestesManifesto/**'
      - 'VerifiedUpdaters.cs'
      - 'TestesAtualizador/**'
      - '.github/workflows/compilar-gerenciador-v5.12.7.yml'
      - 'TestesMotor/**'
      - 'TestesRede/**'
      - '.github/workflows/compilar-gerenciador-v5.12.15.yml'




  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-e-publicar:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar rotinas de inicializacao e atualizacao segura
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $systemUi = Get-Content IntegratedSystemUi.cs -Raw
          $logic = Get-Content DarkControls.cs -Raw
          if (-not $main.Contains('BeginStartupChecks();')) { throw 'Inicializacao automatica ausente' }
          if (-not $main.Contains('ScanWindowsUpdatesInBackgroundAsync();')) { throw 'Windows Update nao e iniciado automaticamente' }
          if (-not $main.Contains('_ = LoadUpdatesAsync();')) { throw 'RuckZuck nao e iniciado automaticamente' }
          if (-not $main.Contains('DrawRowButton(e.Graphics, AppRowGeometry.UpdateButton')) { throw 'Botao atualizar ausente' }
          if (-not $systemUi.Contains('_processTimer.Start();')) { throw 'Amostragem automatica ausente' }
          if (-not $systemUi.Contains('WindowsUpdateClient.ScanAsync()')) { throw 'Consulta oficial do Windows Update ausente' }
          if (-not $logic.Contains('VerifiedUpdaters.Resolve(item) is not null')) { throw 'Acao Atualizar sem autorizacao de receita' }
          if (-not $main.Contains('VerifiedUpdaters.DownloadAndVerifyAsync')) { throw 'Motor de validacao de instaladores nao integrado' }
          if (-not $main.Contains('VerifiedUpdaters.GetOfficialPage')) { throw 'Opcao de site oficial ausente' }

      - name: Verificar feedback visual e disparo seguro de clique
        shell: pwsh
        run: |
          $control = Get-Content DarkControls.cs -Raw
          $main = Get-Content Program.cs -Raw
          if (-not $control.Contains('protected override void OnMouseUp(MouseEventArgs e)')) { throw 'Falta evento de soltar o botao' }
          if (-not $control.Contains('private void AdvanceButtonAnimation()')) { throw 'Falta animacao de clique' }
          if (-not $control.Contains('ActionVisual(ProgramEntry item, string action)')) { throw 'Falta feedback de estado de cada botao' }
          if (-not $main.Contains('_programList.ActionVisual(item, primaryAction)')) { throw 'Falta animacao da acao principal' }
          if (-not $main.Contains('_programList.ActionVisual(item, "site")')) { throw 'Falta animacao do botao Site' }
          if (-not $main.Contains('visual.Pressed')) { throw 'Falta movimento visual de pressao' }

      - name: Validar clique uniforme e ausencia de confirmacao redundante
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $controls = Get-Content DarkControls.cs -Raw
          $updaters = Get-Content VerifiedUpdaters.cs -Raw
          if (-not $main.Contains('private const double FeedbackMs = 145')) { throw 'Feedback visual ausente em botoes comuns' }
          if (-not $main.Contains('protected override void OnClick(EventArgs e)')) { throw 'Animacao sem controle de clique' }
          if (-not $main.Contains('base.OnClick(EventArgs.Empty)')) { throw 'Disparo do clique nao confirmado' }
          if (-not $controls.Contains('private void StartTabFeedback(int index)')) { throw 'Feedback visual ausente nas abas' }
          if (-not $controls.Contains('private const double PulseMs = 145')) { throw 'Animacao de abas ausente' }
          if (-not $controls.Contains('private void AdvanceButtonAnimation()')) { throw 'Feedback dos botoes na lista ausente' }
          if ($main.Contains('MessageBox.Show(this, confirmation, "Confirmar atualização"')) { throw 'Dialogo redundante de atualizacao permanece' }
          if (-not $main.Contains('VerifiedUpdaters.DownloadAndVerifyAsync')) { throw 'Validacao de instalador removida' }
          if (-not $updaters.Contains('helpx.adobe.com/br/acrobat/desktop/get-set-up/access-the-app/update-manual.html')) { throw 'Pagina Adobe incorreta' }

      - name: Validar protecoes, atualizacao automatica da lista e janelas escuras
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $matching = Get-Content Matching.cs -Raw
          $dialog = Get-Content DarkConfirmDialog.cs -Raw
          $tabs = Get-Content DarkControls.cs -Raw
          if (-not $main.Contains('DarkConfirmDialog.Confirm(this')) { throw 'Confirmacao escura nao integrada' }
          if (-not $main.Contains('await LoadUpdatesAsync();')) { throw 'Reconsulta automatica apos atualizar ausente' }
          if (-not $main.Contains('MatchState.SupersededRegistration')) { throw 'Registro Visual C++ antigo sem aviso' }
          if (-not $matching.Contains('SameVisualCpp2013Family')) { throw 'Validacao de arquitetura Visual C++ ausente' }
          if (-not $dialog.Contains('DialogResult.Yes')) { throw 'Confirmacao escura sem aceite explicito' }
          if ($main.Contains('foreach (Control c in _actionControls) c.Enabled = false')) { throw 'Desabilitacao global de botoes mantida' }
          if ($tabs.Contains('e.Graphics.FillRectangle(accent, bounds.X + 12, bounds.Bottom - 4')) { throw 'Sublinhado redundante mantido' }

      - name: Verificar disponibilidade de acoes para todos os candidatos
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $control = Get-Content DarkControls.cs -Raw
          $verified = Get-Content VerifiedUpdaters.cs -Raw
          if (-not $verified.Contains('GetPrimaryAction(ProgramEntry entry)')) { throw 'Politica de acoes ausente' }
          if (-not $verified.Contains('return "guide"')) { throw 'Falta orientacao para programas sem pagina oficial' }
          if (-not $main.Contains('ShowUpdateGuidance(item);')) { throw 'Acao de orientacao nao integrada' }
          if (-not $main.Contains('primaryAction == "update"')) { throw 'Botao secundario deve aparecer somente com receita validada' }
          if (-not $control.Contains('VerifiedUpdaters.GetPrimaryAction(item)')) { throw 'Hit test da acao principal inconsistente' }
          if (-not $verified.Contains('if (Resolve(entry) is not null) return "update"')) { throw 'Atualizar sem verificacao de receita' }

      - name: Verificar mensagens claras e filtro de candidatos
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          if (-not $main.Contains('AddFilter(heading, "Com atualização", 2, "Possíveis")')) {
            throw 'Filtro visual deve explicar que sao candidatos'
          }
          if (-not $main.Contains('Versão em catálogo (')) { throw 'Falta distinguir origem externa da Store' }
          if (-not $main.Contains('Abrir indica que não há atualização oferecida nesta página')) {
            throw 'Orientacao sobre status Abrir na Store ausente'
          }
          if (-not $main.Contains('Store aberta: clique em Verificar se há atualizações.')) {
            throw 'Orientacao de GameInput sem atualizacao confirmada ausente'
          }
          if (-not $main.Contains('TimeSpan.FromSeconds(65)')) {
            throw 'Orcamento de consulta alterado indevidamente'
          }

      - name: Testar receitas de atualizacao oficiais e isolamento
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validar download e assinatura Microsoft no Windows CI
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release -- --verify-downloads
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validar hash e assinatura do instalador oficial OBS no CI
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release -- --verify-downloads --verify-obs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Testar instalador oficial Notepad++ com SHA e assinatura
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release -- --verify-downloads --verify-npp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validar Store, barra de progresso e timeout independente
        shell: pwsh
        run: |
          $main = Get-Content Program.cs -Raw
          $recipes = Get-Content VerifiedUpdaters.cs -Raw
          $sources = Get-Content OfficialReleaseSources.cs -Raw
          $geometry = Get-Content DarkControls.cs -Raw
          if (-not $main.Contains('OpenMicrosoftStore(item);')) { throw 'Acao Microsoft Store nao integrada' }
          if (-not $main.Contains('primaryAction switch')) { throw 'Acao contextual ausente' }
          if (-not $main.Contains('(_consultaCatalogoCts is not null ? " · Verificando..."')) { throw 'Status de consulta ausente' }
          if (-not $main.Contains('_progress.Style = ProgressBarStyle.Marquee')) { throw 'Barra de progresso ausente' }
          if (-not $main.Contains('_progress.Visible = false')) { throw 'Barra de progresso sem encerramento' }
          if (-not $recipes.Contains('ms-windows-store://downloadsandupdates')) { throw 'GameInput deve abrir atualizacoes da Store' }
          if (-not $recipes.Contains('9NRX63209R7B') -or -not $recipes.Contains('9N0DX20HK701')) { throw 'IDs da Microsoft Store ausentes' }
          if (-not $sources.Contains('TimeSpan.FromSeconds(5)')) { throw 'Timeout Proton ausente' }
          if (-not $geometry.Contains('GetPrimaryAction(item)')) { throw 'Clique contextual nao implementado' }

      - name: Conferir download oficial do GameInput sem instalar
        shell: pwsh
        run: |
          dotnet run --project TestesAtualizador/TestesAtualizador.csproj --configuration Release -- --verify-downloads --verify-gameinput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Regressao de GameInput sem Store e pacote NuGet assinado
        shell: pwsh
        run: |
          $code = Get-Content VerifiedUpdaters.cs -Raw
          $main = Get-Content Program.cs -Raw
          if ($code.Contains('ms-windows-store://downloadsandupdates')) { throw 'GameInput nao pode abrir Store' }
          if (-not $code.Contains('GameInputDigest')) { throw 'SHA Microsoft nao fixado' }
          if (-not $code.Contains('redist/GameInputRedist.msi')) { throw 'MSI oficial nao identificado' }
          if (-not $code.Contains('VerifyAuthenticode(msi')) { throw 'MSI deve ser assinado digitalmente' }
          if (-not $code.Contains('host == "globalcdn.nuget.org"')) { throw 'Host do pacote deve ser restrito' }
          if (-not $code.Contains('Matching.NormalizePublisher(entry.Publisher) == "microsoft"')) { throw 'Editor precisa ser Microsoft' }
          if (-not $main.Contains('VerifiedUpdaters.LaunchAsync(recipe, verifiedInstaller, Status)')) {
            throw 'Somente instalador retornado pela validação deve ser executado'
          }

      - name: Validar expansao segura de fontes oficiais
        shell: pwsh
        run: |
          $engines = Get-Content OfficialReleaseSources.cs -Raw
          $main = Get-Content Program.cs -Raw
          $test = Get-Content TestesMultifontes/Program.cs -Raw
          foreach ($origin in @('ip7z/7zip/releases/latest', 'desktop/desktop/releases/latest', 'sumatrapdfreader/sumatrapdf/releases/latest', 'thunderbird_versions.json')) {
            if (-not $engines.Contains($origin)) { throw "Fonte ausente: $origin" }
          }
          if (-not $engines.Contains('NormalizeOfficialVersionTag')) { throw 'Normalizacao de etiquetas ausente' }
          if (-not $engines.Contains('Thunderbird') -or -not $test.Contains('unknownThunderbird')) { throw 'Protecao do canal ESR ausente' }
          if (-not $main.Contains('fontes_consultadas=')) { throw 'Medicao agregada de cobertura ausente' }

      - name: Validar proteção extra de GameInput sem SystemComponent
        shell: pwsh
        run: |
          $source = Get-Content Program.cs -Raw
          $guard = Get-Content ProtectedApplications.cs -Raw
          $test = Get-Content TestesMsix/Program.cs -Raw
          if (-not $source.Contains('InventoryOnly = inventoryOnly')) { throw 'Inventário desprotegido' }
          if (-not $source.Contains('entries.Any(x => x.InventoryOnly || ProtectedApplications.IsProtectedName(x.Name))')) {
            throw 'Falta segunda barreira na desinstalação'
          }
          if (-not $guard.Contains('Microsoft GameInput')) { throw 'Nome protegido não reconhecido' }
          if (-not $test.Contains('sem SystemComponent')) { throw 'Regressão ausente' }

      - name: Testar inventario MSIX do usuario atual e duplicatas
        shell: pwsh
        run: |
          dotnet run --project TestesMsix/TestesMsix.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validar seguranca de fontes complementares sem executar WinGet
        shell: pwsh
        run: |
          $inventory = Get-Content LocalMsixInventory.cs -Raw
          $api = Get-Content OfficialReleaseSources.cs -Raw
          $main = Get-Content Program.cs -Raw
          if (-not $inventory.Contains('FindPackagesForUser(string.Empty)')) { throw 'Inventario nao usa usuario atual' }
          if (-not $inventory.Contains('8wekyb3d8bbwe')) { throw 'Verificacao do publisher ausente' }
          if (-not $api.Contains('ParseWinGetVersionDirectories')) { throw 'Parse do catalogo ausente' }
          if (-not $main.Contains('item.InventoryOnly')) { throw 'Botao de desinstalacao desprotegido' }
          foreach ($source in @('Microsoft/GameInput', 'Microsoft/Outlook')) {
            if (-not $api.Contains($source)) { throw "Fonte Microsoft ausente $source" }
          }

      - name: Testar novos canais Microsoft e Proton
        shell: pwsh
        run: |
          $src = Get-Content OfficialReleaseSources.cs -Raw
          $test = Get-Content TestesMultifontes/Program.cs -Raw
          foreach ($signature in @('edgeupdates.microsoft.com', 'microsoft/terminal/releases/latest', 'ProtonMail/WebClients/main/applications/pass-desktop/CHANGELOG.md', 'ParseEdgeStableVersion')) {
            if (-not $src.Contains($signature)) { throw "Fonte obrigatoria ausente: $signature" }
          }
          foreach ($protection in @('wrongEdge', 'wrongProton', 'wrongTerminal', 'failEdge:true', 'failProton:true')) {
            if (-not $test.Contains($protection)) { throw "Teste de isolamento ausente: $protection" }
          }

      - name: Testar motores oficiais isoladamente e fusao segura
        shell: pwsh
        run: |
          dotnet run --project TestesMultifontes/TestesMultifontes.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verificar isolamento e seguranca dos novos motores
        shell: pwsh
        run: |
          $file = Get-Content OfficialReleaseSources.cs -Raw
          $main = Get-Content Program.cs -Raw
          if ($file.Contains('Process.Start') -or $file.Contains('powershell.exe') -or $file.Contains('winget.exe')) { throw 'Motores de busca não podem executar comandos' }
          if (-not $file.Contains('IsAllowedUrl')) { throw 'Proteção de domínio ausente' }
          if (-not $file.Contains('GithubConcurrency')) { throw 'Limite de consultas paralelas ausente' }
          if (-not $file.Contains('MatchState.SupersededRegistration')) { throw 'Regras de Visual C++ sem preservação' }
          if (-not $main.Contains('Task.WhenAll(ruckTask, officialTask)')) { throw 'As consultas não estão em paralelo' }
          if (-not $main.Contains('MultiSourceMatcher.Merge')) { throw 'Fusão de fontes ausente' }
          if (-not $main.Contains('match.Provider')) { throw 'Origem do resultado não indicada' }

      - name: Testes offline de cache, concorrencia, segurança e desempenho
        shell: pwsh
        run: |
          dotnet run --project TestesCatalogo/TestesCatalogo.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verificar metricas e reconsulta manual
        shell: pwsh
        run: |
          $app = Get-Content Program.cs -Raw
          $source = Get-Content RuckZuckCatalog.cs -Raw
          $matcher = Get-Content Matching.cs -Raw
          if (-not $app.Contains('LoadUpdatesAsync(forceRefresh: true)')) { throw 'Consulta manual nao ignora cache' }
          if (-not $app.Contains('comparacao_ms=')) { throw 'Tempos de comparacao nao registrados' }
          if (-not $source.Contains('private static readonly TimeSpan MemoryTtl')) { throw 'Cache de memoria ausente' }
          if (-not $source.Contains('CacheGate.WaitAsync')) { throw 'Protecao contra consultas simultaneas ausente' }
          if (-not $matcher.Contains('Math.Max(x.Build, 0)')) { throw 'Versoes equivalentes nao normalizadas' }

      - name: Consultar fontes oficiais ao vivo (somente HTTPS GET)
        shell: pwsh
        run: |
          dotnet run --project TestesMultifontes/TestesMultifontes.csproj --configuration Release -- --live
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Testes offline do comparador
        shell: pwsh
        run: |
          dotnet run --project TestesMotor/TestesMotor.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar acesso real ao catalogo (somente GET)
        shell: pwsh
        run: |
          dotnet run --project TestesRede/TestesRede.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verificar manifesto Windows
        shell: pwsh
        run: |
          [xml]$m = Get-Content -Raw app.manifest
          $n = [System.Xml.XmlNamespaceManager]::new($m.NameTable)
          $n.AddNamespace('asm', 'urn:schemas-microsoft-com:asm.v1')
          $identity = $m.SelectSingleNode('/asm:assembly/asm:assemblyIdentity', $n)
          if ($null -eq $identity -or $identity.GetAttribute('version') -ne '5.12.15.0') { throw 'Manifesto inválido' }
      - name: Publicar portatil Windows x64
        shell: pwsh
        run: |
          if (Test-Path Distribuicao-v5.12.15) { Remove-Item Distribuicao-v5.12.15 -Force -Recurse }
          dotnet publish GerenciadorAplicativos.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o Distribuicao-v5.12.15
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path Distribuicao-v5.12.15/GerenciadorFinal.exe)) { throw 'Executável ausente' }
      - name: Validar manifesto embutido e ativacao SxS nativa no Windows
        shell: pwsh
        run: |
          ./TestesManifesto/Testar-Ativacao.ps1 -ExecutablePath './Distribuicao-v5.12.15/GerenciadorFinal.exe'

      - name: Registrar hash SHA-256
        shell: pwsh
        run: Get-FileHash Distribuicao-v5.12.15/GerenciadorFinal.exe -Algorithm SHA256 | Format-List
      - name: Publicar artefato para testes
        uses: actions/upload-artifact@v4
        with:
          name: GerenciadorFinal-v5.12.15-TESTE-Windows-x64-NAO-ASSINADO
          path: Distribuicao-v5.12.15/
          retention-days: 7
          if-no-files-found: error
